<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Month-End Close | Rosie Dazzlers Admin</title><meta name="robots" content="noindex,nofollow"/><link rel="stylesheet" href="/assets/site.css"/><style>.status{margin:12px 0;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}.grid{display:grid;gap:14px}.card{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{color:#94a3b8}pre{white-space:pre-wrap;overflow:auto;max-height:320px}</style></head><body data-page="admin-close" data-build185="month-end-close-checklist"><header class="nav"><div class="nav-inner"><a class="brand" href="/admin.html"><img data-logo alt="Rosie Dazzlers logo"/><strong>Rosie Dazzlers Admin</strong></a><button id="navToggle" class="btn small ghost nav-toggle" type="button" aria-expanded="false" aria-controls="navLinks">Menu</button><nav id="navLinks" class="nav-links"><a href="/admin.html">Dashboard</a><a href="/admin-payments.html">Payments</a><a href="/admin-media-health.html">Media Health</a></nav></div></header><main class="container"><div class="status" data-page-status hidden></div><section class="hero compact"><p class="eyebrow">Build 185</p><h1 style="margin:10px 0 6px">Month-end close checklist</h1><p class="kicker" style="margin:0;max-width:850px">Track month-end payment close work, receipt retries, refund checks, exports, and HST/GST review notes.</p></section><div class="grid"><div data-admin-menu-mount></div><section class="section"><div class="panel"><div class="toolbar"><input id="period" placeholder="YYYY-MM"/><button class="btn primary" id="loadClose">Load checklist</button><button class="btn ghost" id="saveClose">Save checklist</button></div><div id="closeOut" class="card muted">Ready.</div><textarea id="closeNotes" style="width:100%;min-height:90px" placeholder="Close notes"></textarea></div></section></div></main><footer class="footer container" data-footer></footer><script src="/assets/admin-auth.js"></script><script src="/assets/admin-shell.js"></script><script src="/assets/admin-menu.js"></script><script src="/assets/chrome.js"></script><script>
(function(){const s=document.querySelector('[data-page-status]'),out=document.getElementById('closeOut'),period=document.getElementById('period'),notes=document.getElementById('closeNotes');let items=[];period.value=new Date().toISOString().slice(0,7);function set(m,t){s.hidden=!m;s.textContent=m||'';s.dataset.state=t||''}async function api(p,b,method='POST'){const r=await fetch(p,{method,credentials:'include',headers:{'Content-Type':'application/json'},body:method==='GET'?undefined:JSON.stringify(b||{})});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||'Request failed');return d}function render(){out.innerHTML=items.map((it,i)=>'<label style="display:block;margin:8px 0"><input type="checkbox" data-i="'+i+'" '+(it.done?'checked':'')+'> '+(it.label||it)+'</label>').join('')}async function load(){set('Loading close checklist…');const d=await fetch('/api/admin/month_end_close_checklist?period='+encodeURIComponent(period.value),{credentials:'include'}).then(r=>r.json());const c=d.checklist||d;items=c.items||d.items||[];notes.value=c.notes||'';render();set('Close checklist loaded.','success')}async function save(){items=[...out.querySelectorAll('input')].map((el,i)=>({label:(items[i]?.label||items[i]),done:el.checked}));const d=await api('/api/admin/month_end_close_checklist',{period:period.value,items,notes:notes.value,status:items.every(x=>x.done)?'ready_for_accountant':'open'});set(d.ok?'Close checklist saved.':'Save failed.',d.ok?'success':'error')}document.getElementById('loadClose').onclick=()=>load().catch(e=>set(e.message,'error'));document.getElementById('saveClose').onclick=()=>save().catch(e=>set(e.message,'error'));window.AdminShell.boot({pageKey:'admin-close',onReady:()=>{window.AdminMenu.render({currentPage:'admin-close'});load().catch(e=>set(e.message,'error'))}})})();</script></body></html>
