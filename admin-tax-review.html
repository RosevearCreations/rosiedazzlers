<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>HST/GST Review | Rosie Dazzlers Admin</title><meta name="robots" content="noindex,nofollow"/><link rel="stylesheet" href="/assets/site.css"/><style>.status{margin:12px 0;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}.grid{display:grid;gap:14px}.card{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{color:#94a3b8}pre{white-space:pre-wrap;overflow:auto;max-height:320px}</style></head><body data-page="admin-tax-review" data-build185="hst-gst-review-screen"><header class="nav"><div class="nav-inner"><a class="brand" href="/admin.html"><img data-logo alt="Rosie Dazzlers logo"/><strong>Rosie Dazzlers Admin</strong></a><button id="navToggle" class="btn small ghost nav-toggle" type="button" aria-expanded="false" aria-controls="navLinks">Menu</button><nav id="navLinks" class="nav-links"><a href="/admin.html">Dashboard</a><a href="/admin-payments.html">Payments</a><a href="/admin-media-health.html">Media Health</a></nav></div></header><main class="container"><div class="status" data-page-status hidden></div><section class="hero compact"><p class="eyebrow">Build 185</p><h1 style="margin:10px 0 6px">HST/GST review</h1><p class="kicker" style="margin:0;max-width:850px">Review tax-included quote deposits, refunds, and estimated Ontario HST before payment close or accountant export.</p></section><div class="grid"><div data-admin-menu-mount></div><section class="section"><div class="panel"><div class="toolbar"><label>Review status<select id="taxReviewStatus" data-option-library="tax_review_statuses"><option value="needs_review">needs review</option><option value="reviewed">reviewed</option><option value="ready_for_close">ready for close</option></select></label><button class="btn primary" id="loadTax">Load HST/GST summary</button><a class="btn ghost" href="/admin-payments.html">Back to Payments</a></div><div id="taxOut" class="card muted">Ready to load.</div></div></section></div></main><footer class="footer container" data-footer></footer><script src="/assets/admin-auth.js"></script>
  <script src="/assets/admin-option-libraries.js"></script><script src="/assets/admin-shell.js"></script><script src="/assets/admin-menu.js"></script><script src="/assets/chrome.js"></script><script>
(function(){const s=document.querySelector('[data-page-status]'),out=document.getElementById('taxOut');function set(m,t){s.hidden=!m;s.textContent=m||'';s.dataset.state=t||''}function money(c){return '$'+(Number(c||0)/100).toFixed(2)}async function api(p,b){const r=await fetch(p,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||'Request failed');return d}async function load(){set('Loading tax summary…');const d=await api('/api/admin/payment_tax_review_summary',{});const x=d.summary||{};out.innerHTML='<strong>Estimated tax-included review</strong><p>Gross collected: '+money(x.gross_collected_cents)+'<br>Refunds: '+money(x.refunds_cents)+'<br>Net tax-included: '+money(x.net_tax_included_cents)+'<br>Estimated pre-tax: '+money(x.estimated_pre_tax_cents)+'<br>Estimated HST: '+money(x.estimated_hst_cents)+'</p><pre>'+JSON.stringify(d,null,2)+'</pre>';set('Tax review loaded.','success')}document.getElementById('loadTax').addEventListener('click',()=>load().catch(e=>set(e.message,'error')));window.AdminShell.boot({pageKey:'admin-tax-review',onReady:()=>{window.AdminMenu.render({currentPage:'admin-tax-review'});load().catch(e=>set(e.message,'error'))}})})();</script></body></html>
