<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Local SEO Tasks | Rosie Dazzlers Admin</title><meta name="robots" content="noindex,nofollow"/><link rel="stylesheet" href="/assets/site.css"/><style>.status{margin:12px 0;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}.grid{display:grid;gap:14px}.card{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{color:#94a3b8}pre{white-space:pre-wrap;overflow:auto;max-height:320px}</style></head><body data-page="admin-seo-tasks" data-build185="search-console-local-seo-task-cards"><header class="nav"><div class="nav-inner"><a class="brand" href="/admin.html"><img data-logo alt="Rosie Dazzlers logo"/><strong>Rosie Dazzlers Admin</strong></a><button id="navToggle" class="btn small ghost nav-toggle" type="button" aria-expanded="false" aria-controls="navLinks">Menu</button><nav id="navLinks" class="nav-links"><a href="/admin.html">Dashboard</a><a href="/admin-payments.html">Payments</a><a href="/admin-media-health.html">Media Health</a></nav></div></header><main class="container"><div class="status" data-page-status hidden></div><section class="hero compact"><p class="eyebrow">Build 185</p><h1 style="margin:10px 0 6px">Search Console and local SEO task cards</h1><p class="kicker" style="margin:0;max-width:850px">Turn Search Console/local proof gaps into assignable town, service, gallery, and content tasks.</p></section><div class="grid"><div data-admin-menu-mount></div><section class="section"><div class="panel"><div class="toolbar"><button class="btn primary" id="loadSeo">Load tasks</button><button class="btn ghost" id="seedSeo">Create sample task</button></div><div id="seoOut" class="grid muted">Ready.</div></div></section></div></main><footer class="footer container" data-footer></footer><script src="/assets/admin-auth.js"></script><script src="/assets/admin-shell.js"></script><script src="/assets/admin-menu.js"></script><script src="/assets/chrome.js"></script><script>
(function(){const s=document.querySelector('[data-page-status]'),out=document.getElementById('seoOut');function set(m,t){s.hidden=!m;s.textContent=m||'';s.dataset.state=t||''}async function api(p,b){const r=await fetch(p,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||'Request failed');return d}async function load(){const d=await api('/api/admin/local_seo_task_cards_list',{});out.innerHTML=(d.tasks||[]).map(t=>'<div class="card"><strong>'+esc(t.title)+'</strong><p class="muted">'+esc(t.status||'needed')+' · '+esc(t.town||'all towns')+' · '+esc(t.service||'all services')+'</p></div>').join('')||'<div class="card">No SEO tasks yet.</div>';set('SEO tasks loaded.','success')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('loadSeo').onclick=()=>load().catch(e=>set(e.message,'error'));document.getElementById('seedSeo').onclick=()=>api('/api/admin/local_seo_task_cards_save',{title:'Review Search Console queries and add one local proof block',task_type:'search_console_review',priority:70,status:'needed'}).then(load).catch(e=>set(e.message,'error'));window.AdminShell.boot({pageKey:'admin-seo-tasks',onReady:()=>{window.AdminMenu.render({currentPage:'admin-seo-tasks'});load().catch(e=>set(e.message,'error'))}})})();</script></body></html>
