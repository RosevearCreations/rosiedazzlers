<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Media Health | Rosie Dazzlers Admin</title>
  <meta name="description" content="Check required Rosie Dazzlers public image and video assets before reviewing the application." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/assets/site.css" />
  <style>
    .shell-status{margin-bottom:16px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:#e5e7eb}.shell-status[data-state="error"]{background:rgba(220,38,38,.12);border-color:rgba(248,113,113,.25);color:#fecaca}.shell-status[data-state="success"]{background:rgba(22,163,74,.12);border-color:rgba(74,222,128,.25);color:#bbf7d0}.admin-layout{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:18px;align-items:start}.asset-grid{display:grid;gap:10px}.asset-card{padding:13px 14px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}.asset-card.missing{border-color:rgba(248,113,113,.32);background:rgba(127,29,29,.14)}.asset-card.ok{border-color:rgba(74,222,128,.24);background:rgba(22,101,52,.10)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.pill{display:inline-flex;border-radius:999px;padding:4px 9px;background:rgba(59,130,246,.16);border:1px solid rgba(96,165,250,.22);font-size:.84rem;color:#dbeafe}.pill.bad{background:rgba(220,38,38,.14);border-color:rgba(248,113,113,.25);color:#fecaca}.pill.good{background:rgba(22,163,74,.15);border-color:rgba(74,222,128,.25);color:#bbf7d0}.muted{color:#94a3b8}code{overflow-wrap:anywhere}@media(max-width:850px){.admin-layout{grid-template-columns:1fr}}
  </style>
</head>
<body data-page="admin-media-health" data-build184="media-health-scan">
  <header class="nav"><div class="nav-inner"><a class="brand" href="/admin.html"><img data-logo alt="Rosie Dazzlers logo" /><strong>Rosie Dazzlers Admin</strong></a><button id="navToggle" class="btn small ghost nav-toggle" type="button" aria-expanded="false" aria-controls="navLinks">Menu</button><nav id="navLinks" class="nav-links"><a href="/admin.html">Dashboard</a><a href="/admin-payments.html">Payments</a><a href="/admin-app.html">App Management</a></nav></div></header>
  <main class="container"><div class="shell-status" data-page-status hidden></div><section class="hero compact"><p class="eyebrow">Build 184 media health</p><h1 style="margin:10px 0 6px">Media and image health</h1><p class="kicker" style="margin:0;max-width:850px">Scan required Rosie Dazzlers public images and videos, find missing R2 assets, and use the upload instructions from IMAGES.md before reviewing the public site.</p></section><div class="admin-layout"><div data-admin-menu-mount></div><section class="section"><div class="toolbar"><button class="btn primary" id="runScan" type="button">Run image health scan</button><a class="btn ghost" href="/IMAGES.md">Open IMAGES.md</a></div><div id="scanSummary" class="muted" style="margin:14px 0">Ready to scan.</div><div id="assetList" class="asset-grid"></div></section></div></main>
  <footer class="footer container" data-footer></footer>
  <script src="/assets/admin-auth.js"></script><script src="/assets/admin-shell.js"></script><script src="/assets/admin-menu.js"></script><script src="/assets/chrome.js"></script>
  <script>
    (function(){const status=document.querySelector('[data-page-status]'),list=document.getElementById('assetList'),summary=document.getElementById('scanSummary');function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}function setStatus(msg,type){status.hidden=!msg;status.textContent=msg||'';status.dataset.state=type||'';}function pill(t,c){return `<span class="pill ${c||''}">${esc(t||'—')}</span>`;}async function scan(){setStatus('Scanning public media URLs…');summary.textContent='Checking R2/public URLs…';list.innerHTML='';const res=await fetch('/api/admin/media_asset_health_scan',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:120})});const data=await res.json().catch(()=>null);if(!res.ok||!data?.ok)throw new Error(data?.error||'Media scan failed.');summary.innerHTML=`Checked <strong>${Number(data.checked_count||0)}</strong> assets. Missing/not public: <strong>${Number(data.missing_count||0)}</strong>.`;list.innerHTML=(data.assets||[]).map(a=>`<article class="asset-card ${a.ok?'ok':'missing'}"><strong>${esc(a.label)}</strong><div class="meta">${pill(a.category)}${pill(a.ok?'public':'missing/not public',a.ok?'good':'bad')}${pill('HTTP '+(a.status||0),a.ok?'good':'bad')}</div><div class="muted">Required: ${esc(a.required_size)}<br>Upload: <code>${esc(a.r2_key)}</code><br>URL: <code>${esc(a.url)}</code></div></article>`).join('');setStatus(data.missing_count?'Scan complete: upload missing files listed below.':'Scan complete: checked files are public.',data.missing_count?'error':'success');}
    document.getElementById('runScan').addEventListener('click',()=>scan().catch(err=>setStatus(err.message||'Scan failed.','error')));window.AdminShell.boot({pageKey:'admin-media-health',onReady:async()=>{window.AdminMenu.render({currentPage:'admin-media-health'});await scan().catch(err=>setStatus(err.message||'Could not load media health.','error'));}});})();
  </script>
</body>
</html>
