name: Build 395 — Production Business Acceptance & Growth Readiness

on:
  push:
    branches:
      - 'build395-*'
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build395-growth-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-business-growth-readiness:
    name: production-business-growth-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Build 395 source authority
        run: |
          python -m py_compile scripts/build395_production_business_growth_readiness_check.py
          python scripts/build395_production_business_growth_readiness_check.py

      - name: Validate durable Production business acceptance
        run: python scripts/production_business_acceptance_check.py

      - name: Validate living release convergence
        run: python scripts/release_authority_documentation_convergence_check.py

      - name: Growth readiness summary
        run: |
          {
            echo "### Build 395 — Production Business Acceptance & Growth Readiness"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Whole-platform retained authority convergence: PASS"
            echo "- Durable Production business acceptance source contract: PASS"
            echo "- Living release/document convergence: PASS"
            echo "- Schema/provider/business-data/destructive R2 mutation: NONE"
          } >> "$GITHUB_STEP_SUMMARY"

  production-exact-sha:
    name: Verify exact Production deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: production-business-growth-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}
      CF_PROJECT_NAME: rosiedazzlers
      CF_PRODUCTION_BRANCH: main
      CF_PRODUCTION_URL: https://rosiedazzlers.ca
    steps:
      - name: Checkout exact Production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact Cloudflare Production deployment and runtime
        run: bash scripts/cloudflare_pages_production_acceptance.sh
