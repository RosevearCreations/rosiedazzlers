name: Build 300 Development Source Gate

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build300-development-source
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Development through Build 300
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Build 300 syntax
        run: |
          python -m py_compile scripts/build300_release_check.py
          bash -n scripts/build300_http_smoke.sh
          node --check assets/admin-payments-v300.js
      - name: Run retained focused guards through Build 299
        run: |
          for build in $(seq 271 299); do python "scripts/build${build}_release_check.py"; done
      - name: Run Build 300 exact extraction guard
        run: python scripts/build300_release_check.py
      - name: Run retained authorization and cumulative guards
        run: |
          node scripts/build290_action_permission_test.mjs
          python scripts/build290_rollback_check.py
          python scripts/release_check.py
          python scripts/seo_h1_check.py
          python scripts/sync_route_copies.py --check
      - name: Check source hygiene outside byte-for-byte extracted runtime
        run: git diff --check d3976aaa8445684b18cf6b44bc2a819d8c8f4914 HEAD -- . ':!*.md' ':!assets/admin-payments-v300.js'
