name: Build 490 — Recovery & Authenticated Device Evidence Continuity Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-recovery-authenticated-device-evidence-continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: recovery-authenticated-device-evidence-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/recovery_authenticated_device_evidence_continuity_check.py
          node --check functions/api/_lib/recovery-authenticated-device-evidence-continuity.js
          node --check functions/api/admin/recovery_authenticated_device_evidence_continuity.js
          node --check scripts/recovery_authenticated_device_evidence_continuity_test.mjs
      - name: Validate Build 490 source authority
        run: |
          python scripts/recovery_authenticated_device_evidence_continuity_check.py
          node scripts/recovery_authenticated_device_evidence_continuity_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 490 — Recovery & Authenticated Device Evidence Continuity" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery and authenticated-device evidence remain separate owner-observed populations" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery drills remain bounded non-Production planning only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Current negative device evidence overrides historical acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explicit role/device/browser coverage is retained" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production restore, browser farm, automatic remediation, HOLD mutation, schema/storage mutation and polling: NONE" >> "$GITHUB_STEP_SUMMARY"
