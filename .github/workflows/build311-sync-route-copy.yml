name: Build 311 Sync Inventory Route Copy

on:
  push:
    branches:
      - build311-inventory-operations-maintainability-extraction
    paths:
      - .github/workflows/build311-sync-route-copy.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extend exact Build 311 reconstruction to canonical route copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          b309 = Path('scripts/build309_release_check.py')
          text = b309.read_text(encoding='utf-8')
          old = '        "admin-catalog.html",\n        "assets/admin-catalog-v311.js",'
          new = '        "admin-catalog.html",\n        "admin-catalog/index.html",\n        "assets/admin-catalog-v311.js",'
          if old not in text:
              raise SystemExit('Build 309 successor insertion point not found')
          b309.write_text(text.replace(old, new, 1), encoding='utf-8')

          b311 = Path('scripts/build311_release_check.py')
          text = b311.read_text(encoding='utf-8')
          replacements = [
              ('PAGE = "admin-catalog.html"\nASSET =', 'PAGE = "admin-catalog.html"\nFOLDER_PAGE = "admin-catalog/index.html"\nASSET ='),
              ('baseline_page = baseline_file(PAGE)\nparts =', 'baseline_page = baseline_file(PAGE)\nbaseline_folder = baseline_file(FOLDER_PAGE)\nif baseline_page and baseline_folder and baseline_page != baseline_folder:\n    errors.append("accepted Build 310 Inventory root/folder route copies unexpectedly diverge")\nparts ='),
              ('    if read(PAGE) != expected_page:\n        errors.append(f"{PAGE} differs from accepted Build 310 source beyond exact runtime extraction")', '    if read(PAGE) != expected_page:\n        errors.append(f"{PAGE} differs from accepted Build 310 source beyond exact runtime extraction")\n    if read(FOLDER_PAGE) != expected_page:\n        errors.append(f"{FOLDER_PAGE} differs from the exact Build 311 canonical Inventory route copy")'),
              ('page = read(PAGE)\nasset =', 'page = read(PAGE)\nfolder_page = read(FOLDER_PAGE)\nif folder_page != page:\n    errors.append(f"{FOLDER_PAGE} is not byte-for-byte synchronized with {PAGE}")\nasset ='),
              ('        PAGE,\n        ASSET,', '        PAGE,\n        FOLDER_PAGE,\n        ASSET,'),
              ('print("- admin-catalog.html differs from accepted Build 310 only by the external runtime-script tag")', 'print("- admin-catalog.html and admin-catalog/index.html differ from accepted Build 310 only by the external runtime-script tag")'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Build 311 checker insertion point not found: {old[:60]}')
              text = text.replace(old, new, 1)
          b311.write_text(text, encoding='utf-8')
          PY
          cp admin-catalog.html admin-catalog/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build311-sync-route-copy.yml
          git add admin-catalog/index.html scripts/build309_release_check.py scripts/build311_release_check.py
          git commit -m "Build 311: synchronize Inventory route copy"
          git push origin HEAD:build311-inventory-operations-maintainability-extraction
