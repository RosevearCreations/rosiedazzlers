name: Build 501 — Maintenance & Fleet Pilot Outcome Continuity Review Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-maintenance-fleet-pilot-outcome-continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: maintenance-fleet-pilot-outcome-continuity-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/maintenance_fleet_pilot_outcome_continuity_review_check.py
          node --check functions/api/_lib/maintenance-fleet-pilot-outcome-continuity-review.js
          node --check functions/api/admin/maintenance_fleet_pilot_outcome_continuity_review.js
          node --check assets/build439-maintenance-fleet-owner-approval.js
          node --check scripts/maintenance_fleet_pilot_outcome_continuity_review_test.mjs
      - name: Validate Build 501 source authority
        run: |
          python scripts/maintenance_fleet_pilot_outcome_continuity_review_check.py
          node scripts/maintenance_fleet_pilot_outcome_continuity_review_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 501 — Maintenance & Fleet Pilot Outcome Continuity Review" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explicit owner approval plus participant/duration bounds remain prerequisites" >> "$GITHUB_STEP_SUMMARY"
          echo "- Capacity, invoicing, travel and stop-condition continuity require attributable current execution evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered stop conditions require explicit review and never authorize continuation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Missing execution remains owner action; historical/source GREEN evidence is never promoted into pilot success" >> "$GITHUB_STEP_SUMMARY"
          echo "- Activation, recurring billing, invoice creation, capacity reservation, provider/business mutation and polling: NONE" >> "$GITHUB_STEP_SUMMARY"
