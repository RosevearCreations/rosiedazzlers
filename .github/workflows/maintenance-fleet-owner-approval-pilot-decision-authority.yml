name: Build 479 — Maintenance & Fleet Owner Approval & Pilot Decision Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-maintenance-fleet-owner-approval-pilot-decision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: maintenance-fleet-owner-approval-pilot-decision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/maintenance_fleet_owner_approval_pilot_decision_check.py
          node --check functions/api/_lib/maintenance-fleet-owner-approval.js
          node --check functions/api/admin/maintenance_fleet_owner_approval.js
          node --check assets/build439-maintenance-fleet-owner-approval.js
          node --check scripts/maintenance_fleet_owner_approval_pilot_decision_test.mjs
      - name: Validate owner approval and pilot decision authority
        run: |
          python scripts/maintenance_fleet_owner_approval_pilot_decision_check.py
          node scripts/maintenance_fleet_owner_approval_pilot_decision_test.mjs
      - name: Authority summary
        run: |
          {
            echo '### Build 479 — Maintenance & Fleet Owner Approval & Pilot Decision'
            echo "- SHA: `${GITHUB_SHA}`"
            echo '- Retained Build 439/449/459/469 owner-decision system reused: PASS'
            echo '- Missing canonical approval or owner pilot bounds remain owner_action: PASS'
            echo '- Manual participant selection and eligibility boundary retained: PASS'
            echo '- /api/availability and /api/checkout revalidation retained: PASS'
            echo '- Auto-enrollment / recurring commitment activation / capacity reservation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
