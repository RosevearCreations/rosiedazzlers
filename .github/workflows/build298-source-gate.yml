name: Build 298 Source Gate

on:
  push:
    branches:
      - build-298-operations-booking-quote-maintainability-extraction
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build298-source
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Build 298 source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Build 298 syntax
        run: |
          python -m py_compile scripts/build297_release_check.py scripts/build298_release_check.py
          bash -n scripts/build297_http_smoke.sh scripts/build298_http_smoke.sh
          node --check assets/admin-customers-v297.js
          node --check assets/admin-quotes-v298.js
      - name: Run retained focused guards through Build 297
        run: |
          for build in $(seq 271 297); do
            echo "== Build ${build} focused guard =="
            python "scripts/build${build}_release_check.py"
          done
      - name: Run Build 298 exact extraction guard
        run: python scripts/build298_release_check.py
      - name: Run retained authorization matrix and forward-restore proof
        run: |
          node scripts/build290_action_permission_test.mjs
          python scripts/build290_rollback_check.py
      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py
      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py
      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check
      - name: Check Build 298 source hygiene from accepted Development baseline
        run: |
          git diff --check a034182bf8fd5dc8f8025032834ad7be6ec1d762 HEAD -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi
      - name: Build 298 source summary
        run: |
          {
            echo "### Build 298 Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Accepted Build 297 Development baseline: \`a034182bf8fd5dc8f8025032834ad7be6ec1d762\`"
            echo "- Accepted Production remains Build 296: \`337ae533130f4bf1c566d47c2ba1bc712cbf780e\`"
            echo "- Exact quote-pipeline runtime extraction proof: PASS"
            echo "- Quote route-copy parity and booking bridge: PASS"
            echo "- Retained focused guards 271–297: PASS"
            echo "- Authorization, cumulative release and one-H1 guards: PASS"
            echo "- No quote/booking behavior, API, pricing, recurrence or schema change introduced"
            echo "- Production remains closed for Build 298"
          } >> "$GITHUB_STEP_SUMMARY"
