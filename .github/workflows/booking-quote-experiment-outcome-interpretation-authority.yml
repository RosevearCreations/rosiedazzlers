name: Build 502 — Booking & Quote Experiment Outcome Interpretation Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-booking-quote-experiment-outcome-interpretation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: booking-quote-experiment-outcome-interpretation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/booking_quote_experiment_outcome_interpretation_check.py
          node --check functions/api/_lib/booking-quote-experiment-outcome-interpretation.js
          node --check functions/api/_lib/booking-quote-controlled-experiment-execution-evidence.js
          node --check functions/api/_lib/booking-funnel-quote-pricing-learning.js
          node --check functions/api/admin/booking_funnel_quote_pricing_learning.js
          node --check assets/build451-booking-funnel-quote-pricing-learning.js
          node --check scripts/booking_quote_experiment_outcome_interpretation_test.mjs
      - name: Validate Build 502 source authority
        run: |
          python scripts/booking_quote_experiment_outcome_interpretation_check.py
          node scripts/booking_quote_experiment_outcome_interpretation_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 502 — Booking & Quote Experiment Outcome Interpretation" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build 492 execution evidence remains the attributable execution source" >> "$GITHUB_STEP_SUMMARY"
          echo "- Weather-ineligible rows remain outside the conversion denominator" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered stop conditions override ordinary interpretation readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Arm summaries are descriptive; threshold evaluation, success and winner selection remain owner review" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pricing/discount, booking-rule, availability, provider, schema/storage mutation and polling: NONE" >> "$GITHUB_STEP_SUMMARY"
