name: Booking Funnel Quote Pricing Learning Authority
on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-booking-funnel-quote-pricing-learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: booking-funnel-quote-pricing-learning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/booking_funnel_quote_pricing_learning_check.py
          node --check functions/api/_lib/booking-funnel-quote-pricing-learning.js
          node --check functions/api/admin/booking_funnel_quote_pricing_learning.js
          node --check assets/build451-booking-funnel-quote-pricing-learning.js
          node --check scripts/booking_funnel_quote_pricing_learning_test.mjs
      - name: Validate Build 451 source authority
        run: |
          python scripts/booking_funnel_quote_pricing_learning_check.py
          node scripts/booking_funnel_quote_pricing_learning_test.mjs
      - name: Authority summary
        run: |
          echo "### Booking Funnel, Quote & Pricing Learning" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Causal price-sensitivity claim: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic price/discount/outreach/quote/booking/provider mutation: NONE" >> "$GITHUB_STEP_SUMMARY"
