name: Build 457 — Recovery Evidence Closure & Drill Readiness Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-recovery-evidence-closure-drill-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: recovery-evidence-closure-drill-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/recovery_evidence_closure_drill_readiness_check.py
          node --check functions/api/_lib/recovery-evidence-closure-drill-readiness.js
          node --check functions/api/admin/recovery_artifact_drill_evidence_review.js
          node --check functions/api/admin/launch_readiness_consolidated.js
          node --check assets/launch-readiness-consolidation.js
          node --check scripts/recovery_evidence_closure_drill_readiness_test.mjs
      - name: Validate recovery evidence closure & drill readiness
        run: |
          python scripts/recovery_evidence_closure_drill_readiness_check.py
          node scripts/recovery_evidence_closure_drill_readiness_test.mjs
