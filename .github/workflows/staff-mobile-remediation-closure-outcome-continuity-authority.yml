name: Build 523 — Staff & Mobile Remediation Closure Outcome Continuity Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
      - 'release*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-staff-mobile-remediation-closure-outcome-continuity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: staff-mobile-remediation-closure-outcome-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/staff_mobile_remediation_closure_outcome_continuity_check.py
          node --check scripts/staff_mobile_remediation_closure_outcome_continuity_test.mjs
          node --check functions/api/_lib/staff-mobile-remediation-closure-outcome-continuity.js
          node --check functions/api/admin/staff_mobile_remediation_closure_readiness.js
      - name: Validate Build 523 source authority
        run: |
          python scripts/staff_mobile_remediation_closure_outcome_continuity_check.py
          node scripts/staff_mobile_remediation_closure_outcome_continuity_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 523 — Staff & Mobile Remediation Closure Outcome Continuity" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retained Build 513/503/493/482 evidence remains authoritative" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manual close/retain-open requires exact trace match and review after retained evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow/role/device/browser, sample, confounder and Southern Ontario weather/site context stay explicit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Effectiveness/causation/staff-device fault inference and automatic closure/HOLD mutation: NONE" >> "$GITHUB_STEP_SUMMARY"
