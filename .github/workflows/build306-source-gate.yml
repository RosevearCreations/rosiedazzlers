name: Build 306 Source Gate

on:
  push:
    branches: [build306-it-health-dashboard-extraction]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build306-source
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retain accepted Build 305 authority
        run: python scripts/build305_release_check.py
      - name: Validate Build 306 I.T. Health extraction
        run: python scripts/build306_release_check.py
      - name: Run cumulative source authorities
        run: |
          python scripts/release_check.py
          python scripts/seo_h1_check.py
          python scripts/sync_route_copies.py --check
      - name: Source hygiene
        run: |
          git diff --check fbbc6f4c3f0533c1bc7faafac36f7ad6befe6605...HEAD -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi
