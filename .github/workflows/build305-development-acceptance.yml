name: Build 305 Development Runtime Acceptance

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate exact Build 305 source
        run: |
          node scripts/build305_finance_action_test.mjs
          python scripts/build305_release_check.py
      - name: Validate deployed Finance denial boundary
        run: bash scripts/build305_http_smoke.sh https://dev.rosiedazzlers.pages.dev
