name: Local Search Measurement & Conversion Attribution Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-local-search-conversion-attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: local-search-measurement-conversion-attribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/local_search_measurement_conversion_attribution_check.py
          node --check functions/api/_lib/local-search-measurement-conversion-attribution.js
          node --check functions/api/admin/local_search_measurement_conversion_attribution.js
          node --check assets/build450-local-search-measurement-conversion-attribution.js
          node --check scripts/local_search_measurement_conversion_attribution_test.mjs
      - name: Validate Build 450 source authority
        run: python scripts/local_search_measurement_conversion_attribution_check.py
      - name: Authority summary
        run: |
          {
            echo '### Local Search Measurement & Conversion Attribution'
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo '- Retained Search Console / GBP provider evidence: PASS'
            echo '- Anonymous same-session landing/referral → booking-funnel attribution: PASS'
            echo '- Provider metric → session join: NONE'
            echo '- Anonymous session → customer/persisted booking join: NONE'
            echo '- Ranking/indexing/Maps/causal inference: NONE'
            echo '- Provider/analytics/schema/publishing/outreach/DNS/ad-spend mutation or polling: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
