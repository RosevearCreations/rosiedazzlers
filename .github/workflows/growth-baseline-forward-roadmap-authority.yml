name: Build 396 — Growth Baseline & Forward Roadmap Renewal

on:
  push:
    branches:
      - 'build396-*'
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build396-growth-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  growth-baseline-forward-roadmap:
    name: growth-baseline-forward-roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Build 396 source authority
        run: |
          python -m py_compile scripts/build396_growth_baseline_forward_roadmap_check.py
          python scripts/build396_growth_baseline_forward_roadmap_check.py

      - name: Validate living release convergence
        run: python scripts/release_authority_documentation_convergence_check.py

      - name: Build 396 summary
        run: |
          {
            echo "### Build 396 — Growth Baseline & Forward Roadmap Renewal"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Growth measurement baseline/evidence boundary: PASS"
            echo "- 396–405 forward roadmap renewal: PASS"
            echo "- Living release/document convergence: PASS"
            echo "- Schema/provider/business-data/destructive R2 mutation: NONE"
          } >> "$GITHUB_STEP_SUMMARY"

  production-exact-sha:
    name: Verify exact Production deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: growth-baseline-forward-roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}
      CF_PROJECT_NAME: rosiedazzlers
      CF_PRODUCTION_BRANCH: main
      CF_PRODUCTION_URL: https://rosiedazzlers.ca
    steps:
      - name: Checkout exact Production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact Cloudflare Production deployment and runtime
        run: bash scripts/cloudflare_pages_production_acceptance.sh
