name: Build 309 Source Gate

on:
  push:
    branches: [build309-staff-administration-maintainability-extraction]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build309-source
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Build 309 syntax
        run: |
          node --check assets/admin-staff-v309.js
          bash -n scripts/build309_http_smoke.sh
          python -m py_compile scripts/build309_release_check.py
      - name: Retain Build 308 release authority
        run: python scripts/build308_release_check.py
      - name: Validate Build 309 Staff extraction
        run: python scripts/build309_release_check.py
      - name: Run cumulative source authorities
        run: |
          python scripts/release_check.py
          python scripts/seo_h1_check.py
          python scripts/sync_route_copies.py --check
      - name: Source hygiene
        run: |
          git diff --check d14a63c62913edf125a3e2bd8d69f110a6942dad...HEAD -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi
