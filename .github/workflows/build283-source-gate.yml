name: Build 283 Source Gate

on:
  push:
    branches:
      - build283-proof-publication-controls
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build283-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Build 283 source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Build 283 Gallery function syntax
        run: |
          node --check functions/api/_lib/gallery-publication.js
          node --check functions/api/before_after_gallery_public.js
          node --check functions/api/admin/gallery_approvals_list.js
          node --check functions/api/admin/gallery_approvals_save.js
          node --check functions/api/admin/gallery_media_candidates_list.js

      - name: Run retained Build 282 focused guard
        run: python scripts/build282_release_check.py

      - name: Run Build 283 focused guard
        run: python scripts/build283_release_check.py

      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py

      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py

      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check

      - name: Check source whitespace/conflict markers
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Source gate summary
        run: |
          {
            echo "### Build 283 Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Final-media pairing eligibility: PASS"
            echo "- Consent/privacy review separated from publication: PASS"
            echo "- Explicit publish/unpublish authority: PASS"
            echo "- Public Gallery legacy rows fail closed: PASS"
            echo "- Sample fallback excluded from real-proof readiness: PASS"
            echo "- Problem → process → result proof context: PASS"
            echo "- Retained Build 282 + cumulative release chain: PASS"
            echo "- No schema migration required."
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
