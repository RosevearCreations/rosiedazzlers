name: Rosie 901 Job-Day Dispatch and Safety Source Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jobday901:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check safety API, workflow hook and source syntax
        run: |
          node --check functions/api/_lib/jobday-safety-v901.js
          node --check functions/api/admin/jobday_dispatch_v901.js
          node --check functions/api/detailer/job_action.js
      - name: Run Build 901 dispatch and safety tests
        run: node --test tests/build901_jobday_dispatch_safety.test.mjs
      - name: Preserve Builds 899 and 900 safety baseline
        run: node --test tests/build899_supplies_equipment.test.mjs tests/build900_workforce_safety.test.mjs
