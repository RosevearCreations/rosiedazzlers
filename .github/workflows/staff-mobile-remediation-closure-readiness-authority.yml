name: Build 513 — Staff & Mobile Remediation Closure Readiness Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-staff-mobile-remediation-closure-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: staff-mobile-remediation-closure-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/staff_mobile_remediation_closure_readiness_check.py
          node --check functions/api/_lib/staff-mobile-remediation-closure-readiness.js
          node --check functions/api/admin/staff_mobile_remediation_closure_readiness.js
          node --check scripts/staff_mobile_remediation_closure_readiness_test.mjs
      - name: Validate Build 513 source authority
        run: |
          python scripts/staff_mobile_remediation_closure_readiness_check.py
          node scripts/staff_mobile_remediation_closure_readiness_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 513 — Staff & Mobile Remediation Closure Readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build 503/493/482 remain the retained evidence chain" >> "$GITHUB_STEP_SUMMARY"
          echo "- Like-for-like workflow, role, device/browser, measure, sample/window and confounder context remain required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Material confounders block closure readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Southern Ontario weather/site restrictions remain separate from staff/mobile friction" >> "$GITHUB_STEP_SUMMARY"
          echo "- Effectiveness, causation, staff/device fault, automatic closure, role change, outreach, HOLD/schema/storage mutation, telemetry and polling: NONE" >> "$GITHUB_STEP_SUMMARY"
