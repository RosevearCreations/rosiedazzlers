name: Build 297 Bootstrap Extraction

on:
  push:
    branches:
      - build-297-operations-customer-maintainability-extraction
    paths:
      - .github/workflows/build297-bootstrap-extraction.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-297-operations-customer-maintainability-extraction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract customer runtime byte-for-byte
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('admin-customers.html')
          asset = Path('assets/admin-customers-v297.js')
          text = page.read_text(encoding='utf-8')
          open_tag = '  <script>\n'
          close_tag = '\n  </script>'
          if text.count(open_tag) != 1:
              raise SystemExit(f'Expected exactly one mature inline classic script, found {text.count(open_tag)}')
          start = text.index(open_tag)
          end = text.index(close_tag, start)
          body = text[start + len(open_tag):end]
          required = [
              '/api/admin/customer_admin_list',
              '/api/admin/customer_admin_detail',
              '/api/admin/customer_admin_save',
              '/api/admin/customer_admin_access_action',
              '/api/admin/customer_account_help_list',
              '/api/admin/customer_account_help_action',
              "AdminShell.boot({pageKey:'admin-customers'",
          ]
          missing = [token for token in required if token not in body]
          if missing:
              raise SystemExit('Inline customer runtime missing expected authority markers: ' + ', '.join(missing))
          asset.write_text(body + '\n', encoding='utf-8')
          replacement = '  <script src="/assets/admin-customers-v297.js"></script>'
          updated = text[:start] + replacement + text[end + len(close_tag):]
          page.write_text(updated, encoding='utf-8')

          expected = text[:start] + replacement + text[end + len(close_tag):]
          if page.read_text(encoding='utf-8') != expected:
              raise SystemExit('admin-customers.html changed outside exact script substitution')
          if asset.read_text(encoding='utf-8') != body + '\n':
              raise SystemExit('Extracted runtime does not exactly match baseline inline body')
          PY
          node --check assets/admin-customers-v297.js
          git diff --check
          git diff --exit-code -- . ':!admin-customers.html' ':!assets/admin-customers-v297.js'
      - name: Commit extracted runtime
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-customers.html assets/admin-customers-v297.js
          git commit -m 'Build 297 extract Operations customer runtime'
          git push origin HEAD:build-297-operations-customer-maintainability-extraction
