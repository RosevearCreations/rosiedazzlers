name: Builds 277-280 Source Gate

on:
  push:
    branches:
      - build277-280-service-seo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build277-280-source-gate
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Builds 277-280 source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check landing-page runtime syntax
        run: |
          node --check functions/api/landing_pages_public.js
          node --check assets/landing-page.js

      - name: Run retained Build 271 focused guard
        run: python scripts/build271_release_check.py
      - name: Run retained Build 272 focused guard
        run: python scripts/build272_release_check.py
      - name: Run retained Build 273 focused guard
        run: python scripts/build273_release_check.py
      - name: Run retained Build 274 focused guard
        run: python scripts/build274_release_check.py
      - name: Run retained Build 275 focused guard
        run: python scripts/build275_release_check.py
      - name: Run retained Build 276 focused guard
        run: python scripts/build276_release_check.py
      - name: Run Build 277 focused guard
        run: python scripts/build277_release_check.py
      - name: Run Build 278 focused guard
        run: python scripts/build278_release_check.py
      - name: Run Build 279 focused guard
        run: python scripts/build279_release_check.py
      - name: Run Build 280 focused guard
        run: python scripts/build280_release_check.py

      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py

      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py

      - name: Check source whitespace/conflict markers
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Source gate summary
        run: |
          {
            echo "### Builds 277-280 source gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Service/add-on depth: PASS"
            echo "- Local service-area correctness/depth: PASS"
            echo "- Customer decision/internal-link paths: PASS"
            echo "- Sitemap/canonical/H1 release closure: PASS"
            echo "- Retained Builds 271-276 and cumulative release guard: PASS"
            echo "- No Production branch or Cloudflare Production resource is mutated by this source gate."
          } >> "$GITHUB_STEP_SUMMARY"
