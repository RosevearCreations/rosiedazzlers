name: Build 313 Bootstrap Successor Guards

on:
  push:
    branches: [build313-catalog-product-administration-extraction]

permissions:
  contents: write

jobs:
  patch-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: build313-catalog-product-administration-extraction
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add exact Build 313 successor paths to retained guards
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              'admin-app.html',
              'admin-app/index.html',
              'assets/admin-app-v313.js',
              'scripts/build313_release_check.py',
              'scripts/build313_http_smoke.sh',
              '.github/workflows/build313-source-gate.yml',
              '.github/workflows/build313-development-source-gate.yml',
              '.github/workflows/build313-development-acceptance.yml',
              'BUILD313_SUMMARY.md',
          ]

          def pyset(name, quote='"'):
              rows = [f'{name} = {{']
              for p in paths:
                  rows.append(f'    {quote}{p}{quote},')
              rows.append('}')
              return '\n'.join(rows) + '\n\n'

          p309 = Path('scripts/build309_release_check.py')
          t = p309.read_text(encoding='utf-8')
          anchor = '        "BUILD312_SUMMARY.md",\n    }'
          if anchor not in t:
              raise SystemExit('Build 309 successor anchor not found')
          addition = ''.join(f'        "{p}",\n' for p in paths)
          t = t.replace(anchor, '        "BUILD312_SUMMARY.md",\n' + addition + '    }', 1)
          p309.write_text(t, encoding='utf-8')

          p311 = Path('scripts/build311_release_check.py')
          t = p311.read_text(encoding='utf-8')
          anchor = '\n\ndef read(rel):'
          if anchor not in t or 'SUCCESSOR_BUILD313' in t:
              raise SystemExit('Build 311 successor insertion boundary invalid')
          t = t.replace(anchor, '\n\n' + pyset('SUCCESSOR_BUILD313') + 'def read(rel):', 1)
          old = '    } | SUCCESSOR_BUILD312\n'
          if old not in t:
              raise SystemExit('Build 311 allowed-union anchor not found')
          t = t.replace(old, '    } | SUCCESSOR_BUILD312 | SUCCESSOR_BUILD313\n', 1)
          p311.write_text(t, encoding='utf-8')

          p312 = Path('scripts/build312_release_check.py')
          t = p312.read_text(encoding='utf-8')
          anchor = 'ALLOWED = {'
          if anchor not in t or 'SUCCESSOR_BUILD313' in t:
              raise SystemExit('Build 312 successor insertion boundary invalid')
          t = t.replace(anchor, pyset('SUCCESSOR_BUILD313', quote="'") + anchor, 1)
          old = "    'scripts/build311_release_check.py',\n}\n"
          if old not in t:
              raise SystemExit('Build 312 allowed-union anchor not found')
          t = t.replace(old, "    'scripts/build311_release_check.py',\n} | SUCCESSOR_BUILD313\n", 1)
          p312.write_text(t, encoding='utf-8')

          print('Build 313 retained-guard successor patch: PASS')
          PY
          python -m py_compile scripts/build309_release_check.py scripts/build311_release_check.py scripts/build312_release_check.py scripts/build313_release_check.py
      - name: Remove one-time helper and commit retained-guard patch
        run: |
          rm .github/workflows/build313-guard-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build309_release_check.py scripts/build311_release_check.py scripts/build312_release_check.py .github/workflows/build313-guard-bootstrap.yml
          git diff --cached --name-status
          git commit -m "Build 313: retain predecessor release authority"
          git push origin HEAD:build313-catalog-product-administration-extraction
