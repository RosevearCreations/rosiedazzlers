name: Authenticated Device & Visual Acceptance Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-authenticated-device-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: authenticated-device-visual-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/authenticated_device_visual_acceptance_check.py
          node --check functions/api/_lib/authenticated-device-visual-acceptance.js
          node --check functions/api/admin/authenticated_device_visual_acceptance.js
          node --check scripts/authenticated_device_visual_acceptance_test.mjs
      - name: Validate authenticated device & visual acceptance
        run: python scripts/authenticated_device_visual_acceptance_check.py
      - name: Authority summary
        run: |
          {
            echo '### Authenticated Device & Visual Acceptance'
            echo "- SHA: `${GITHUB_SHA}`"
            echo '- Customer/Detailer/Operations/Admin retained workflow boundary: PASS'
            echo '- Auth/device/browser/route/viewport/outcome classification: PASS'
            echo '- Representative phone/tablet/desktop coverage rule: PASS'
            echo '- Protected note/customer content exposure: NONE'
            echo '- Screenshot capture/polling or business/provider/storage mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
