name: Rosie 885 Independent Chain, Four Scheduler SLA Horizons and Owner Renewal Source Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build885-signed-original-audit-sla-owner-renewal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce all 885 negative audit and owner-gate tests and retained 884/883/882 suites
        run: |
          node scripts/build885_independent_audit_sla_renewal_test.mjs
          node scripts/build884_retention_drift_owner_closure_test.mjs
          node scripts/build883_execution_receipt_renewal_recovery_test.mjs
          node scripts/build882_enrollment_anchor_ack_test.mjs
          node scripts/build881_scheduled_anchor_grace_test.mjs
