name: Build 494 — Service Economics, Seasonal Operations & Reliability Review Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-service-economics-seasonal-operations-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: service-economics-seasonal-operations-reliability-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/service_economics_seasonal_operations_reliability_review_check.py
          node --check functions/api/_lib/service-economics-seasonal-operations-reliability-review.js
          node --check functions/api/admin/service_economics_seasonal_operations_reliability_review.js
          node --check assets/build494-service-economics-seasonal-operations-reliability-review.js
          node --check scripts/service_economics_seasonal_operations_reliability_review_test.mjs
      - name: Validate bounded reconciliation authority
        run: |
          python scripts/service_economics_seasonal_operations_reliability_review_check.py
          node scripts/service_economics_seasonal_operations_reliability_review_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 494 — Service Economics, Seasonal Operations & Reliability Review" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explicit allocation, seasonal capability, observed capacity and reliability continuity remain independently sourced" >> "$GITHUB_STEP_SUMMARY"
          echo "- Southern Ontario field restrictions remain separate from application reliability" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provider billing/CPU/quota, recovery success, temperature thresholds, price sensitivity and winter availability are never inferred" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic price, booking, provider, restore, accounting, inventory, schema and polling mutation: NONE" >> "$GITHUB_STEP_SUMMARY"
