name: Build 287 Development Runtime Acceptance

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build287-development-runtime
  cancel-in-progress: true

jobs:
  review-share-runtime:
    name: Verify Build 287 review/share runtime
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_DEV_URL: https://dev.rosiedazzlers.pages.dev
    steps:
      - name: Checkout exact dev commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconfirm Build 287 source authority
        run: python scripts/build287_release_check.py

      - name: Wait for Development alias and run Build 287 smoke
        shell: bash
        run: |
          set -euo pipefail
          ready="false"
          for attempt in $(seq 1 24); do
            echo "Checking Build 287 Development runtime convergence (attempt ${attempt}/24)."
            if bash scripts/build287_http_smoke.sh "$CF_DEV_URL" "Build 287 Development attempt ${attempt}/24"; then
              ready="true"
              break
            fi
            [[ "$attempt" -ge 24 ]] || sleep 10
          done
          [[ "$ready" == "true" ]] || { echo "::error::Build 287 Development runtime did not converge."; exit 26; }

      - name: Acceptance summary
        run: |
          {
            echo "### Build 287 Development Runtime Acceptance"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Account review/share helper deployed: PASS"
            echo "- Booking referral-origin entry adapter deployed: PASS"
            echo "- Existing UTM analytics authority retained: PASS"
            echo "- Protected review route preserves unauthenticated boundary: PASS"
            echo "- No reward/discount or booking authority introduced."
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
