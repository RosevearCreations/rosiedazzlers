name: Build 477 — Recovery Drill Evidence Refresh & Closure Review Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-recovery-drill-evidence-refresh-closure-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: recovery-drill-evidence-refresh-closure-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/recovery_drill_evidence_refresh_closure_review_check.py
          node --check functions/api/_lib/recovery-drill-evidence-refresh-closure-review.js
          node --check functions/api/admin/recovery_artifact_drill_evidence_review.js
          node --check functions/api/admin/launch_readiness_consolidated.js
          node --check assets/launch-readiness-consolidation.js
          node --check scripts/recovery_drill_evidence_refresh_closure_review_test.mjs
      - name: Validate recovery drill evidence refresh & closure review
        run: |
          python scripts/recovery_drill_evidence_refresh_closure_review_check.py
          node scripts/recovery_drill_evidence_refresh_closure_review_test.mjs
