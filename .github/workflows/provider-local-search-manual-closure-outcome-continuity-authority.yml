name: Provider & Local Search Manual Closure Outcome Continuity Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-provider-local-search-manual-closure-outcome-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: provider-local-search-manual-closure-outcome-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Provider & Local Search Manual Closure Outcome Continuity
        run: |
          python scripts/provider_local_search_manual_closure_outcome_continuity_check.py
          node scripts/provider_local_search_manual_closure_outcome_continuity_test.mjs
      - name: Build 519 summary
        run: |
          {
            echo '### Provider & Local Search Manual Closure Outcome Continuity'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Provider/payment/refund/message evidence: CURRENT + ATTRIBUTABLE REQUIRED'
            echo '- Search Console property / GBP location windows: MATCHING + CURRENT REQUIRED'
            echo '- Operator-reviewed manual HOLD outcome: EXPLICIT + TRACE-MATCHED REQUIRED'
            echo '- First-party context: SEPARATE DESCRIPTIVE EVIDENCE'
            echo '- Ranking/weather/demand/conversion causation: NOT INFERRED'
            echo '- Automatic canonical HOLD narrowing: NONE'
          } >> "${GITHUB_STEP_SUMMARY}"
