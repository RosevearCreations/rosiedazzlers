name: Service Economics Seasonal Capacity Reliability Evidence Freshness Review Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-service-economics-seasonal-capacity-reliability-freshness-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: service-economics-seasonal-capacity-reliability-evidence-freshness-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Build 534 freshness authority
        run: |
          python scripts/service_economics_seasonal_capacity_reliability_evidence_freshness_review_check.py
          node scripts/service_economics_seasonal_capacity_reliability_evidence_freshness_review_test.mjs
      - name: Build 534 summary
        run: |
          {
            echo '### Service Economics, Seasonal Capacity & Reliability Evidence Freshness Review'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Independent allocation / seasonal / capacity / technical evidence: REQUIRED'
            echo '- Missing comparable history: INSUFFICIENT'
            echo '- Southern Ontario temperature thresholds: SOURCE-OWNED ONLY'
            echo '- Provider billing / CPU / quota / recovery inference: NONE'
            echo '- Future capacity / price sensitivity inference: NONE'
            echo '- Schema / storage / telemetry / polling mutation: NONE'
            echo '- Automatic business / provider / canonical HOLD mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
