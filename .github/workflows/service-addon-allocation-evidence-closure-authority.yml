name: Service Add-On Allocation Evidence Closure Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-service-addon-allocation-evidence-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: service-addon-allocation-evidence-closure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/service_addon_allocation_evidence_closure_check.py
          node --check functions/api/_lib/service-addon-allocation-evidence-closure.js
          node --check functions/api/admin/service_economics_commercial_capacity_review.js
          node --check assets/build473-service-economics-allocation-margin-review-readiness.js
          node --check scripts/service_addon_allocation_evidence_closure_test.mjs
      - name: Validate Build 483 source authority
        run: |
          python scripts/service_addon_allocation_evidence_closure_check.py
          node scripts/service_addon_allocation_evidence_closure_test.mjs
      - name: Authority summary
        run: |
          echo "### Service & Add-On Allocation Evidence Closure" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Allocation gaps close only from explicit recorded revenue/material/labour/cash-refund/posted-COGS linkage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Booking-total, equal, percentage and price-weighted inferred allocation: prohibited" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seasonal operability is separately sourced; exact temperature thresholds are never invented" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic pricing, booking, public winter claims, schema mutation or polling: NONE" >> "$GITHUB_STEP_SUMMARY"
