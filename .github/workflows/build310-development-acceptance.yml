name: Build 310 Development Runtime Acceptance

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retain Build 309 source authority
        run: python scripts/build309_release_check.py
      - name: Prove Build 310 seven-module Admin matrix
        run: node scripts/build310_admin_full_access_test.mjs
      - name: Validate deployed Staff Administration read-only
        run: bash scripts/build310_http_smoke.sh https://dev.rosiedazzlers.pages.dev
