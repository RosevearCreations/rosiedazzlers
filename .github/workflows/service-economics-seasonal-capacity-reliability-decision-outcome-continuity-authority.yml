name: Build 524 — Service Economics, Seasonal Capacity & Reliability Decision Outcome Continuity Authority
on:
  push:
    branches: [dev, main, 'build*', 'release*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-service-economics-seasonal-capacity-reliability-decision-outcome-continuity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  authority:
    name: service-economics-seasonal-capacity-reliability-decision-outcome-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/service_economics_seasonal_capacity_reliability_decision_outcome_continuity_check.py
          node --check scripts/service_economics_seasonal_capacity_reliability_decision_outcome_continuity_test.mjs
          node --check functions/api/_lib/service-economics-seasonal-capacity-reliability-decision-outcome-continuity.js
          node --check functions/api/admin/service_economics_seasonal_capacity_reliability_decision_readiness.js
      - name: Validate decision outcome continuity
        run: |
          python scripts/service_economics_seasonal_capacity_reliability_decision_outcome_continuity_check.py
          node scripts/service_economics_seasonal_capacity_reliability_decision_outcome_continuity_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 524 — Service Economics, Seasonal Capacity & Reliability Decision Outcome Continuity" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retained Build 514/504 independent-domain evidence remains authoritative" >> "$GITHUB_STEP_SUMMARY"
          echo "- Human outcomes: explicit, attributable, exact-trace matched and non-executing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Missing comparable history / cross-domain substitution: FAIL-CLOSED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Southern Ontario temperature thresholds / broad winter availability: NOT INFERRED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provider billing/CPU/quota, scaling need and recovery success: NOT INFERRED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic pricing/booking/capacity/provider/recovery/HOLD mutation: NONE" >> "$GITHUB_STEP_SUMMARY"
