name: Build 286 Development Runtime Acceptance

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build286-development-runtime
  cancel-in-progress: true

jobs:
  review-runtime:
    name: Verify Build 286 review runtime
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_DEV_URL: https://dev.rosiedazzlers.pages.dev
    steps:
      - name: Checkout exact dev commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconfirm Build 286 source authority
        run: python scripts/build286_release_check.py

      - name: Wait for Development alias and run Build 286 smoke
        shell: bash
        run: |
          set -euo pipefail
          ready="false"
          for attempt in $(seq 1 24); do
            echo "Checking Build 286 Development runtime convergence (attempt ${attempt}/24)."
            if bash scripts/build286_http_smoke.sh "$CF_DEV_URL" "Build 286 Development attempt ${attempt}/24"; then
              ready="true"
              break
            fi
            [[ "$attempt" -ge 24 ]] || sleep 10
          done
          [[ "$ready" == "true" ]] || { echo "::error::Build 286 Development runtime did not converge."; exit 26; }

      - name: Acceptance summary
        run: |
          {
            echo "### Build 286 Development Runtime Acceptance"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Account review helper deployed: PASS"
            echo "- Client-auth bootstrap deployed: PASS"
            echo "- Review eligibility route exists and preserves unauthenticated boundary: PASS"
            echo "- Source authority re-confirmed on exact dev commit: PASS"
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
