name: Cloudflare Pages Recovery

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-cloudflare-pages-recovery
  cancel-in-progress: true

env:
  CF_PROJECT_NAME: rosiedazzlers
  CF_BRANCH: dev

jobs:
  recover-stuck-deployment:
    name: Recover stuck exact-SHA Pages deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact dev commit
        uses: actions/checkout@v4

      - name: Validate Cloudflare authority
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::ROSIEDAZZLERS_TOKEN is unavailable."; exit 2; }
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            "${AUTH[@]}" > /tmp/cf-token.json
          jq -e '.success == true and (.result.status // "") == "active"' /tmp/cf-token.json >/dev/null

          account_id="${CONFIGURED_ACCOUNT_ID:-}"
          project_ok() {
            local candidate="$1"
            local code
            code=$(curl --silent --show-error --output /tmp/cf-project.json --write-out '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${candidate}/pages/projects/${CF_PROJECT_NAME}" \
              "${AUTH[@]}")
            [[ "$code" == "200" ]] && jq -e '.success == true' /tmp/cf-project.json >/dev/null 2>&1
          }

          if [[ -n "$account_id" ]]; then
            project_ok "$account_id" || { echo "::error::Configured CLOUDFLARE_ACCOUNT_ID cannot read Pages project ${CF_PROJECT_NAME}."; exit 3; }
          else
            curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
              "${AUTH[@]}" > /tmp/cf-accounts.json
            jq -e '.success == true' /tmp/cf-accounts.json >/dev/null
            while IFS= read -r candidate; do
              [[ -z "$candidate" ]] && continue
              if project_ok "$candidate"; then account_id="$candidate"; break; fi
            done < <(jq -r '.result[]?.id' /tmp/cf-accounts.json)
          fi

          [[ -n "$account_id" ]] || { echo "::error::Cloudflare account containing ${CF_PROJECT_NAME} could not be resolved."; exit 4; }
          production_branch=$(jq -r '.result.production_branch // .result.source.config.production_branch // empty' /tmp/cf-project.json)
          source_type=$(jq -r '.result.source.type // empty' /tmp/cf-project.json)
          [[ "$source_type" == "github" ]] || { echo "::error::Expected GitHub-connected Pages project, got ${source_type:-unknown}."; exit 5; }
          echo "account_id=${account_id}" >> "$GITHUB_OUTPUT"
          echo "production_branch=${production_branch}" >> "$GITHUB_OUTPUT"
          echo "Cloudflare token/project authority: PASS"

      - name: Observe exact SHA before recovery
        id: observe
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          matched_id=""
          matched_status=""
          for attempt in $(seq 1 9); do
            curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?per_page=25" \
              "${AUTH[@]}" > /tmp/cf-deployments.json
            jq -e '.success == true' /tmp/cf-deployments.json >/dev/null
            matched_id=$(jq -r --arg sha "$GITHUB_SHA" --arg branch "$CF_BRANCH" '
              [.result[]? | select(
                (.deployment_trigger.metadata.branch // "") == $branch and
                (.deployment_trigger.metadata.commit_hash // "") == $sha
              )][0].id // empty
            ' /tmp/cf-deployments.json)
            matched_status=$(jq -r --arg id "$matched_id" '.result[]? | select(.id == $id) | (.latest_stage.status // "unknown")' /tmp/cf-deployments.json | head -n1)
            if [[ -n "$matched_id" ]]; then
              echo "Exact deployment ${matched_id} status: ${matched_status} (attempt ${attempt}/9)."
              case "$matched_status" in
                success)
                  echo "deployment_id=${matched_id}" >> "$GITHUB_OUTPUT"
                  echo "already_success=true" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                failure|failed|canceled|cancelled)
                  echo "::error::Exact deployment ${matched_id} reached terminal status ${matched_status}."
                  exit 6
                  ;;
              esac
            else
              echo "Exact SHA is not visible yet (attempt ${attempt}/9)."
            fi
            [[ "$attempt" -ge 9 ]] || sleep 10
          done
          [[ -n "$matched_id" ]] || { echo "::error::Exact SHA never appeared in Cloudflare Pages."; exit 7; }
          echo "deployment_id=${matched_id}" >> "$GITHUB_OUTPUT"
          echo "already_success=false" >> "$GITHUB_OUTPUT"

      - name: Capture stuck deployment diagnostics
        if: steps.observe.outputs.already_success != 'true'
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
          STUCK_DEPLOYMENT_ID: ${{ steps.observe.outputs.deployment_id }}
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          code=$(curl --silent --show-error --output /tmp/cf-history.json --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments/${STUCK_DEPLOYMENT_ID}/history/logs" \
            "${AUTH[@]}" || true)
          echo "Cloudflare history/log endpoint HTTP ${code}."
          if [[ "$code" == "200" ]] && jq -e '.success == true' /tmp/cf-history.json >/dev/null 2>&1; then
            echo "---- Cloudflare deployment log tail ----"
            jq -r '.result.data[]?.line // empty' /tmp/cf-history.json | tail -n 80 | sed -E 's/(token|secret|password|authorization)([^ ]*)/\1=[MASKED]/Ig' || true
            echo "---- end Cloudflare deployment log tail ----"
          fi

      - name: Recover stuck deployment
        id: recover
        if: steps.observe.outputs.already_success != 'true'
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
          STUCK_DEPLOYMENT_ID: ${{ steps.observe.outputs.deployment_id }}
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          retry_code=$(curl --silent --show-error --output /tmp/cf-retry.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments/${STUCK_DEPLOYMENT_ID}/retry" \
            "${AUTH[@]}" || true)

          if [[ "$retry_code" == "200" ]] && jq -e '.success == true and (.result.id // "") != ""' /tmp/cf-retry.json >/dev/null 2>&1; then
            recovery_id=$(jq -r '.result.id' /tmp/cf-retry.json)
            echo "Cloudflare retry accepted as ${recovery_id}."
          elif [[ "$retry_code" == "304" ]]; then
            echo "Cloudflare will not retry the still-active deployment; creating a fresh ad-hoc deployment from exact Git HEAD/SHA."
            create_code=$(curl --silent --show-error --output /tmp/cf-create.json --write-out '%{http_code}' \
              --request POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments" \
              "${AUTH[@]}" \
              -F "branch=${CF_BRANCH}" \
              -F 'commit_dirty=false' \
              -F "commit_hash=${GITHUB_SHA}" \
              -F "commit_message=RosieDazzlers exact-SHA recovery ${GITHUB_SHA}" || true)
            if [[ "$create_code" != "200" ]] || ! jq -e '.success == true and (.result.id // "") != ""' /tmp/cf-create.json >/dev/null 2>&1; then
              create_error=$(jq -r '.errors[0].message // .messages[0].message // empty' /tmp/cf-create.json 2>/dev/null || true)
              echo "::error::Cloudflare exact-SHA ad-hoc deployment returned HTTP ${create_code}${create_error:+: ${create_error}}."
              exit 8
            fi
            recovery_id=$(jq -r '.result.id' /tmp/cf-create.json)
            echo "Cloudflare exact-SHA ad-hoc recovery accepted as ${recovery_id}."
          else
            retry_error=$(jq -r '.errors[0].message // .messages[0].message // empty' /tmp/cf-retry.json 2>/dev/null || true)
            echo "::error::Cloudflare retry returned HTTP ${retry_code}${retry_error:+: ${retry_error}}."
            exit 9
          fi

          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments/${recovery_id}" \
            "${AUTH[@]}" > /tmp/cf-recovery.json
          recovery_sha=$(jq -r '.result.deployment_trigger.metadata.commit_hash // empty' /tmp/cf-recovery.json)
          recovery_branch=$(jq -r '.result.deployment_trigger.metadata.branch // empty' /tmp/cf-recovery.json)
          [[ "$recovery_sha" == "$GITHUB_SHA" ]] || { echo "::error::Recovery deployment SHA mismatch: ${recovery_sha}."; exit 10; }
          [[ "$recovery_branch" == "$CF_BRANCH" ]] || { echo "::error::Recovery deployment branch mismatch: ${recovery_branch}."; exit 11; }
          echo "deployment_id=${recovery_id}" >> "$GITHUB_OUTPUT"

      - name: Require successful exact-SHA deployment
        id: accepted
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
          ORIGINAL_DEPLOYMENT_ID: ${{ steps.observe.outputs.deployment_id }}
          RECOVERY_DEPLOYMENT_ID: ${{ steps.recover.outputs.deployment_id }}
          ALREADY_SUCCESS: ${{ steps.observe.outputs.already_success }}
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [[ "$ALREADY_SUCCESS" == "true" ]]; then accepted_id="$ORIGINAL_DEPLOYMENT_ID"; else accepted_id="$RECOVERY_DEPLOYMENT_ID"; fi
          [[ -n "$accepted_id" ]] || { echo "::error::No deployment id is available for final acceptance."; exit 12; }

          ready=false
          for attempt in $(seq 1 30); do
            curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments/${accepted_id}" \
              "${AUTH[@]}" > /tmp/cf-exact.json
            jq -e '.success == true' /tmp/cf-exact.json >/dev/null
            status=$(jq -r '.result.latest_stage.status // "unknown"' /tmp/cf-exact.json)
            commit_hash=$(jq -r '.result.deployment_trigger.metadata.commit_hash // empty' /tmp/cf-exact.json)
            branch=$(jq -r '.result.deployment_trigger.metadata.branch // empty' /tmp/cf-exact.json)
            echo "Acceptance deployment ${accepted_id}: ${status} (attempt ${attempt}/30)."
            [[ "$commit_hash" == "$GITHUB_SHA" ]] || { echo "::error::Accepted deployment SHA changed to ${commit_hash}."; exit 13; }
            [[ "$branch" == "$CF_BRANCH" ]] || { echo "::error::Accepted deployment branch changed to ${branch}."; exit 14; }
            case "$status" in
              success) ready=true; break ;;
              failure|failed|canceled|cancelled) echo "::error::Acceptance deployment reached ${status}."; exit 15 ;;
            esac
            [[ "$attempt" -ge 30 ]] || sleep 10
          done
          [[ "$ready" == "true" ]] || { echo "::error::Exact-SHA recovery did not reach success."; exit 16; }

          deployment_url=$(jq -r '.result.url // empty' /tmp/cf-exact.json)
          uses_functions=$(jq -r 'if .result.uses_functions == true then "true" elif .result.uses_functions == false then "false" else "unknown" end' /tmp/cf-exact.json)
          [[ -n "$deployment_url" ]] || { echo "::error::Successful deployment has no immutable URL."; exit 17; }
          [[ "$uses_functions" == "true" ]] || { echo "::error::Successful deployment does not report uses_functions=true (${uses_functions})."; exit 18; }
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "deployment_id=${accepted_id}" >> "$GITHUB_OUTPUT"
          echo "Cloudflare exact-SHA deployment acceptance: PASS (${accepted_id})."

      - name: Smoke accepted immutable deployment
        shell: bash
        env:
          EXACT_DEV_URL: ${{ steps.accepted.outputs.deployment_url }}
        run: |
          set -euo pipefail
          SMOKE_SCOPE=static bash scripts/development_http_smoke.sh "$EXACT_DEV_URL" "Recovered exact Development deployment"
          echo "Exact immutable deployment smoke: PASS"
