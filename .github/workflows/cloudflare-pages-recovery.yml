name: Cloudflare Pages Recovery

on:
  workflow_dispatch:
    inputs:
      recovery_action:
        description: "Observe only, or repair one stuck exact-SHA Development preview"
        required: true
        default: observe
        type: choice
        options:
          - observe
          - repair
      confirm_sha:
        description: "For repair only: type the exact current dev SHA shown by GitHub"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-cloudflare-pages-recovery
  cancel-in-progress: false

env:
  CF_PROJECT_NAME: rosiedazzlers
  CF_DEV_BRANCH: dev
  CF_DEV_URL: https://dev.rosiedazzlers.pages.dev

jobs:
  recover-stuck-deployment:
    name: Observe or manually recover exact-SHA Development deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}
      RECOVERY_ACTION: ${{ inputs.recovery_action }}
      RECOVERY_CONFIRM_SHA: ${{ inputs.confirm_sha }}
    steps:
      - name: Checkout exact Development ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require manual Development dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || { echo "::error::Recovery is manual-only."; exit 2; }
          [[ "$GITHUB_REF_NAME" == "dev" ]] || { echo "::error::Recovery must be dispatched from the dev branch."; exit 3; }
          [[ "$RECOVERY_ACTION" == "observe" || "$RECOVERY_ACTION" == "repair" ]] || { echo "::error::Unknown recovery action."; exit 4; }
          if [[ "$RECOVERY_ACTION" == "repair" ]]; then
            [[ -n "$RECOVERY_CONFIRM_SHA" ]] || { echo "::error::Repair requires confirm_sha."; exit 5; }
            [[ "$RECOVERY_CONFIRM_SHA" == "$TARGET_SHA" ]] || { echo "::error::confirm_sha must exactly match the selected dev SHA."; exit 6; }
          fi

      - name: Validate canonical helper and Build 308 guard
        run: |
          bash -n scripts/cloudflare_pages_development.sh
          python scripts/build308_release_check.py

      - name: Observe or recover exact Development deployment through canonical helper
        shell: bash
        run: bash scripts/cloudflare_pages_development.sh recover

      - name: Record recovery safety boundary
        shell: bash
        run: |
          {
            echo "### Recovery safety boundary"
            echo "- Trigger: manual workflow_dispatch only"
            echo "- Selected ref: \`${GITHUB_REF_NAME}\`"
            echo "- Exact target SHA: \`${TARGET_SHA}\`"
            echo "- Requested action: \`${RECOVERY_ACTION}\`"
            echo "- Observe is non-mutating."
            echo "- Repair requires exact SHA confirmation and the canonical helper independently proves a non-terminal Development preview before deletion/recreation."
            echo "- Production deployment mutation is forbidden."
          } >> "$GITHUB_STEP_SUMMARY"
