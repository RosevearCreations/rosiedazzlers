name: Rosie 917 Source Evidence Acceptance
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  original-source-917:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify 917 fail-closed acceptance and SQL
        run: |
          node tests/build917_source_evidence.test.mjs
          node --check assets/build917-source-evidence-contract.mjs
