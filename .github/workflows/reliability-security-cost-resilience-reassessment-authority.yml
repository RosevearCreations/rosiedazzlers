name: Build 454 — Reliability, Security, Cost & Resilience Reassessment Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build454-reassessment-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: reliability-security-cost-resilience-reassessment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Build 454 authority syntax
        run: |
          python -m py_compile scripts/reliability_security_cost_resilience_reassessment_check.py
          node --check functions/api/_lib/reliability-security-cost-reassessment.js
          node --check functions/api/admin/reliability_security_cost_reassessment.js
          node --check assets/build434-reliability-reassessment.js
      - name: Validate Build 454 bounded reassessment
        run: python scripts/reliability_security_cost_resilience_reassessment_check.py
      - name: Authority summary
        run: |
          {
            echo "### Build 454 reliability/security/cost/resilience reassessment"
            echo "- SHA: `${GITHUB_SHA}`"
            echo "- Reliability / privacy-session / security / recovery / observability / cost-awareness authorities: PASS"
            echo "- Build 434/444 single read-only I.T. reassessment surface retained."
            echo "- Cloudflare billing/CPU/future capacity, attack likelihood and real Production recovery remain external unless independently evidenced."
            echo "- No scaling/retry/cache/secret/restore/DNS/R2/provider/schema/customer/business/accounting/inventory mutation or permanent polling."
          } >> "$GITHUB_STEP_SUMMARY"
