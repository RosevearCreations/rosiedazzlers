name: Provider & Local Search Evidence Continuity Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-provider-local-search-evidence-continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: provider-local-search-evidence-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/provider_local_search_evidence_continuity_check.py
          node --check functions/api/_lib/provider-local-search-evidence-continuity.js
          node --check functions/api/admin/provider_local_search_evidence_continuity.js
          node --check assets/build450-local-search-measurement-conversion-attribution.js
          node --check scripts/provider_local_search_evidence_continuity_test.mjs
      - name: Validate Build 489 source authority
        run: |
          python scripts/provider_local_search_evidence_continuity_check.py
          node scripts/provider_local_search_evidence_continuity_test.mjs
      - name: Authority summary
        run: |
          echo "### Provider & Local Search Evidence Continuity" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Payment/refund/message outcomes and Search Console/GBP remain provider-owned separate populations" >> "$GITHUB_STEP_SUMMARY"
          echo "- Local-search continuity requires matching property/location identity and equal-length distinct windows" >> "$GITHUB_STEP_SUMMARY"
          echo "- Referral/search movement is not ranking, weather, winter-demand or booking-causation proof" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provider writes, booking/customer mutation, outreach, schema/storage mutation and polling: NONE" >> "$GITHUB_STEP_SUMMARY"
