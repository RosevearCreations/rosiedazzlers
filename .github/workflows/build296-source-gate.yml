name: Build 296 Source Gate

on:
  push:
    branches:
      - build-296-my-account-maintainability-extraction
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build296-source
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Build 296 source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Build 296 syntax
        run: |
          python -m py_compile scripts/build295_release_check.py scripts/build296_release_check.py
          bash -n scripts/build295_http_smoke.sh
          bash -n scripts/build296_http_smoke.sh
          node --check assets/my-account-v296.js
          node --check assets/client-auth.js
          node --check assets/customer-privacy-v288.js
          node --check assets/customer-maintenance-authority-v294.js
          node --check functions/api/client/dashboard.js
          node --check functions/api/client/profile_update.js
          node --check functions/api/client/vehicles_save.js

      - name: Run retained focused guards through Build 295
        run: |
          for build in $(seq 271 295); do
            echo "== Build ${build} focused guard =="
            python "scripts/build${build}_release_check.py"
          done

      - name: Run Build 296 exact extraction guard
        run: python scripts/build296_release_check.py

      - name: Run retained authorization matrix and forward-restore proof
        run: |
          node scripts/build290_action_permission_test.mjs
          python scripts/build290_rollback_check.py

      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py

      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py

      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check

      - name: Check Build 296 source hygiene from accepted Production baseline
        run: |
          git diff --check 73556e1f41dc204290409294c5e38ad0b2090fb7 HEAD -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Build 296 source summary
        run: |
          {
            echo "### Build 296 Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Accepted Build 295 Production baseline: \`73556e1f41dc204290409294c5e38ad0b2090fb7\`"
            echo "- Exact inline-to-versioned-asset extraction proof: PASS"
            echo "- My Account route-copy parity: PASS"
            echo "- Retained Build 288/294/295 privacy/maintenance/source boundaries: PASS"
            echo "- Retained focused guards 271–295: PASS"
            echo "- Build 290 authorization/forward-restore proof: PASS"
            echo "- Cumulative release and one-H1 guards: PASS"
            echo "- No customer behavior/API/schema/maintenance-economics change introduced"
            echo "- Production remains closed"
          } >> "$GITHUB_STEP_SUMMARY"
