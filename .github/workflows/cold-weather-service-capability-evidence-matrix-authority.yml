name: Cold-Weather Service Capability Evidence Matrix Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-cold-weather-service-capability-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: cold-weather-service-capability-evidence-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/cold_weather_service_capability_evidence_matrix_check.py
          node --check functions/api/_lib/cold-weather-service-capability-evidence-matrix.js
          node --check functions/api/admin/service_economics_commercial_capacity_review.js
          node --check assets/build473-service-economics-allocation-margin-review-readiness.js
          node --check scripts/cold_weather_service_capability_evidence_matrix_test.mjs
      - name: Validate Build 486 source authority
        run: |
          python scripts/cold_weather_service_capability_evidence_matrix_check.py
          node scripts/cold_weather_service_capability_evidence_matrix_test.mjs
      - name: Authority summary
        run: |
          echo "### Cold-Weather Service Capability Evidence Matrix" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classifications: cold-snap-capable / temperature-limited outdoor / controlled-environment required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evidence source types: service / product / equipment / site / process" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact temperature limits: source-owned only; no inferred thresholds" >> "$GITHUB_STEP_SUMMARY"
          echo "- Broad winter claim and automatic booking mutation: HOLD / NONE" >> "$GITHUB_STEP_SUMMARY"
