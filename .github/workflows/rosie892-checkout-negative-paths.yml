name: Rosie 892 Checkout Negative-Path Regression
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  checkout-negative-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/build892_checkout_negative_paths.test.mjs tests/build889_ala_carte_checkout.test.mjs tests/build892_checkout_provider_validation.test.mjs
      - run: node --check functions/api/_lib/ala-carte-v889.js
