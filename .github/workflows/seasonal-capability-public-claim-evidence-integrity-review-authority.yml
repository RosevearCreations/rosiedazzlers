name: Seasonal Capability & Public Claim Evidence Integrity Review Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-seasonal-public-claim-integrity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: seasonal-capability-public-claim-evidence-integrity-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Seasonal Capability & Public Claim Evidence Integrity Review
        run: |
          python scripts/seasonal_capability_public_claim_evidence_integrity_review_check.py
          node scripts/seasonal_capability_public_claim_evidence_integrity_review_test.mjs
      - name: Build 536 summary
        run: |
          {
            echo '### Seasonal Capability & Public Claim Evidence Integrity Review'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Retained Build 526 freshness authority: REVALIDATED'
            echo '- Owning evidence identity: EXPLICIT OR REVIEW'
            echo '- Owner/manual-publication identity: EXPLICIT OR REVIEW'
            echo '- Freshness window / source-owned limits: FAIL-CLOSED'
            echo '- Broad winter availability: HOLD'
            echo '- Supabase/schema/storage/persistent telemetry growth: NONE'
            echo '- Automatic publication/booking/quote/HOLD mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
