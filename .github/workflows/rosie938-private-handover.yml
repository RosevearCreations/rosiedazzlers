name: Rosie 938 private handover
on: [pull_request, push]
permissions:
  contents: read
jobs:
  private-handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check assets/handover938.mjs && node --test tests/build938_handover.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python tests/build938_handover_browser.py
