name: Local Search Provider & Attribution Evidence Quality Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-local-search-provider-attribution-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: local-search-provider-attribution-evidence-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/local_search_provider_attribution_evidence_quality_check.py
          node --check functions/api/_lib/local-search-measurement-conversion-attribution.js
          node --check functions/api/admin/local_search_measurement_conversion_attribution.js
          node --check assets/build450-local-search-measurement-conversion-attribution.js
          node --check scripts/local_search_provider_attribution_evidence_quality_test.mjs
      - name: Validate evidence quality
        run: python scripts/local_search_provider_attribution_evidence_quality_check.py
      - name: Authority summary
        run: |
          {
            echo '### Local Search Provider & Attribution Evidence Quality'
            echo "- SHA: `${GITHUB_SHA}`"
            echo '- Existing provider + same-session workbench reused: PASS'
            echo '- Freshness / identity / dated-window comparability: EXPLICIT'
            echo '- Bounded/truncated first-party attribution quality: EXPLICIT'
            echo '- Provider metric → session/funnel identity join: NONE'
            echo '- Provider metric correlation/causal conversion score: NONE'
            echo '- Provider/analytics/schema/publishing/outreach/DNS/ad-spend mutation or polling: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
