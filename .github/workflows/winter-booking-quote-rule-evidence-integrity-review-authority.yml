name: Winter Booking & Quote Rule Evidence Integrity Review Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-winter-rule-evidence-integrity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: winter-booking-quote-rule-evidence-integrity-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Winter Booking & Quote Rule Evidence Integrity Review
        run: |
          python scripts/winter_booking_quote_rule_evidence_integrity_review_check.py
          node scripts/winter_booking_quote_rule_evidence_integrity_review_test.mjs
      - name: Build 537 summary
        run: |
          {
            echo '### Winter Booking & Quote Rule Evidence Integrity Review'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Retained Build 527 freshness authority: REVALIDATED'
            echo '- Decision/outcome trace identity: EXPLICIT OR REVIEW'
            echo '- Service classification / customer wording / rule pair: FAIL-CLOSED'
            echo '- Availability / checkout collision identity: EXPLICIT OR REVIEW'
            echo '- Weather-ineligible sessions: EXCLUDED FROM ORDINARY CONVERSION INTERPRETATION'
            echo '- Broad winter availability: HOLD'
            echo '- Supabase/schema/storage/persistent telemetry growth: NONE'
            echo '- Automatic booking/quote/checkout/HOLD mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
