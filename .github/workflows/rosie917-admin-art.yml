name: Rosie 917 Admin Card Artwork
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  admin-art-917:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test all 40 original artwork assets and DOM integration
        run: |
          node --check assets/build648-admin-operator.js
          node tests/build917_admin_card_art.test.mjs
          node scripts/build842_generate_card_art.mjs --check
