name: Rosie 927 Inventory Guided Original Receiver and Enrollment Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guided-927:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check assets/build927-guided-readiness.mjs
          node --check functions/api/admin/sysop_927.js
          node --check assets/build927-admin.mjs
          node --check scripts/build927-local-signer.mjs
          node tests/build927_guided_readiness.test.mjs
          node tests/build926_runtime_certification.test.mjs
          node tests/build925_field_reconciliation.test.mjs
      - name: Parse Windows scripts without running them
        shell: pwsh
        run: |
          foreach ($file in @('scripts/build927-windows-guided-inventory.ps1','scripts/build927-provision-local-signer.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
