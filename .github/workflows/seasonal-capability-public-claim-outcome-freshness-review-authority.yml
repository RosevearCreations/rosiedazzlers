name: Seasonal Capability & Public Claim Outcome Freshness Review Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-seasonal-public-claim-freshness-\${{ github.ref }}-\${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: seasonal-capability-public-claim-outcome-freshness-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Seasonal Capability & Public Claim Outcome Freshness Review
        run: |
          python scripts/seasonal_capability_public_claim_outcome_freshness_review_check.py
          node scripts/seasonal_capability_public_claim_outcome_freshness_review_test.mjs
      - name: Build 526 summary
        run: |
          {
            echo '### Seasonal Capability & Public Claim Outcome Freshness Review'
            echo "- SHA: \${GITHUB_SHA}"
            echo '- Retained Build 516 outcome continuity: REVALIDATED'
            echo '- Stale outcome evidence: REVIEW, NEVER EXTEND CLAIM'
            echo '- Source-owned threshold / wording drift: MANUAL REVIEW'
            echo '- Broad winter availability: HOLD'
            echo '- Automatic publication/booking/quote/HOLD mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
