name: Build 308 Development Runtime Acceptance

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact Build 308 source contract
        run: python scripts/build308_release_check.py
      - name: Validate Development application remains healthy read-only
        run: bash scripts/build308_http_smoke.sh https://dev.rosiedazzlers.pages.dev
