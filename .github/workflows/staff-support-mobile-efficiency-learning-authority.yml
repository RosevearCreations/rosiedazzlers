name: Staff Support Mobile Efficiency Learning Authority
on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-staff-support-mobile-efficiency-learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: staff-support-mobile-efficiency-learning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/staff_support_mobile_efficiency_learning_check.py
          node --check functions/api/_lib/staff-support-mobile-efficiency-learning.js
          node --check functions/api/admin/staff_support_mobile_efficiency_learning.js
          node --check assets/build452-staff-support-mobile-efficiency-learning.js
          node --check scripts/staff_support_mobile_efficiency_learning_test.mjs
      - name: Validate Build 452 source authority
        run: |
          python scripts/staff_support_mobile_efficiency_learning_check.py
          node scripts/staff_support_mobile_efficiency_learning_test.mjs
      - name: Authority summary
        run: |
          echo "### Staff Workflow, Support & Mobile Efficiency Learning" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Root-cause / delay / mobile-friction inference: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic job/exception action, role escalation, telemetry or polling: NONE" >> "$GITHUB_STEP_SUMMARY"
