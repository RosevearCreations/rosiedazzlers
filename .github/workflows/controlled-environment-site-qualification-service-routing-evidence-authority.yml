name: Controlled-Environment Site Qualification & Service Routing Evidence Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-controlled-environment-site-qualification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: controlled-environment-site-qualification-service-routing-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Controlled-Environment Site Qualification & Service Routing Evidence
        run: |
          python scripts/controlled_environment_site_qualification_service_routing_evidence_check.py
          node scripts/controlled_environment_site_qualification_service_routing_evidence_test.mjs
      - name: Build 498 summary
        run: |
          {
            echo '### Controlled-Environment Site Qualification & Service Routing Evidence'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Site + workflow + equipment + product evidence: REQUIRED'
            echo '- Service-specific qualification only: PASS'
            echo '- Manual safe-reschedule/site confirmation fallback: PRESERVED'
            echo '- Automatic appointment move: NONE'
            echo '- Universal indoor capability claim: HOLD'
          } >> "$GITHUB_STEP_SUMMARY"
