name: Rosie 885 Independent Signed Retention Chain and Multi-Horizon Scheduler SLA
on:
  schedule:
    - cron: '43 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: rosie885-independent-chain-original-sla
  cancel-in-progress: false
jobs:
  independent-original-chain-and-sla:
    if: github.repository == 'RosevearCreations/rosiedazzlers' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all bounded original signed receipts and retention windows with 4h/24h/7d/30d source SLA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ROSIE881_ANCHOR_JOB_SECRET: ${{ secrets.ROSIE881_ANCHOR_JOB_SECRET }}
          ROSIE881_EXTERNAL_ANCHOR_PRIVATE_JWK: ${{ secrets.ROSIE881_EXTERNAL_ANCHOR_PRIVATE_JWK }}
        run: node scripts/build885_independent_retention_sla_audit.mjs
