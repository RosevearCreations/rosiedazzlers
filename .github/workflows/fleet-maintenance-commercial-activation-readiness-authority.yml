name: Fleet & Maintenance Commercial Activation Readiness Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-fleet-maintenance-activation-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: fleet-maintenance-commercial-activation-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/fleet_maintenance_commercial_activation_readiness_check.py
          node --check functions/api/_lib/maintenance-fleet-owner-approval.js
          node --check functions/api/admin/maintenance_fleet_owner_approval.js
          node --check assets/build439-maintenance-fleet-owner-approval.js
          node --check scripts/fleet_maintenance_commercial_activation_readiness_test.mjs
      - name: Validate activation readiness
        run: python scripts/fleet_maintenance_commercial_activation_readiness_check.py
      - name: Authority summary
        run: |
          {
            echo '### Fleet & Maintenance Commercial Activation Readiness'
            echo "- SHA: `${GITHUB_SHA}`"
            echo '- Existing owner-decision workbench reused: PASS'
            echo '- Seven activation-critical domains reconciled: PASS'
            echo '- Full source closure required for operator_review_ready: PASS'
            echo '- Commercial activation remains separately authorized: PASS'
            echo '- Automatic approval/activation/discount/booking/invoice/billing/provider/capacity mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
