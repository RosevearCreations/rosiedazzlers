name: Recovery Drill & Authenticated Device Closure Review Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
      - 'release*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-recovery-device-closure-review-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: recovery-authenticated-device-closure-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Recovery Drill & Authenticated Device Closure Review
        run: |
          python scripts/recovery_authenticated_device_closure_review_check.py
          node scripts/recovery_authenticated_device_closure_review_test.mjs
      - name: Build 510 summary
        run: |
          {
            echo '### Recovery Drill & Authenticated Device Closure Review'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Recovery/device evidence populations: SEPARATE'
            echo '- Current negative/missing evidence: RETAINS HOLD'
            echo '- Manual operator HOLD review: REQUIRED'
            echo '- Production restore/browser farm: NONE'
            echo '- Automatic HOLD narrowing: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
