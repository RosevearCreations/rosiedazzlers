name: Development Source Gate

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-development-source-gate
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate current Development source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact dev commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check current customer and Operations extracted-runtime syntax
        run: |
          node --check assets/my-account-v296.js
          node --check assets/admin-customers-v297.js
          node --check assets/admin-quotes-v298.js
          node --check assets/admin-booking-v299.js
          node --check assets/client-auth.js
          node --check assets/admin-auth.js
          node --check assets/admin-shell.js
          node --check functions/api/_lib/staff-auth.js
          node --check functions/api/_lib/action-permissions.js
          node --check functions/api/client/dashboard.js
          node --check functions/api/client/profile_update.js
          node --check functions/api/client/vehicles_save.js

      - name: Check retained runtime smoke helper syntax
        run: |
          bash -n scripts/development_http_smoke.sh
          for build in $(seq 284 299); do
            if [ -f "scripts/build${build}_http_smoke.sh" ]; then
              bash -n "scripts/build${build}_http_smoke.sh"
            fi
          done

      - name: Run retained focused guards through Build 299
        run: |
          for build in $(seq 271 299); do
            echo "== Build ${build} focused guard =="
            python "scripts/build${build}_release_check.py"
          done

      - name: Run retained authorization matrix and forward-restore proof
        run: |
          node scripts/build290_action_permission_test.mjs
          python scripts/build290_rollback_check.py

      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py

      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py

      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check

      - name: Check source whitespace/conflict markers outside byte-for-byte extracted runtimes
        run: |
          git diff --check HEAD^ -- . ':!*.md' ':!assets/admin-booking-v299.js'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Development source summary
        run: |
          {
            echo "### Development Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Current Build 296–299 extracted runtime syntax: PASS"
            echo "- Retained Builds 271–299 focused guards: PASS"
            echo "- Build 290 authorization/forward-restore proof: PASS"
            echo "- Cumulative release + one-H1 + route-copy guard: PASS"
            echo "- Byte-for-byte Build 299 runtime is excluded only from generic whitespace inspection; its exact extraction guard remains authoritative"
            echo "- This gate is source-only; Cloudflare Development acceptance remains separate."
          } >> "$GITHUB_STEP_SUMMARY"
