name: Current Source Gate

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-current-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate current source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check current JavaScript syntax
        run: |
          node --check assets/admin-shell.js
          node --check assets/contextual-help-catalog.js
          node --check assets/contextual-help.js
          node --check functions/api/admin/photo_library_sync.js
          node --check functions/api/admin/photo_library_list.js
          node --check functions/api/admin/photo_assignment_save.js
          node --check functions/api/admin/photo_library_delete.js
          node --check functions/api/_lib/photo-library.js
          node --check functions/api/_lib/staff-auth.js
          node --check functions/api/_lib/action-permissions.js
          node --check functions/api/admin/_middleware.js
          node --check assets/client-auth.js
          node --check assets/booking-hours.js
          node --check assets/pricing-catalog-client.js
          node --check functions/api/_lib/pricing-catalog.js
          node --check functions/api/landing_pages_public.js
          node --check assets/landing-page.js
          node --check functions/api/_lib/gallery-publication.js
          node --check functions/api/before_after_gallery_public.js
          node --check functions/api/membership_interest_create.js
          node --check functions/api/admin/membership_interest_list.js
          node --check assets/admin-final-balance-v317.js
          node --check functions/api/admin/final_balance_readiness.js
          node --check assets/admin-payment-readiness-v318.js
          node --check functions/api/admin/payment_provider_readiness.js
          node --check assets/admin-payment-acceptance-v319.js
          node --check functions/api/admin/payment_acceptance_evidence.js
          node --check assets/admin-payment-recovery-v320.js
          node --check functions/api/admin/payment_recovery_readiness.js
          node --check functions/api/admin/final_balance_checkout_create.js
          node --check assets/final-balance-payment-v320.js
          node --check functions/api/final_balance_payment_view.js
          node --check assets/admin-payment-reconciliation-v321.js
          node --check functions/api/admin/payment_reconciliation_readiness.js
          node --check assets/admin-production-readiness-v323.js
          node --check functions/api/admin/production_readiness.js

      - name: Check durable gate syntax
        run: |
          python -m py_compile scripts/release_check.py
          python -m py_compile scripts/seo_h1_check.py
          python -m py_compile scripts/seo_metadata_check.py
          python -m py_compile scripts/release_hygiene_check.py
          python -m py_compile scripts/responsive_static_check.py
          python -m py_compile scripts/maintenance_retention_check.py
          python -m py_compile scripts/final_balance_readiness_check.py
          python -m py_compile scripts/payment_provider_readiness_check.py
          python -m py_compile scripts/payment_acceptance_evidence_check.py
          python -m py_compile scripts/payment_recovery_customer_handoff_check.py
          python -m py_compile scripts/payment_reconciliation_check.py
          python -m py_compile scripts/release_rollback_recovery_check.py
          python -m py_compile scripts/production_readiness_check.py
          python -m py_compile scripts/sync_route_copies.py
          bash -n scripts/development_http_smoke.sh
          bash -n scripts/contextual_proof_http_smoke.sh
          bash -n scripts/cloudflare_pages_development.sh
          bash -n scripts/cloudflare_development_rollback.sh

      - name: Run cumulative source authority
        run: python scripts/release_check.py

      - name: Validate public SEO metadata
        run: python scripts/seo_metadata_check.py

      - name: Validate release hygiene
        run: python scripts/release_hygiene_check.py

      - name: Validate responsive source contract
        run: python scripts/responsive_static_check.py

      - name: Validate maintenance retention contracts
        run: python scripts/maintenance_retention_check.py

      - name: Validate final balance readiness contracts
        run: python scripts/final_balance_readiness_check.py

      - name: Validate payment provider readiness contracts
        run: python scripts/payment_provider_readiness_check.py

      - name: Validate payment acceptance evidence contracts
        run: python scripts/payment_acceptance_evidence_check.py

      - name: Validate payment recovery and customer handoff contracts
        run: python scripts/payment_recovery_customer_handoff_check.py

      - name: Validate payment reconciliation contracts
        run: python scripts/payment_reconciliation_check.py

      - name: Validate rollback and recovery acceptance contracts
        run: python scripts/release_rollback_recovery_check.py

      - name: Validate Production readiness contracts
        run: python scripts/production_readiness_check.py

      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check

      - name: Check source whitespace and conflict markers
        run: |
          git diff --check HEAD^ HEAD -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Current source summary
        run: |
          {
            echo "### Current Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Cumulative source authority: PASS"
            echo "- Sitemap one-H1 authority: PASS"
            echo "- Public SEO metadata/canonical/robots/structured-data authority: PASS"
            echo "- Release hygiene authority: PASS"
            echo "- Responsive source contract: PASS"
            echo "- Maintenance/retention authority: PASS"
            echo "- Final-balance readiness authority: PASS"
            echo "- Payment-provider readiness authority: PASS"
            echo "- Payment acceptance evidence authority: PASS"
            echo "- Payment recovery/customer handoff authority: PASS"
            echo "- Payment reconciliation authority: PASS"
            echo "- Rollback/recovery acceptance authority: PASS"
            echo "- Production readiness authority: PASS"
            echo "- Route-copy parity: PASS"
            echo "- Source whitespace/conflict-marker check: PASS"
            echo "- Cloudflare runtime acceptance remains a separate exact-SHA gate."
          } >> "$GITHUB_STEP_SUMMARY"
