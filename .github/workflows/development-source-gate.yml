name: Development Source Gate

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-development-source-gate
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate current Development source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact dev commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check current booking, pricing, Gallery and customer syntax
        run: |
          node --check assets/booking-quick-start-v274.js
          node --check assets/booking-retention-v275.js
          node --check assets/booking-usecase-entry-v282.js
          node --check assets/customer-rebook-v285.js
          node --check assets/customer-review-v286.js
          node --check assets/customer-review-share-v287.js
          node --check assets/customer-share-entry-v287.js
          node --check assets/customer-privacy-v288.js
          node --check assets/client-auth.js
          node --check assets/booking-hours.js
          node --check assets/pricing-catalog-client.js
          node --check functions/api/client/_lib/customer-safe-shape.js
          node --check functions/api/client/profile_update.js
          node --check functions/api/client/vehicles_save.js
          node --check functions/api/client/vehicles_list.js
          node --check functions/api/client/dashboard.js
          node --check functions/api/client/reviews_save.js
          node --check functions/api/_lib/pricing-catalog.js
          node --check functions/api/landing_pages_public.js
          node --check assets/landing-page.js
          node --check functions/api/_lib/gallery-publication.js
          node --check functions/api/before_after_gallery_public.js
          node --check functions/api/admin/gallery_approvals_list.js
          node --check functions/api/admin/gallery_approvals_save.js
          node --check functions/api/admin/gallery_media_candidates_list.js
          node --check assets/contextual-proof-v284.js
          node --check assets/visual-placeholders.js
      - name: Check growth, vehicle and payment syntax
        run: |
          node --check assets/growth-settings.js
          node --check functions/api/growth_settings_public.js
          node --check functions/api/_lib/vehicle-catalog.js
          node --check functions/api/vehicle_makes.js
          node --check functions/api/vehicle_models.js
          node --check functions/api/_lib/payment-money.js
          node --check functions/api/_lib/quote-deposit-payments.js
          node --check functions/api/paypal/capture-order.js
          node --check functions/api/paypal/webhook.js
          node --check functions/api/stripe/webhook.js
          node --check functions/api/checkout.js
      - name: Check Development smoke helper syntax
        run: |
          bash -n scripts/development_http_smoke.sh
          bash -n scripts/build284_http_smoke.sh
          bash -n scripts/build285_http_smoke.sh
          bash -n scripts/build286_http_smoke.sh
          bash -n scripts/build287_http_smoke.sh
          bash -n scripts/build288_http_smoke.sh
      - name: Check retained vehicle catalogue resilience
        run: node scripts/build274_vehicle_catalog_resilience_check.mjs
      - name: Check retained payment money units
        run: node scripts/build274_payment_money_check.mjs
      - name: Run retained Builds 271-288 focused guards
        run: |
          for build in $(seq 271 288); do python "scripts/build${build}_release_check.py"; done
      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py
      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py
      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check
      - name: Check source whitespace/conflict markers
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi
      - name: Development source summary
        run: |
          {
            echo "### Development Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Current booking/pricing/Gallery/growth/vehicle/payment/customer syntax: PASS"
            echo "- Builds 285-288 customer rebook/review/share/privacy syntax: PASS"
            echo "- Development + Build 284-288 HTTP smoke helper syntax: PASS"
            echo "- Retained Builds 271-288 focused guards: PASS"
            echo "- Cumulative release + one-H1 + route parity: PASS"
            echo "- Source whitespace/conflict-marker check: PASS"
            echo "- This gate is source-only; Cloudflare Development acceptance remains separate."
          } >> "$GITHUB_STEP_SUMMARY"
