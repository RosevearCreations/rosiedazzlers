name: Development Source Gate

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-development-source-gate
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate current Development source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact dev commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check current booking, pricing and Gallery syntax
        run: |
          node --check assets/booking-quick-start-v274.js
          node --check assets/booking-retention-v275.js
          node --check assets/booking-usecase-entry-v282.js
          node --check assets/booking-hours.js
          node --check assets/pricing-catalog-client.js
          node --check functions/api/_lib/pricing-catalog.js
          node --check functions/api/landing_pages_public.js
          node --check assets/landing-page.js
          node --check functions/api/_lib/gallery-publication.js
          node --check functions/api/before_after_gallery_public.js
          node --check functions/api/admin/gallery_approvals_list.js
          node --check functions/api/admin/gallery_approvals_save.js
          node --check functions/api/admin/gallery_media_candidates_list.js

      - name: Check growth, vehicle and payment syntax
        run: |
          node --check assets/growth-settings.js
          node --check functions/api/growth_settings_public.js
          node --check functions/api/_lib/vehicle-catalog.js
          node --check functions/api/vehicle_makes.js
          node --check functions/api/vehicle_models.js
          node --check functions/api/_lib/payment-money.js
          node --check functions/api/_lib/quote-deposit-payments.js
          node --check functions/api/paypal/capture-order.js
          node --check functions/api/paypal/webhook.js
          node --check functions/api/stripe/webhook.js
          node --check functions/api/checkout.js

      - name: Check Development smoke helper syntax
        run: bash -n scripts/development_http_smoke.sh
      - name: Check retained vehicle catalogue resilience
        run: node scripts/build274_vehicle_catalog_resilience_check.mjs
      - name: Check retained payment money units
        run: node scripts/build274_payment_money_check.mjs
      - name: Run retained Build 271 focused guard
        run: python scripts/build271_release_check.py
      - name: Run retained Build 272 focused guard
        run: python scripts/build272_release_check.py
      - name: Run retained Build 273 focused guard
        run: python scripts/build273_release_check.py
      - name: Run retained Build 274 focused guard
        run: python scripts/build274_release_check.py
      - name: Run retained Build 275 focused guard
        run: python scripts/build275_release_check.py
      - name: Run current Build 276 focused guard
        run: python scripts/build276_release_check.py
      - name: Run current Build 277 focused guard
        run: python scripts/build277_release_check.py
      - name: Run current Build 278 focused guard
        run: python scripts/build278_release_check.py
      - name: Run current Build 279 focused guard
        run: python scripts/build279_release_check.py
      - name: Run current Build 280 focused guard
        run: python scripts/build280_release_check.py
      - name: Run current Build 281 focused guard
        run: python scripts/build281_release_check.py
      - name: Run current Build 282 focused guard
        run: python scripts/build282_release_check.py
      - name: Run current Build 283 focused guard
        run: python scripts/build283_release_check.py
      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py
      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py

      - name: Check source whitespace/conflict markers
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Development source summary
        run: |
          {
            echo "### Development Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Current booking/pricing/Gallery/growth/vehicle/payment/landing syntax: PASS"
            echo "- Build 282 use-case booking adapter syntax: PASS"
            echo "- Build 283 proof/media publication syntax: PASS"
            echo "- Development HTTP smoke helper syntax: PASS"
            echo "- Retained Build 271–276 focused guards: PASS"
            echo "- Current Builds 277–283 service/SEO/release-reliability/customer-conversion/proof-publication guards: PASS"
            echo "- Cumulative release + one-H1 guard: PASS"
            echo "- Source whitespace/conflict-marker check: PASS"
            echo "- This gate is source-only; Cloudflare Development acceptance remains separate."
          } >> "$GITHUB_STEP_SUMMARY"
