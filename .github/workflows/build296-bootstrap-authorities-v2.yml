name: Build 296 Bootstrap Authorities V2

on:
  push:
    branches:
      - build-296-my-account-maintainability-extraction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch Build 296 authorities
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected text not found in {path}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Retained Build 295: static markers remain in HTML; behavior/runtime markers
          # move with the exact inline module into the Build 296 versioned asset.
          for token_line in [
              '    "data-build295-maintenance-interest-only",\n',
              '    "Maintenance timing is an interest preference",\n',
              '    "No fixed cadence, price, discount, priority, appointment, subscription or recurring billing",\n',
              '    "/api/client/profile_update",\n',
              '    "/api/client/vehicles_save",\n',
          ]:
              replace_once('scripts/build295_release_check.py', token_line, '', f'Build 295 runtime token relocation {token_line.strip()}')

          anchor='if read("my-account.html") != read("my-account/index.html"):\n    errors.append("My Account route copies are not exact")\n'
          insertion='''if read("my-account.html") != read("my-account/index.html"):\n    errors.append("My Account route copies are not exact")\n\n# Build 296 external module extraction is a stronger maintainability shape.\n# On the original Build 295 branch these markers remain inline; after Build 296\n# they must remain in the versioned account module instead.\naccount_asset = ROOT / "assets/my-account-v296.js"\nif account_asset.exists():\n    account_runtime = read("assets/my-account-v296.js")\n    for rel in pages:\n        need(rel, '<script type="module" src="/assets/my-account-v296.js"></script>')\n        forbid(rel, '<script type="module">')\nelse:\n    account_runtime = read("my-account.html")\nfor token in [\n    "data-build295-maintenance-interest-only",\n    "Maintenance timing is an interest preference",\n    "No fixed cadence, price, discount, priority, appointment, subscription or recurring billing",\n    "/api/client/profile_update",\n    "/api/client/vehicles_save",\n]:\n    if token not in account_runtime:\n        errors.append(f"customer account runtime missing {token}")\nif account_asset.exists():\n    forbid(\n        "assets/my-account-v296.js",\n        "acctAdminNotes", "vehAdminNotes", "vehNextDue", "vehNextServiceMileage",\n        "vehIntervalDays", "vehAutoSchedule", "admin_private_notes",\n        "next_cleaning_due_at:$('#vehNextDue')",\n        "next_service_mileage_km:$('#vehNextServiceMileage')",\n        "service_interval_days:$('#vehIntervalDays')",\n        "auto_schedule_opt_in:$('#vehAutoSchedule')",\n        "unlock maintenance pricing", "reduced maintenance pricing",\n        "reduced repeat-clean pricing", "Maintenance eligible",\n        "Recurring maintenance scheduling only starts",\n        "Your account can move into recurring maintenance",\n    )\n'''
          replace_once('scripts/build295_release_check.py',anchor,insertion,'Build 295 external module compatibility')

          old='''need(\n    "AI_PROJECT_HANDOFF.md",\n    "**Build:** 295",\n    BUILD294_PRODUCTION_SHA,\n    "customer account static source authority cleanup",\n    "extract the mature My Account inline JavaScript into a versioned asset",\n)\nneed(\n    "MASTER_VALUE_ROADMAP.md",\n    "**Build:** 295",\n    BUILD294_PRODUCTION_SHA,\n    "Build 295 — customer account static source authority cleanup",\n    "My Account maintainability extraction",\n)\n'''
          new='''handoff = read("AI_PROJECT_HANDOFF.md")\nif "**Build:** 295" not in handoff and "**Build:** 296" not in handoff:\n    errors.append("AI_PROJECT_HANDOFF.md missing Build 295/296 living authority marker")\nfor token in ["customer account static source authority cleanup", "My Account maintainability extraction"]:\n    if token not in handoff:\n        errors.append(f"AI_PROJECT_HANDOFF.md missing retained Build 295 token {token}")\nroadmap = read("MASTER_VALUE_ROADMAP.md")\nif "**Build:** 295" not in roadmap and "**Build:** 296" not in roadmap:\n    errors.append("MASTER_VALUE_ROADMAP.md missing Build 295/296 living authority marker")\nfor token in ["Build 295 — customer account static source authority cleanup", "My Account maintainability extraction"]:\n    if token not in roadmap:\n        errors.append(f"MASTER_VALUE_ROADMAP.md missing retained Build 295 token {token}")\n'''
          replace_once('scripts/build295_release_check.py',old,new,'Build 295 living docs compatibility')

          # Cumulative Development source gate through Build 296.
          replace_once('.github/workflows/development-source-gate.yml',
          '''      - name: Check Build 295 customer account source authority syntax\n        run: |\n          python -m py_compile scripts/build295_release_check.py\n          bash -n scripts/build295_http_smoke.sh\n          node --check functions/api/client/profile_update.js\n          node --check functions/api/client/vehicles_save.js\n''',
          '''      - name: Check Build 295 customer account source authority syntax\n        run: |\n          python -m py_compile scripts/build295_release_check.py\n          bash -n scripts/build295_http_smoke.sh\n          node --check functions/api/client/profile_update.js\n          node --check functions/api/client/vehicles_save.js\n\n      - name: Check Build 296 My Account maintainability extraction syntax\n        run: |\n          python -m py_compile scripts/build296_release_check.py\n          bash -n scripts/build296_http_smoke.sh\n          node --check assets/my-account-v296.js\n''','Development Build 296 syntax')
          replace_once('.github/workflows/development-source-gate.yml',
          '          bash -n scripts/build295_http_smoke.sh\n\n      - name: Check retained vehicle catalogue resilience',
          '          bash -n scripts/build295_http_smoke.sh\n          bash -n scripts/build296_http_smoke.sh\n\n      - name: Check retained vehicle catalogue resilience','Development Build 296 smoke syntax')
          replace_once('.github/workflows/development-source-gate.yml',
          '      - name: Run current Build 295 focused guard\n        run: python scripts/build295_release_check.py\n',
          '      - name: Run current Build 295 focused guard\n        run: python scripts/build295_release_check.py\n      - name: Run current Build 296 focused guard\n        run: python scripts/build296_release_check.py\n','Development Build 296 guard')
          replace_once('.github/workflows/development-source-gate.yml',
          '            echo "- Build 295 customer account static-source authority cleanup: PASS"',
          '            echo "- Build 295 customer account static-source authority cleanup: PASS"\n            echo "- Build 296 My Account maintainability extraction: PASS"','Development Build 296 summary')

          # Living handoff.
          replace_once('AI_PROJECT_HANDOFF.md','**Build:** 295','**Build:** 296','handoff build')
          replace_once('AI_PROJECT_HANDOFF.md',
          '''Build 295 is the active **customer account static source authority cleanup** Development-first slice. It follows the accepted Build 294 Production promotion at SHA `5d6041501b205a03dd62522a6ffb9a49a822284b`.\n\nBuild 294 is the accepted Production baseline while Build 295 is validated in Development. Build 290 remains the retained authorization/direct-URL/API + forward-restore authority, with Build 289 as its verified restore anchor.\n\nBuild 295 follows the normal boundary: exact feature source gate + Cloudflare feature preview first, then a non-force Development fast-forward, then Development source/runtime/Cloudflare acceptance. **Production remains closed** for Build 295 until deliberate promotion from accepted Development evidence.\n''',
          '''Build 296 is the active **My Account maintainability extraction** Development-first slice. It follows the accepted Build 295 Production promotion at SHA `73556e1f41dc204290409294c5e38ad0b2090fb7`.\n\nBuild 295 is the accepted Production baseline while Build 296 is validated. Build 290 remains the retained authorization/direct-URL/API + forward-restore authority, with Build 289 as its verified restore anchor.\n\nBuild 296 follows the normal boundary: exact feature source gate + Cloudflare feature preview first, then a non-force Development fast-forward, then Development source/runtime/Cloudflare acceptance. **Production remains closed** for Build 296 until deliberate promotion from accepted Development evidence.\n''','handoff release state')
          replace_once('AI_PROJECT_HANDOFF.md','## Completed customer/business work through Build 295','## Completed customer/business work through Build 296','handoff completed heading')
          replace_once('AI_PROJECT_HANDOFF.md',
          '- Build 295 removes those stale staff/private scheduling controls and unapproved maintenance-pricing language from the static My Account source and browser payloads themselves.\n',
          '- Build 295 removes those stale staff/private scheduling controls and unapproved maintenance-pricing language from the static My Account source and browser payloads themselves.\n- Build 296 extracts the accepted My Account inline module byte-for-byte into `assets/my-account-v296.js`, leaving customer behavior and API authority unchanged while making the account runtime directly syntax-testable.\n','handoff Build296 bullet')
          replace_once('AI_PROJECT_HANDOFF.md','## Current validation authority\n',
          '''## Build 296 — My Account maintainability extraction\n\nBuild 296 moves the accepted Build 295 inline account module into `assets/my-account-v296.js` without refactoring it. Both route copies remain exact and the external module tag stays in the same execution position after `chrome.js` and `client-auth.js`. The focused guard reconstructs the accepted Build 295 page and proves the only page change is that script extraction. There is no customer behavior, API authority, maintenance-economics or schema change.\n\n## Current validation authority\n''','handoff Build296 section')
          replace_once('AI_PROJECT_HANDOFF.md','- Development source workflow: `.github/workflows/development-source-gate.yml` through Build 295;\n',
          '- focused Build 296 guard: `scripts/build296_release_check.py`;\n- Build 296 runtime smoke: `scripts/build296_http_smoke.sh`;\n- Build 296 feature workflow: `.github/workflows/build296-source-gate.yml`;\n- Build 296 Development runtime workflow: `.github/workflows/build296-development-acceptance.yml`;\n- Development source workflow: `.github/workflows/development-source-gate.yml` through Build 296;\n','handoff validation')
          replace_once('AI_PROJECT_HANDOFF.md',
          'Never call Build 295 Development-green until exact feature SHA + feature preview, exact `dev`, Development source/runtime gates and Cloudflare artifact agree.\n\n## Next business/product work after Build 295\n',
          'Never call Build 296 Development-green until exact feature SHA + feature preview, exact `dev`, Development source/runtime gates and Cloudflare artifact agree.\n\n## Next business/product work after Build 296\n','handoff release rule')
          replace_once('AI_PROJECT_HANDOFF.md',
          '''1. extract the mature My Account inline JavaScript into a versioned asset without changing customer behavior, reducing future source-authority drift and making account logic easier to test;\n2. genuine consented proof through the retained Build 283/284 path;\n3. Google Business Profile/Search Console verification when account access exists;\n4. maintenance commercial rules only after cadence/economics/included scope/pause/cancel/priority terms are approved;\n5. fleet commercial rules only after minimum count, same-location/travel, discount, commitment and cancellation terms are approved;\n6. notification-provider and targeted real-device/browser evidence when available;\n7. payment settlement/reconciliation evidence only when real transaction testing is deliberately reopened;\n8. referral/loyalty economics only after explicit business approval.\n''',
          '''1. genuine consented proof through the retained Build 283/284 path;\n2. Google Business Profile/Search Console verification when account access exists;\n3. maintenance commercial rules only after cadence/economics/included scope/pause/cancel/priority terms are approved;\n4. fleet commercial rules only after minimum count, same-location/travel, discount, commitment and cancellation terms are approved;\n5. notification-provider and targeted real-device/browser evidence when available;\n6. payment settlement/reconciliation evidence only when real transaction testing is deliberately reopened;\n7. referral/loyalty economics only after explicit business approval.\n''','handoff next work')

          # Living roadmap.
          replace_once('MASTER_VALUE_ROADMAP.md','**Build:** 295','**Build:** 296','roadmap build')
          replace_once('MASTER_VALUE_ROADMAP.md','Builds 274–295 added booking/retention, SEO/local depth, exact-release mechanics, proof/publication, contextual proof, authenticated rebook, completed-job review, neutral review/share attribution, customer/staff privacy, account resilience, deeper authorization acceptance, forward-restore readiness, maintenance interest intake, fleet/workplace assessment, customer next-action orchestration and customer maintenance-authority closure and static customer-account source-authority cleanup without replacing those foundations.','Builds 274–296 added booking/retention, SEO/local depth, exact-release mechanics, proof/publication, contextual proof, authenticated rebook, completed-job review, neutral review/share attribution, customer/staff privacy, account resilience, deeper authorization acceptance, forward-restore readiness, maintenance interest intake, fleet/workplace assessment, customer next-action orchestration, customer maintenance-authority closure, static customer-account source-authority cleanup and My Account maintainability extraction without replacing those foundations.','roadmap baseline range')
          replace_once('MASTER_VALUE_ROADMAP.md','Build 294 is the accepted Production baseline at `5d6041501b205a03dd62522a6ffb9a49a822284b`. Build 295 is the active Development-first customer account source-authority release. **Production remains closed** for Build 295 until deliberate promotion from final exact accepted Development evidence.','Build 295 is the accepted Production baseline at `73556e1f41dc204290409294c5e38ad0b2090fb7`. Build 296 is the active Development-first My Account maintainability extraction. **Production remains closed** for Build 296 until deliberate promotion from final exact accepted Development evidence.','roadmap Production baseline')
          replace_once('MASTER_VALUE_ROADMAP.md',
          '## Ordered next value work\n\n### 1. My Account maintainability extraction\nMove the mature inline My Account JavaScript into a versioned asset without changing customer behavior. This should reduce future static-source/runtime drift, make syntax testing direct, and keep the current account APIs and authority boundaries intact.\n\n### 2. Genuine proof + Google trust\n',
          '''## Build 296 — My Account maintainability extraction\n\nRules:\n\n- `assets/my-account-v296.js` is byte-for-byte the accepted Build 295 inline module;\n- both My Account route copies are exact and differ from Build 295 only by the external module tag;\n- module execution position and current customer API calls remain unchanged;\n- Builds 288/294/295 remain retained defense in depth;\n- Build 296 adds no customer behavior, API authority, maintenance economics, polling or schema migration.\n\n## Ordered next value work\n\n### 1. Genuine proof + Google trust\n''','roadmap Build296 section')
          for old,new in [
              ('### 3. Maintenance-plan commercial model','### 2. Maintenance-plan commercial model'),
              ('### 4. Fleet commercial model','### 3. Fleet commercial model'),
              ('### 5. Notification/device evidence','### 4. Notification/device evidence'),
              ('### 6. Referral/loyalty commercial model','### 5. Referral/loyalty commercial model'),
              ('### 7. Payments / Finance / accounting','### 6. Payments / Finance / accounting'),
              ('### 8. Continue modular extraction only when it creates value','### 7. Continue modular extraction only when it creates value'),
          ]:
              replace_once('MASTER_VALUE_ROADMAP.md',old,new,f'roadmap renumber {old}')
          replace_once('MASTER_VALUE_ROADMAP.md','- `.github/workflows/development-source-gate.yml` — cumulative Development source gate through Build 295;\n',
          '- `scripts/build296_release_check.py` — exact My Account extraction/authority guard;\n- `.github/workflows/build296-source-gate.yml` — Build 296 feature source gate;\n- `scripts/build296_http_smoke.sh` — read-only versioned My Account runtime guard;\n- `.github/workflows/build296-development-acceptance.yml` — Build 296 `dev` runtime acceptance;\n- `.github/workflows/development-source-gate.yml` — cumulative Development source gate through Build 296;\n','roadmap validation')

          # Temporary machinery must not reach the candidate.
          for temp in [
              '.github/workflows/build296-bootstrap-authorities.yml',
              '.github/workflows/build296-bootstrap-authorities-v2.yml',
              'BUILD296_AUTHORITIES_TRIGGER.tmp',
          ]:
              Path(temp).unlink(missing_ok=True)
          PY
      - name: Validate patched retained authority
        run: |
          python -m py_compile scripts/build295_release_check.py scripts/build296_release_check.py
          node --check assets/my-account-v296.js
          bash -n scripts/build295_http_smoke.sh
          bash -n scripts/build296_http_smoke.sh
          python scripts/build295_release_check.py
          git diff --check -- . ':!*.md'
      - name: Commit Build 296 authority convergence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- . ':!*.md'
          git commit -m "Build 296 converge retained guards and living authorities"
          git push origin HEAD:build-296-my-account-maintainability-extraction
