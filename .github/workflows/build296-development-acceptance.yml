name: Build 296 Development Runtime Acceptance

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build296-development-runtime
  cancel-in-progress: true

jobs:
  runtime:
    name: Validate Build 296 Development runtime
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact Development commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconfirm Build 296 and retained account authorities
        run: |
          python scripts/build296_release_check.py
          python scripts/build295_release_check.py
          python scripts/build294_release_check.py
          python scripts/build293_release_check.py
          python scripts/build290_release_check.py
          python scripts/build288_release_check.py
          node scripts/build290_action_permission_test.mjs
          python scripts/build290_rollback_check.py
          node --check assets/my-account-v296.js

      - name: Wait for Development alias and run read-only smoke
        run: |
          for attempt in $(seq 1 24); do
            echo "Build 296 Development runtime attempt ${attempt}/24"
            if bash scripts/build296_http_smoke.sh https://dev.rosiedazzlers.pages.dev "Build 296 Development runtime"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Build 296 Development alias did not converge to an acceptable runtime."
          exit 1

      - name: Development runtime summary
        run: |
          {
            echo "### Build 296 Development Runtime Acceptance"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- /my-account loads /assets/my-account-v296.js: PASS"
            echo "- Retained Build 288/294/295 privacy and maintenance authority: PASS"
            echo "- Anonymous dashboard remains signed-out/customer-safe: PASS"
            echo "- Runtime smoke is read-only"
            echo "- No customer behavior/API/schema/maintenance-economics change introduced by Build 296"
            echo "- Production remains closed"
          } >> "$GITHUB_STEP_SUMMARY"
