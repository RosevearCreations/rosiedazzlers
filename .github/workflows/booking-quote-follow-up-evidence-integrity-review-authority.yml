name: Booking & Quote Follow-Up Evidence Integrity Review Authority

on:
  push:
    branches:
      - dev
      - main
    # Build 776: relevant domain changes only; manual dispatch remains available.
    paths:
      - '**/*booking*'
      - '**/*quote*'
      - '**/*pricing*'
      - '.github/workflows/booking-quote-follow-up-evidence-integrity-review-authority.yml'
      - 'functions/api/_lib/staff-auth.js'
      - 'functions/_middleware.js'
      - 'scripts/release_check.py'
      - 'scripts/ci-source-cache/**'
      - 'assets/styles.css'
      - '!scripts/current_booking_wizard_regression.sh'

  pull_request:
    branches:
      - dev
      - main
    # Build 776: relevant domain changes only; manual dispatch remains available.
    paths:
      - '**/*booking*'
      - '**/*quote*'
      - '**/*pricing*'
      - '.github/workflows/booking-quote-follow-up-evidence-integrity-review-authority.yml'
      - 'functions/api/_lib/staff-auth.js'
      - 'functions/_middleware.js'
      - 'scripts/release_check.py'
      - 'scripts/ci-source-cache/**'
      - 'assets/styles.css'
      - '!scripts/current_booking_wizard_regression.sh'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-booking-quote-follow-up-integrity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: booking-quote-follow-up-evidence-integrity-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Booking & Quote Follow-Up Evidence Integrity Review
        run: |
          python scripts/booking_quote_follow_up_evidence_integrity_review_check.py
          node scripts/booking_quote_follow_up_evidence_integrity_review_test.mjs
      - name: Build 542 summary
        run: |
          {
            echo '### Booking & Quote Follow-Up Evidence Integrity Review'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Retained Build 531 freshness authority: REVALIDATED'
            echo '- Measurement/metric/allocation/duration: EXACT OR REVIEW'
            echo '- Weather-ineligible sessions: EXCLUDED'
            echo '- Owner outcome/decision trace/authorization/observation: EXACT OR REVIEW'
            echo '- Pricing / outreach / booking / canonical HOLD mutation: NONE'
            echo '- Triggered stop condition: REVIEW/HOLD'
          } >> "$GITHUB_STEP_SUMMARY"
