name: Authenticated Device Acceptance Closure Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-authenticated-device-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: authenticated-device-acceptance-closure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/authenticated_device_acceptance_closure_check.py
          node --check functions/api/_lib/authenticated-device-visual-acceptance.js
          node --check functions/api/admin/authenticated_device_visual_acceptance.js
          node --check assets/launch-readiness-consolidation.js
          node --check scripts/authenticated_device_acceptance_closure_test.mjs
      - name: Validate authenticated device acceptance closure
        run: python scripts/authenticated_device_acceptance_closure_check.py
      - name: Authority summary
        run: |
          {
            echo '### Authenticated Device Acceptance Closure'
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo '- Existing Build 438/448 classifier reused: PASS'
            echo '- Customer/Detailer/Operations/Admin current coverage: EXPLICIT'
            echo '- Phone/tablet/desktop current coverage: EXPLICIT'
            echo '- Stale/missing/unavailable coverage: EXPLICIT'
            echo '- Complete package is operator-review-ready only'
            echo '- Source responsive/accessibility checks remain supporting-only'
            echo '- Screenshot capture/polling or business/provider/storage mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
