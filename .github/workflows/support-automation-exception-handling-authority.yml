name: Build 433 — Support Automation & Exception Handling Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build433-support-exceptions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-authority:
    name: Validate support automation and exception handling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate syntax
        run: |
          python -m py_compile scripts/support_automation_exception_handling_check.py
          node --check assets/build433-support-exceptions.js
          node --check functions/api/admin/support_exceptions.js

      - name: Validate Build 433 source authority
        run: python scripts/support_automation_exception_handling_check.py

      - name: Re-run retained support, diagnostics and release authorities
        run: |
          python scripts/production_observability_self_diagnostics_check.py
          python scripts/production_support_diagnostics_check.py
          node scripts/production_support_diagnostics_test.mjs
          python scripts/payment_reconciliation_check.py
          python scripts/it_readiness_release_control_audit.py
          python scripts/release_authority_documentation_convergence_check.py

      - name: Authority summary
        run: |
          {
            echo "### Build 433 support automation authority"
            echo "- SHA: `${GITHUB_SHA}`"
            echo "- Staff-only I.T. exception queue: PASS"
            echo "- Severity/source/freshness/dependency/safe-next-action contract: PASS"
            echo "- Retained Production support diagnostics: PASS"
            echo "- Retained payment reconciliation authority: PASS"
            echo "- Manual refresh; no permanent polling: PASS"
            echo "- No refund/payment/booking/customer/accounting/inventory/provider/secret/restore/R2/release-protection mutation introduced."
          } >> "$GITHUB_STEP_SUMMARY"
