name: Backup & Recovery Evidence Closure Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-backup-recovery-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: backup-recovery-evidence-closure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/backup_recovery_evidence_closure_check.py
          node --check functions/api/_lib/backup-recovery-evidence-closure.js
          node --check functions/api/admin/backup_recovery_evidence_closure.js
          node --check scripts/backup_recovery_evidence_closure_test.mjs
      - name: Validate Backup & Recovery Evidence Closure
        run: python scripts/backup_recovery_evidence_closure_check.py
      - name: Authority summary
        run: |
          {
            echo '### Backup & Recovery Evidence Closure'
            echo "- SHA: `${GITHUB_SHA}`"
            echo '- Dated backup artifact / retention / bounded drill classification: PASS'
            echo '- Source GREEN vs observed recovery boundary: PASS'
            echo '- Canonical HOLD auto-mutation: NONE'
            echo '- Production restore/rollback/DNS/secret/destructive-R2/schema/business mutation: NONE'
            echo '- Permanent polling: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
