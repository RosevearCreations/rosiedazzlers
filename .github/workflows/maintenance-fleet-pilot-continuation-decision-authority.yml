name: Build 511 — Maintenance & Fleet Pilot Continuation Decision Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
      - 'release*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-maintenance-fleet-pilot-continuation-decision-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: maintenance-fleet-pilot-continuation-decision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/maintenance_fleet_pilot_continuation_decision_check.py
          node --check scripts/maintenance_fleet_pilot_continuation_decision_test.mjs
          node --check functions/api/_lib/maintenance-fleet-pilot-continuation-decision.js
          node --check functions/api/admin/maintenance_fleet_pilot_continuation_decision.js
      - name: Validate Build 511 source authority
        run: |
          python scripts/maintenance_fleet_pilot_continuation_decision_check.py
          node scripts/maintenance_fleet_pilot_continuation_decision_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 511 — Maintenance & Fleet Pilot Continuation Decision" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retained Build 501 current evidence remains authoritative" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explicit owner continue/hold decision attribution is required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered stop conditions block an accepted continue decision" >> "$GITHUB_STEP_SUMMARY"
          echo "- Continue decision record never executes continuation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Activation, recurring billing, invoice mutation, capacity reservation, HOLD mutation and polling: NONE" >> "$GITHUB_STEP_SUMMARY"
