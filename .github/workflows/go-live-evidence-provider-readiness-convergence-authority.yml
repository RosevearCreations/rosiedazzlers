name: Build 406 — Go-Live Evidence & Provider Readiness Convergence

on:
  push:
    branches:
      - build406-go-live-evidence-provider-readiness-convergence
      - dev
      - main
    paths:
      - "BUILD406_GO_LIVE_EVIDENCE_PROVIDER_READINESS_CONVERGENCE.md"
      - "BUILD405_FULL_RESPONSIVE_PRODUCTION_ACCEPTANCE_ROADMAP_RENEWAL.md"
      - "FORWARD_BUILD_ROADMAP_405_415.md"
      - "STARTUP_GO_LIVE_BLOCKERS.md"
      - "AUTONOMOUS_RELEASE_QUEUE.md"
      - "AI_PROJECT_HANDOFF.md"
      - "README.md"
      - "admin/it.html"
      - "functions/api/admin/go_live_readiness.js"
      - "functions/api/admin/production_diagnostics.js"
      - "scripts/build406_go_live_evidence_provider_readiness_convergence_check.py"
      - "scripts/build405_full_responsive_production_acceptance_roadmap_renewal_check.py"
      - "scripts/release_authority_documentation_convergence_check.py"
      - "scripts/cloudflare_pages_production_acceptance.sh"
      - ".github/workflows/go-live-evidence-provider-readiness-convergence-authority.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build406-authority:
    name: build406 authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build 406 readiness endpoint syntax
        run: node --check functions/api/admin/go_live_readiness.js
      - name: Build 406 go-live evidence/provider-readiness authority
        run: python scripts/build406_go_live_evidence_provider_readiness_convergence_check.py
      - name: Retained Build 405 capstone authority
        run: python scripts/build405_full_responsive_production_acceptance_roadmap_renewal_check.py
      - name: Release authority convergence
        run: python scripts/release_authority_documentation_convergence_check.py

  verify-production:
    name: Verify exact Production deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build406-authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}
      CF_PROJECT_NAME: rosiedazzlers
      CF_PRODUCTION_BRANCH: main
      CF_PRODUCTION_URL: https://rosiedazzlers.ca
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Cloudflare Production deployment and runtime
        shell: bash
        run: bash scripts/cloudflare_pages_production_acceptance.sh
