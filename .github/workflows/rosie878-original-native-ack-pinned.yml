name: Rosie Dazzlers 878 Original Native Event and Owner Custody Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build878-original-native-owner-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original native event, immutable SLA owner acknowledgement and pinned issuer proof
        run: |
          node scripts/build878_native_ack_pinned_test.mjs
          node scripts/build877_provider_sla_provenance_test.mjs
          node scripts/build876_native_escalation_artifact_test.mjs
