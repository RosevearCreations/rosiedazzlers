name: Build 493 — Staff & Mobile Remediation Outcome Evidence Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-staff-mobile-remediation-outcome-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: staff-mobile-remediation-outcome-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/staff_mobile_remediation_outcome_evidence_check.py
          node --check functions/api/_lib/staff-support-mobile-efficiency-learning.js
          node --check functions/api/admin/staff_support_mobile_efficiency_learning.js
          node --check assets/build452-staff-support-mobile-efficiency-learning.js
          node --check scripts/staff_mobile_remediation_outcome_evidence_test.mjs
      - name: Validate Build 493 source authority
        run: |
          python scripts/staff_mobile_remediation_outcome_evidence_check.py
          node scripts/staff_mobile_remediation_outcome_evidence_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 493 — Staff & Mobile Remediation Outcome Evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Attributable execution plus materially like-for-like before/after observations are required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Role, workflow and representative device/browser context stay explicit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Southern Ontario weather/site restrictions remain separate from staff/mobile friction" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic effectiveness/causation claims, mutation, telemetry and polling: NONE" >> "$GITHUB_STEP_SUMMARY"
