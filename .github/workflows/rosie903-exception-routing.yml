name: Rosie 903 Exception Ownership and Internal Outbox Source Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exception903:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scoped original source / API syntax
        run: |
          node --check assets/build903-exception-routing.mjs
          node --check functions/api/admin/exception_routing_v903.js
          node --check functions/api/admin/jobday_exceptions_v902.js
          node --check functions/api/admin/jobday_dispatch_v901.js
          node --check functions/api/detailer/job_action.js
      - name: Verify Build 903 ownership, routing and UNSENT boundary
        run: node --test tests/build903_exception_routing.test.mjs
      - name: Preserve Builds 899, 900, 901 and 902
        run: node --test tests/build899_supplies_equipment.test.mjs tests/build900_workforce_safety.test.mjs tests/build901_jobday_dispatch_safety.test.mjs tests/build902_jobday_exception_sla_handoff.test.mjs
