name: Build 299 bootstrap booking dashboard runtime extraction

on:
  push:
    branches:
      - build-299-operations-booking-dashboard-maintainability-extraction

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract exact booking dashboard module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          asset = Path('assets/admin-booking-v299.js')
          pages = [Path('admin-booking.html'), Path('admin-booking/index.html')]
          marker = '<script type="module">'
          closing = '</script>'

          if asset.exists():
              print('Build 299 runtime already extracted; no-op.')
              raise SystemExit(0)

          modules = []
          texts = []
          for page in pages:
              text = page.read_text(encoding='utf-8')
              start = text.rfind(marker)
              if start < 0:
                  raise SystemExit(f'Missing inline module in {page}')
              body_start = start + len(marker)
              end = text.find(closing, body_start)
              if end < 0:
                  raise SystemExit(f'Missing inline module close in {page}')
              module = text[body_start:end]
              modules.append(module)
              texts.append((page, text, start, end + len(closing)))

          if modules[0] != modules[1]:
              raise SystemExit('Root/folder booking runtime copies differ before extraction')
          if 'import { setBrandImages, setFooter } from "/assets/site.js";' not in modules[0]:
              raise SystemExit('Expected booking module import missing')
          required = [
              '/api/admin/bookings',
              '/api/admin/booking_update',
              '/api/admin/assign_booking',
              '/api/admin/staff_assignable_list',
              '/api/admin/booking_finance',
              'window.AdminShell',
          ]
          for token in required:
              if token not in modules[0]:
                  raise SystemExit(f'Expected booking authority marker missing: {token}')

          asset.write_text(modules[0].lstrip('\n'), encoding='utf-8')
          tag = '<script type="module" src="/assets/admin-booking-v299.js"></script>'
          for page, text, start, end in texts:
              page.write_text(text[:start] + tag + text[end:], encoding='utf-8')

          if pages[0].read_text(encoding='utf-8') != pages[1].read_text(encoding='utf-8'):
              raise SystemExit('Root/folder booking pages differ after extraction')
          print('Build 299 exact booking runtime extraction complete.')
          PY
      - name: Validate extracted JavaScript syntax
        run: node --check assets/admin-booking-v299.js
      - name: Commit extraction
        run: |
          if git diff --quiet && git status --porcelain | grep -q '^??' ; then :; fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "No extraction changes to commit."
            exit 0
          fi
          git config user.name "John Rosevear"
          git config user.email "jfrosevear@gmail.com"
          git add admin-booking.html admin-booking/index.html assets/admin-booking-v299.js
          git commit -m "Build 299 extract booking dashboard runtime"
          git push
