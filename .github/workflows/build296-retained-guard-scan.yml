name: Build 296 Retained Guard Scan

on:
  push:
    branches:
      - build-296-my-account-maintainability-extraction

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan retained account-location assumptions
        run: |
          grep -nEH 'my-account|renderHistory|renderGarage|/api/client/dashboard|/api/client/profile_update|/api/client/vehicles_save|bookingHistory|maintenanceConversion' scripts/build28[5-9]_release_check.py scripts/build29[0-5]_release_check.py || true
