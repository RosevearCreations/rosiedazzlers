name: Maintenance & Fleet Continuation Evidence Integrity Review Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-maintenance-fleet-continuation-integrity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: maintenance-fleet-continuation-evidence-integrity-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Maintenance & Fleet Continuation Evidence Integrity Review
        run: |
          python scripts/maintenance_fleet_continuation_evidence_integrity_review_check.py
          node scripts/maintenance_fleet_continuation_evidence_integrity_review_test.mjs
      - name: Build 541 summary
        run: |
          {
            echo '### Maintenance & Fleet Continuation Evidence Integrity Review'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Retained Build 531 freshness authority: REVALIDATED'
            echo '- Participant/duration + execution trace: EXACT OR REVIEW'
            echo '- Capacity/invoicing/travel/stop identity: COMPLETE OR REVIEW'
            echo '- Owner continue/hold identity: EXACT + CURRENT OR REVIEW'
            echo '- Enrollment / recurring billing / booking / invoice mutation: NONE'
            echo '- Capacity reservation / canonical HOLD mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
