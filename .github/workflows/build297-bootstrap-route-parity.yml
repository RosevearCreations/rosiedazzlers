name: Build 297 Bootstrap Route Parity

on:
  push:
    branches:
      - build-297-operations-customer-maintainability-extraction
    paths:
      - .github/workflows/build297-bootstrap-route-parity.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-297-operations-customer-maintainability-extraction
          fetch-depth: 0
      - name: Synchronize exact customer route copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('admin-customers.html')
          target = Path('admin-customers/index.html')
          text = source.read_text(encoding='utf-8')
          tag = '<script src="/assets/admin-customers-v297.js"></script>'
          if text.count(tag) != 1:
              raise SystemExit('Root admin-customers page does not contain exactly one Build 297 runtime tag')
          target.write_text(text, encoding='utf-8')
          if source.read_bytes() != target.read_bytes():
              raise SystemExit('Customer route copy failed exact parity')
          PY
          git diff --check
      - name: Commit synchronized route copy
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-customers/index.html
          git commit -m 'Build 297 synchronize Operations customer route copy'
          git push origin HEAD:build-297-operations-customer-maintainability-extraction
