name: Build 403 — Customer Retention, Rebooking, Service Guidance & SEO Growth

on:
  push:
    branches:
      - build403-customer-retention-rebooking-service-guidance-seo-growth
      - dev
      - main
    paths:
      - 'functions/api/client/retention.js'
      - 'functions/api/client/_lib/customer-retention.js'
      - 'assets/my-account-v382.js'
      - 'assets/landing-page.js'
      - 'assets/build403-service-depth.js'
      - 'water-extraction/**'
      - 'sitemap.xml'
      - 'BUILD403_CUSTOMER_RETENTION_REBOOKING_SERVICE_GUIDANCE_SEO_GROWTH.md'
      - 'AUTONOMOUS_RELEASE_QUEUE.md'
      - 'AI_PROJECT_HANDOFF.md'
      - 'README.md'
      - 'FORWARD_BUILD_ROADMAP_396_405.md'
      - 'scripts/build403_customer_retention_rebooking_service_guidance_seo_growth_check.py'
      - 'scripts/build402_admin_operations_cockpit_growth_experiment_check.py'
      - '.github/workflows/customer-retention-rebooking-service-guidance-seo-growth-authority.yml'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'functions/api/client/retention.js'
      - 'functions/api/client/_lib/customer-retention.js'
      - 'assets/my-account-v382.js'
      - 'assets/landing-page.js'
      - 'assets/build403-service-depth.js'
      - 'water-extraction/**'
      - 'sitemap.xml'
      - 'BUILD403_CUSTOMER_RETENTION_REBOOKING_SERVICE_GUIDANCE_SEO_GROWTH.md'
      - 'AUTONOMOUS_RELEASE_QUEUE.md'
      - 'AI_PROJECT_HANDOFF.md'
      - 'README.md'
      - 'FORWARD_BUILD_ROADMAP_396_405.md'
      - 'scripts/build403_customer_retention_rebooking_service_guidance_seo_growth_check.py'
      - 'scripts/build402_admin_operations_cockpit_growth_experiment_check.py'
      - '.github/workflows/customer-retention-rebooking-service-guidance-seo-growth-authority.yml'

permissions:
  contents: read

jobs:
  build403-authority:
    name: build403 authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check functions/api/client/retention.js
          node --check functions/api/client/_lib/customer-retention.js
          node --check assets/my-account-v382.js
          node --check assets/build403-service-depth.js
          node --check assets/landing-page.js
      - name: Build 403 fail-closed authority
        run: |
          python -m py_compile scripts/build403_customer_retention_rebooking_service_guidance_seo_growth_check.py
          python scripts/build403_customer_retention_rebooking_service_guidance_seo_growth_check.py
      - name: Retained Build 402 authority
        run: python scripts/build402_admin_operations_cockpit_growth_experiment_check.py
      - name: Retained Build 396 roadmap authority
        run: python scripts/build396_growth_baseline_forward_roadmap_check.py
      - name: Release authority convergence
        run: python scripts/release_authority_documentation_convergence_check.py

  production-exact-sha:
    name: Verify exact Production deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build403-authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}
      CF_PROJECT_NAME: rosiedazzlers
      CF_PRODUCTION_BRANCH: main
      CF_PRODUCTION_URL: https://rosiedazzlers.ca
    steps:
      - name: Checkout exact Production source
        uses: actions/checkout@v4
      - name: Verify exact Cloudflare Production deployment and runtime
        run: bash scripts/cloudflare_pages_production_acceptance.sh
