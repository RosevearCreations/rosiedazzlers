name: Cloudflare Development Acceptance

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-cloudflare-development
  cancel-in-progress: true

env:
  CF_PROJECT_NAME: rosiedazzlers
  CF_DEV_BRANCH: dev
  CF_DEV_URL: https://dev.rosiedazzlers.pages.dev

jobs:
  verify-development:
    name: Verify Development deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact dev commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cumulative source authority
        run: python scripts/release_check.py

      - name: Validate public SEO metadata
        run: python scripts/seo_metadata_check.py

      - name: Validate release hygiene
        run: python scripts/release_hygiene_check.py

      - name: Validate responsive source contract
        run: python scripts/responsive_static_check.py

      - name: Validate protected Admin UI contracts
        run: python scripts/admin_ui_audit.py

      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check

      - name: Check canonical Cloudflare and HTTP helper syntax
        run: |
          bash -n scripts/cloudflare_pages_development.sh
          bash -n scripts/development_http_smoke.sh
          bash -n scripts/admin_protected_http_smoke.sh
          bash -n scripts/contextual_proof_http_smoke.sh

      - name: Confirm exact dev SHA reached successful Cloudflare Pages deployment
        shell: bash
        run: bash scripts/cloudflare_pages_development.sh accept

      - name: Smoke every current protected Admin route and shared shell asset
        shell: bash
        run: bash scripts/admin_protected_http_smoke.sh "$CF_DEV_URL" "Development protected Admin"

      - name: Record acceptance boundary
        shell: bash
        run: |
          {
            echo "### Development acceptance boundary"
            echo "- Exact GitHub SHA: \`${GITHUB_SHA}\`"
            echo "- Current cumulative source, SEO, hygiene, responsive, protected-Admin and route-copy authorities: PASS"
            echo "- Canonical Cloudflare helper verifies the active token/project, exact dev SHA, successful Functions deployment, immutable smoke and dev-alias convergence."
            echo "- Every current AdminShell protected route and shared Admin shell/CSS asset passed Development HTTP smoke."
            echo "- Contextual public proof is verified by the durable HTTP smoke helper."
            echo "- Normal acceptance performs no deployment deletion or recreation."
            echo "- Recovery mutation remains isolated to the manual recovery workflow and requires exact-SHA confirmation."
            echo "- Production promotion, payment/provider transactions, database mutation and business-data mutation remain outside this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
