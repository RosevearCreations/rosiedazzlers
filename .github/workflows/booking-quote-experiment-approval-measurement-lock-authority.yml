name: Build 481 — Booking & Quote Experiment Approval & Measurement Lock Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-booking-quote-experiment-approval-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: booking-quote-experiment-approval-measurement-lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/booking_quote_experiment_approval_measurement_lock_check.py
          node --check functions/api/_lib/booking-funnel-quote-pricing-learning.js
          node --check functions/api/admin/booking_funnel_quote_pricing_learning.js
          node --check functions/api/admin/booking_quote_experiment_approval_lock_save.js
          node --check assets/build451-booking-funnel-quote-pricing-learning.js
          node --check scripts/booking_quote_experiment_approval_measurement_lock_test.mjs
      - name: Validate Build 481 authority
        run: |
          python scripts/booking_quote_experiment_approval_measurement_lock_check.py
          node scripts/booking_quote_experiment_approval_measurement_lock_test.mjs
      - name: Authority summary
        run: |
          {
            echo '### Build 481 — Booking & Quote Experiment Approval & Measurement Lock'
            echo "- SHA: `${GITHUB_SHA}`"
            echo '- Explicit owner approval + threshold/duration/allocation/stop-condition lock: PASS'
            echo '- Existing app settings store reused; schema migration: NONE'
            echo '- Southern Ontario weather-ineligible denominator handling: EXPLICIT'
            echo '- Exact service temperature inference: NONE'
            echo '- Experiment execution / price / discount / booking-rule / availability / outreach mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
