name: Build 380 — Booking Recovery & Failure Handling

on:
  push:
    branches:
      - dev
      - main
      - 'build380-*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build380-booking-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-authority:
    name: Validate Build 380 booking recovery source authority
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded booking recovery contract
        run: python3 scripts/booking_recovery_failure_handling_check.py
      - name: Syntax-check recovery JavaScript
        run: |
          node --check functions/api/checkout_recovery.js
          node --check assets/booking-recovery.js
          node --check assets/site-policies.js

  production-exact-sha:
    name: Verify exact Production deployment
    needs: source-authority
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}
      CF_PROJECT_NAME: rosiedazzlers
      CF_PRODUCTION_BRANCH: main
      CF_PRODUCTION_URL: https://rosiedazzlers.ca
    steps:
      - name: Check out exact Production SHA
        uses: actions/checkout@v4
      - name: Prove exact Cloudflare Production deployment and runtime
        run: bash scripts/cloudflare_pages_production_acceptance.sh
