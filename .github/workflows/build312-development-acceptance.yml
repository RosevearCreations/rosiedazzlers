name: Build 312 Development Runtime Acceptance

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate exact Build 312 source contract
        run: python scripts/build312_release_check.py
      - name: Validate Development inventory integrity read-only
        run: bash scripts/build312_http_smoke.sh https://dev.rosiedazzlers.pages.dev
