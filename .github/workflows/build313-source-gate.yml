name: Build 313 Source Gate

on:
  push:
    branches: [build313-catalog-product-administration-extraction]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build313-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Build 313 syntax
        run: |
          node --check assets/admin-app-v313.js
          bash -n scripts/build313_http_smoke.sh
          python -m py_compile scripts/build313_release_check.py
      - name: Retain Build 312 integrity authority
        run: |
          node scripts/build312_inventory_integrity_test.mjs
          python scripts/build312_release_check.py
      - name: Validate Build 313 Product Catalog extraction
        run: python scripts/build313_release_check.py
      - name: Run cumulative source authorities
        run: |
          python scripts/release_check.py
          python scripts/seo_h1_check.py
          python scripts/sync_route_copies.py --check
      - name: Source hygiene
        run: |
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi
