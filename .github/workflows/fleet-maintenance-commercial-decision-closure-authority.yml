name: Fleet & Maintenance Commercial Decision Closure Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-fleet-maintenance-decision-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: fleet-maintenance-commercial-decision-closure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/fleet_maintenance_commercial_decision_closure_check.py
          node --check functions/api/_lib/maintenance-fleet-owner-approval.js
          node --check functions/api/admin/maintenance_fleet_owner_approval.js
          node --check assets/build439-maintenance-fleet-owner-approval.js
          node --check scripts/fleet_maintenance_commercial_decision_closure_test.mjs
      - name: Validate commercial decision closure
        run: python scripts/fleet_maintenance_commercial_decision_closure_check.py
      - name: Authority summary
        run: |
          {
            echo '### Fleet & Maintenance Commercial Decision Closure'
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo '- Existing owner-decision convergence authority reused: PASS'
            echo '- Canonical decision paths and required closure fields: PASS'
            echo '- Current unresolved terms remain owner_action: PASS'
            echo '- Approved-source state stops at owner_review_candidate: PASS'
            echo '- Live capacity remains separate from commercial policy: PASS'
            echo '- Automatic approval/discount/booking/invoice/billing/provider mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
