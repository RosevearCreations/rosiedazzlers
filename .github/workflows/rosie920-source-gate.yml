name: Rosie 920 Independent Ledger and Two-Owner Host Review Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger-host-920:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify independent original-source readback and supervised host ceremony
        run: |
          node --check assets/build920-field-ceremony-contract.mjs
          node --check functions/api/admin/sysop_920.js
          node --check assets/build920-field-admin.mjs
          node tests/build920_ledger_two_owner.test.mjs
          node tests/build919_original_receiver_host.test.mjs
          node tests/build918_mesh_contract.test.mjs
          node tests/build918_private_api_gate.test.mjs
          node tests/build918_production_watch.test.mjs
