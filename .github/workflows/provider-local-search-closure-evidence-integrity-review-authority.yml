name: Provider & Local Search Closure Evidence Integrity Review Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-provider-local-search-closure-integrity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: provider-local-search-closure-evidence-integrity-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Provider & Local Search Closure Evidence Integrity Review
        run: |
          python scripts/provider_local_search_closure_evidence_integrity_review_check.py
          node scripts/provider_local_search_closure_evidence_integrity_review_test.mjs
      - name: Build 539 summary
        run: |
          {
            echo '### Provider & Local Search Closure Evidence Integrity Review'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Retained Build 529 freshness authority: REVALIDATED'
            echo '- Provider/payment/refund/message source trace: EXACT OR REVIEW'
            echo '- Search Console / GBP property-location-window trace: EXACT OR REVIEW'
            echo '- Explicit manual operator review: CURRENT + TRACE-MATCHED OR REVIEW'
            echo '- Ranking / demand / conversion causation inference: NONE'
            echo '- Supabase/schema/storage/persistent telemetry growth: NONE'
            echo '- Provider/payment/refund/message/Search Console/GBP/HOLD mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
