name: Build 302 Development Runtime Acceptance

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Build 302 source boundary
        run: python scripts/build302_release_check.py
      - name: Re-run retained read-only Accounting acceptance
        run: bash scripts/build301_http_smoke.sh https://dev.rosiedazzlers.pages.dev
