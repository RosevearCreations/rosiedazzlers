name: Build 504 — Service Economics, Seasonal Capacity & Reliability Trend Continuity Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    name: service-economics-seasonal-capacity-reliability-trend-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/service_economics_seasonal_capacity_reliability_trend_continuity_check.py
          node --check functions/api/_lib/service-economics-seasonal-capacity-reliability-trend-continuity.js
          node --check functions/api/admin/service_economics_seasonal_capacity_reliability_trend_continuity.js
          node --check assets/build504-service-economics-seasonal-capacity-reliability-trend-continuity.js
          node --check scripts/service_economics_seasonal_capacity_reliability_trend_continuity_test.mjs
      - name: Validate bounded same-domain continuity authority
        run: |
          python scripts/service_economics_seasonal_capacity_reliability_trend_continuity_check.py
          node scripts/service_economics_seasonal_capacity_reliability_trend_continuity_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 504 — Service Economics, Seasonal Capacity & Reliability Trend Continuity" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Allocation, seasonal operability, observed capacity and technical reliability remain separate evidence classes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Missing comparable history stays insufficient; no threshold, winter availability, future capacity, provider cost or recovery success is inferred" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic price, booking, capacity, provider, restore, accounting, inventory, schema and polling mutation: NONE" >> "$GITHUB_STEP_SUMMARY"
