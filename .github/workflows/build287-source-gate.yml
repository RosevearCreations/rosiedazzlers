name: Build 287 Source Gate

on:
  push:
    branches:
      - build287-customer-review-share-loop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build287-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Build 287 source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Build 287 review/share syntax
        run: |
          node --check functions/api/client/reviews_save.js
          node --check assets/customer-review-share-v287.js
          node --check assets/customer-share-entry-v287.js
          node --check assets/client-auth.js
          node --check assets/pricing-catalog-client.js
          bash -n scripts/build287_http_smoke.sh

      - name: Run retained Builds 271–286 focused guards
        run: |
          for build in $(seq 271 286); do
            python "scripts/build${build}_release_check.py"
          done

      - name: Run Build 287 focused guard
        run: python scripts/build287_release_check.py

      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py

      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py

      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check

      - name: Check source whitespace/conflict markers
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Source gate summary
        run: |
          {
            echo "### Build 287 Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Server-owned Google review destination: PASS"
            echo "- Neutral completed-service review/share helper: PASS"
            echo "- Same-origin customer_share/customer_referral UTM link: PASS"
            echo "- Analytics-only booking entry adapter: PASS"
            echo "- Retained booking/pricing/availability/deposit/payment authority: PASS"
            echo "- Retained Builds 271–286 + Build 287 + cumulative release chain: PASS"
            echo "- No schema migration or referral/loyalty economics introduced."
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
