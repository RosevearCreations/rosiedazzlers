name: Winter Booking & Quote Rule Controlled Activation Decision Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-winter-rule-controlled-activation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: winter-booking-quote-rule-controlled-activation-decision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Winter Booking & Quote Rule Controlled Activation Decision
        run: |
          python scripts/winter_booking_quote_rule_controlled_activation_decision_check.py
          node scripts/winter_booking_quote_rule_controlled_activation_decision_test.mjs
      - name: Build 507 summary
        run: |
          {
            echo '### Winter Booking & Quote Rule Controlled Activation Decision'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Service-specific controlled activation decision package: PASS'
            echo '- Customer transparency confirmation: REQUIRED'
            echo '- Availability / checkout collision authorities: PRESERVED'
            echo '- Rule activation: MANUAL'
            echo '- Broad winter availability: HOLD'
            echo '- Automatic booking/quote/customer-message mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
