name: Controlled-Environment Weather-Safe Routing Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-controlled-environment-weather-safe-routing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: controlled-environment-weather-safe-routing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/controlled_environment_weather_safe_routing_check.py
          node --check functions/api/_lib/controlled-environment-weather-safe-routing.js
          node --check functions/api/admin/service_economics_commercial_capacity_review.js
          node --check assets/build473-service-economics-allocation-margin-review-readiness.js
          node --check scripts/controlled_environment_weather_safe_routing_test.mjs
      - name: Validate Build 488 source authority
        run: |
          python scripts/controlled_environment_weather_safe_routing_check.py
          node scripts/controlled_environment_weather_safe_routing_test.mjs
      - name: Authority summary
        run: |
          echo "### Controlled-Environment Alternatives & Weather-Safe Routing" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Indoor/controlled alternatives require explicit site/equipment/process evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Temperature-limited outdoor work defaults to safe reschedule review when no evidenced controlled alternative exists" >> "$GITHUB_STEP_SUMMARY"
          echo "- Not every service can move indoors; current weather/site suitability is not inferred" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic routing, rescheduling, booking/public claims, pricing, provider/schema/business mutation or polling: NONE" >> "$GITHUB_STEP_SUMMARY"
