name: Build 482 — Staff & Mobile Remediation Execution Evidence Readiness Authority
on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-staff-mobile-remediation-execution-evidence-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: staff-mobile-remediation-execution-evidence-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/staff_mobile_remediation_execution_evidence_readiness_check.py
          node --check functions/api/_lib/staff-support-mobile-efficiency-learning.js
          node --check functions/api/admin/staff_support_mobile_efficiency_learning.js
          node --check assets/build452-staff-support-mobile-efficiency-learning.js
          node --check scripts/staff_mobile_remediation_execution_evidence_readiness_test.mjs
      - name: Validate Build 482 source authority
        run: |
          python scripts/staff_mobile_remediation_execution_evidence_readiness_check.py
          node scripts/staff_mobile_remediation_execution_evidence_readiness_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 482 — Staff & Mobile Remediation Execution Evidence Readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Separately authorized execution record required before outcome attribution: YES" >> "$GITHUB_STEP_SUMMARY"
          echo "- Materially comparable before/after evidence required: YES" >> "$GITHUB_STEP_SUMMARY"
          echo "- Current patterns prove root cause, staff fault, device friction or effectiveness: NO" >> "$GITHUB_STEP_SUMMARY"
          echo "- Weather/site constraints kept separate from staff/mobile friction: YES" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service temperature inference / automatic remediation / telemetry / mutation: NONE" >> "$GITHUB_STEP_SUMMARY"
