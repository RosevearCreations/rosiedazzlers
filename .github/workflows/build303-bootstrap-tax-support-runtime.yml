name: Build 303 Bootstrap Tax Support Runtime

on:
  push:
    branches:
      - feature/build-303-tax-support-extraction
    paths:
      - .github/workflows/build303-bootstrap-tax-support-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Extract accepted inline runtime exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('admin-tax-support.html')
          asset = Path('assets/admin-tax-support-v303.js')
          text = page.read_text(encoding='utf-8')
          marker = '<script>\n(function(){'
          start = text.rfind(marker)
          if start < 0:
              raise SystemExit('inline tax-support runtime not found')
          body_start = start + len('<script>\n')
          end = text.find('</script>', body_start)
          if end < 0:
              raise SystemExit('inline tax-support runtime close not found')
          runtime = text[body_start:end]
          asset.write_text(runtime, encoding='utf-8')
          tag = '<script src="/assets/admin-tax-support-v303.js"></script>'
          page.write_text(text[:start] + tag + text[end + len('</script>'):], encoding='utf-8')
          PY
          node --check assets/admin-tax-support-v303.js
          python scripts/build302_release_check.py
          python scripts/build303_release_check.py
      - name: Commit exact extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-tax-support.html assets/admin-tax-support-v303.js
          git diff --cached --check
          git commit -m "Build 303: externalize accepted tax-support runtime"
          git push origin HEAD:${{ github.ref_name }}
