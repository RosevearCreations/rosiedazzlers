name: Build 385 — Backup, Restore & Release Recovery Drill

on:
  push:
    branches:
      - 'build-385-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build385-backup-restore-release-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-authority:
    name: Validate retained Build 385 backup restore release recovery drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retained Build 385 recovery authority
        run: python3 scripts/backup_restore_release_recovery_drill_check.py
      - name: Validate retained rollback and recovery authority
        run: python3 scripts/release_rollback_recovery_check.py
      - name: Syntax-check retained recovery helpers
        run: |
          bash -n scripts/cloudflare_development_rollback.sh
          bash -n scripts/cloudflare_pages_development.sh
          bash -n scripts/cloudflare_pages_production_acceptance.sh
      - name: Record observation-only retained drill boundary
        run: |
          {
            echo "### Retained Build 385 recovery drill boundary"
            echo "- Exact candidate SHA: \`${GITHUB_SHA}\`"
            echo "- Recovery evidence authority: retained"
            echo "- Database migration: none"
            echo "- Production/business-data/provider mutation: none"
            echo "- Real rollback/restore remains explicitly operator-authorized outside this drill."
            echo "- Current release acceptance is owned by the living release authority, not this historical workflow."
          } >> "$GITHUB_STEP_SUMMARY"