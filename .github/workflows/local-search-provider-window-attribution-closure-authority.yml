name: Build 470 — Local Search Provider Window & Attribution Closure Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-local-search-provider-window-attribution-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: local-search-provider-window-attribution-closure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/local_search_provider_window_attribution_closure_check.py
          node --check functions/api/_lib/local-search-measurement-conversion-attribution.js
          node --check functions/api/admin/local_search_measurement_conversion_attribution.js
          node --check assets/build450-local-search-measurement-conversion-attribution.js
          node --check scripts/local_search_provider_window_attribution_closure_test.mjs
      - name: Validate provider window attribution closure
        run: python scripts/local_search_provider_window_attribution_closure_check.py
      - name: Authority summary
        run: |
          {
            echo '### Build 470 — Local Search Provider Window & Attribution Closure'
            echo "- SHA: `${GITHUB_SHA}`"
            echo '- Existing Build 440/450/460 workbench reused: PASS'
            echo '- Provider property/location + dated measurement window identity: EXPLICIT'
            echo '- Provider ↔ first-party dated-window overlap: EXPLICIT'
            echo '- Bounded anonymous same-session evidence completeness: EXPLICIT'
            echo '- Provider metric → session/customer/booking identity join: NONE'
            echo '- Ranking/Maps/provider-performance or causal-conversion claim: NONE'
            echo '- Provider/analytics/schema/publishing/outreach/DNS/ad-spend/customer/storage mutation or polling: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
