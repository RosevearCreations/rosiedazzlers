name: Booking & Quote Follow-Up Evidence Freshness Review Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-booking-quote-follow-up-freshness-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: booking-quote-follow-up-evidence-freshness-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Build 532 freshness authority
        run: |
          python scripts/booking_quote_follow_up_evidence_freshness_review_check.py
          node scripts/booking_quote_follow_up_evidence_freshness_review_test.mjs
      - name: Build 532 summary
        run: |
          {
            echo '### Booking & Quote Follow-Up Evidence Freshness Review'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Measurement lock / metric / allocation / duration: CURRENT MATCH REQUIRED'
            echo '- Southern Ontario weather eligibility/exclusion: EXPLICIT EVIDENCE REQUIRED'
            echo '- Continue observation: CURRENT AUTHORIZATION + LATER CURRENT OBSERVATION REQUIRED'
            echo '- Triggered stop condition: REVIEW REQUIRED'
            echo '- Winner / success / pricing / booking-rule mutation: NONE'
            echo '- Outreach / availability / booking mutation: NONE'
            echo '- Automatic canonical HOLD narrowing: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
