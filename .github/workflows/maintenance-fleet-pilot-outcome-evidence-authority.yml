name: Build 491 — Maintenance & Fleet Pilot Outcome Evidence Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-maintenance-fleet-pilot-outcome-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: maintenance-fleet-pilot-outcome-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/maintenance_fleet_pilot_outcome_evidence_check.py
          node --check functions/api/_lib/maintenance-fleet-pilot-outcome-evidence.js
          node --check functions/api/admin/maintenance_fleet_pilot_outcome_evidence.js
          node --check scripts/maintenance_fleet_pilot_outcome_evidence_test.mjs
      - name: Validate Build 491 source authority
        run: |
          python scripts/maintenance_fleet_pilot_outcome_evidence_check.py
          node scripts/maintenance_fleet_pilot_outcome_evidence_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 491 — Maintenance & Fleet Pilot Outcome Evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Owner approval + bounded pilot authorization remain prerequisites" >> "$GITHUB_STEP_SUMMARY"
          echo "- Participant, duration, capacity, invoicing, travel and stop-condition outcomes require observed execution evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Missing execution evidence remains owner action" >> "$GITHUB_STEP_SUMMARY"
          echo "- Customer activation, booking, capacity reservation, automatic invoicing, provider/business mutation and polling: NONE" >> "$GITHUB_STEP_SUMMARY"
