name: Build 314 Source Gate

on:
  push:
    branches: [build314-media-photo-studio-reliability]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build314-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Build 314 syntax
        run: |
          node --check functions/api/admin/photo_library_sync.js
          node --check functions/api/admin/photo_library_list.js
          node --check functions/api/admin/photo_assignment_save.js
          node --check functions/api/admin/photo_library_delete.js
          node --check functions/api/_lib/photo-library.js
          python -m py_compile scripts/build314_release_check.py
      - name: Validate Build 314 Media and Photo Studio reliability
        run: python scripts/build314_release_check.py
      - name: Retain Build 313 authority
        run: python scripts/build313_release_check.py
      - name: Run cumulative source authorities
        run: |
          python scripts/release_check.py
          python scripts/seo_h1_check.py
          python scripts/sync_route_copies.py --check
      - name: Source hygiene
        run: |
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi
