name: Backup, Restore & Accountant Export Operational Proof

on:
  push:
    branches:
      - dev
      - main
      - 'build418-*'
    # Build 779: optional domain authority; protected source gates remain unconditional.
    paths:
      - '**/*recovery*'
      - '**/*backup*'
      - '**/*restore*'
      - '**/*export*'
      - '.github/workflows/recovery-export-operational-proof-authority.yml'
      - 'functions/api/_lib/staff-auth.js'
      - 'functions/_middleware.js'
      - 'scripts/release_check.py'
      - 'scripts/ci-source-cache/**'
      - 'assets/styles.css'

  pull_request:
    branches:
      - dev
      - main
    # Build 779: optional domain authority; protected source gates remain unconditional.
    paths:
      - '**/*recovery*'
      - '**/*backup*'
      - '**/*restore*'
      - '**/*export*'
      - '.github/workflows/recovery-export-operational-proof-authority.yml'
      - 'functions/api/_lib/staff-auth.js'
      - 'functions/_middleware.js'
      - 'scripts/release_check.py'
      - 'scripts/ci-source-cache/**'
      - 'assets/styles.css'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-recovery-export-operational-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: recovery-export-operational-proof
    runs-on: ubuntu-latest
    # Build 779: exact-commit CI-only success memoization of repeated nested source tests.
    # Distinct tests and all failures still execute; no result is trusted across SHAs.
    env:
      ROSIE_CI_DEDUP_SUBCHECKS: "1"
      PYTHONPATH: ${{ github.workspace }}/scripts/ci-source-cache
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate recovery export operational proof authority
        run: |
          python scripts/recovery_export_operational_proof_check.py
          node scripts/recovery_export_operational_proof_test.mjs
      - name: Validate retained recovery and Finance authorities
        run: |
          python scripts/backup_restore_release_recovery_drill_check.py
          python scripts/build394_finance_close_reconciliation_accountant_export_check.py
          node scripts/build394_finance_close_reconciliation_accountant_export_test.mjs
      - name: Acceptance summary
        run: |
          {
            echo '### Backup / restore / accountant-export operational proof'
            echo "- SHA: `${GITHUB_SHA}`"
            echo '- Current backup artifact remains owner-observed evidence: PASS'
            echo '- Retention location is never inferred: PASS'
            echo '- Accountant-export usability remains canonical Finance evidence: PASS'
            echo '- Recovery drill/restore remains separately authorized: PASS'
            echo '- Database migration: NONE'
            echo '- Restore/export generation/business/provider mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
