name: Rosie 919 Receiver ACK and Original Host Evidence Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-witness-919:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify original receiver cryptography and private host evidence
        run: |
          node --check assets/build919-ack-recovery-contract.mjs
          node --check functions/api/admin/sysop_919.js
          node --check assets/build919-receiver-admin.mjs
          node tests/build919_original_receiver_host.test.mjs
          node tests/build918_mesh_contract.test.mjs
          node tests/build918_private_api_gate.test.mjs
          node tests/build918_production_watch.test.mjs
