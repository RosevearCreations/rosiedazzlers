name: Rosie 881 Protected Drift and External Anchor Source Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build881-native-alert-anchor-grace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scheduled owner issues, source-only drift and distinct Ed25519 external anchor regressions
        run: |
          node scripts/build883_execution_receipt_renewal_recovery_test.mjs
          node scripts/build882_enrollment_anchor_ack_test.mjs
          node scripts/build881_scheduled_anchor_grace_test.mjs
          node scripts/build880_native_history_immutable_rotation_test.mjs
          node scripts/build879_native_stability_rotation_test.mjs
          node scripts/build878_native_ack_pinned_test.mjs
          node scripts/build877_provider_sla_provenance_test.mjs
          node scripts/build876_native_escalation_artifact_test.mjs
