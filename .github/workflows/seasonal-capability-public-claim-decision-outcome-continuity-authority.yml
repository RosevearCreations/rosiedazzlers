name: Seasonal Capability & Public Claim Decision Outcome Continuity Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-seasonal-public-claim-outcome-continuity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: seasonal-capability-public-claim-decision-outcome-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Seasonal Capability & Public Claim Decision Outcome Continuity
        run: |
          python scripts/seasonal_capability_public_claim_decision_outcome_continuity_check.py
          node scripts/seasonal_capability_public_claim_decision_outcome_continuity_test.mjs
      - name: Build 516 summary
        run: |
          {
            echo '### Seasonal Capability & Public Claim Decision Outcome Continuity'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Publication state: OBSERVED, NEVER INFERRED'
            echo '- Retain-HOLD / no-action outcomes: EXPLICIT + ATTRIBUTABLE'
            echo '- Source-owned temperature limits: PRESERVED'
            echo '- Broad winter availability: HOLD'
            echo '- Automatic booking/quote/publication/HOLD mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
