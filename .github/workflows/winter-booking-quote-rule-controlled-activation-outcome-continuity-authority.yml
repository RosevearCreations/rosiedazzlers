name: Winter Booking & Quote Rule Controlled-Activation Outcome Continuity Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-winter-booking-quote-outcome-continuity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: winter-booking-quote-rule-controlled-activation-outcome-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Winter Booking & Quote Rule Controlled-Activation Outcome Continuity
        run: |
          python scripts/winter_booking_quote_rule_controlled_activation_outcome_continuity_check.py
          node scripts/winter_booking_quote_rule_controlled_activation_outcome_continuity_test.mjs
      - name: Build 517 summary
        run: |
          {
            echo '### Winter Booking & Quote Rule Controlled-Activation Outcome Continuity'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Activation state: OBSERVED, NEVER INFERRED'
            echo '- Retain-HOLD outcomes: EXPLICIT + ATTRIBUTABLE'
            echo '- /api/availability + checkout collision revalidation: REQUIRED'
            echo '- Weather-ineligible conversion interpretation: EXCLUDED'
            echo '- Broad winter availability: HOLD'
            echo '- Automatic booking/quote/rule/HOLD mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
