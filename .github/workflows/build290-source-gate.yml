name: Build 290 Source Gate

on:
  push:
    branches:
      - build290-authz-rollback-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build290-source
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Build 290 source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Build 290 syntax
        run: |
          node --check functions/api/_lib/staff-auth.js
          node --check functions/api/_lib/action-permissions.js
          node --check functions/api/admin/_middleware.js
          node --check assets/admin-auth.js
          node --check assets/admin-shell.js
          node --check scripts/build290_action_permission_test.mjs
          bash -n scripts/build290_http_smoke.sh

      - name: Run retained Builds 271-289 focused guards
        run: for build in $(seq 271 289); do python "scripts/build${build}_release_check.py"; done

      - name: Run Build 290 role/action matrix
        run: node scripts/build290_action_permission_test.mjs

      - name: Prove Build 289 forward-restore anchor
        run: python scripts/build290_rollback_check.py

      - name: Run Build 290 focused guard
        run: python scripts/build290_release_check.py

      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py

      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py

      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check

      - name: Check source hygiene
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Summary
        run: |
          {
            echo "### Build 290 Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Retained Builds 271-289: PASS"
            echo "- Role/module/action matrix: PASS"
            echo "- Build 289 forward-restore anchor: PASS"
            echo "- Generic staff-auth 500 non-disclosure: PASS"
            echo "- Cumulative release / one-H1 / route parity / hygiene: PASS"
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
