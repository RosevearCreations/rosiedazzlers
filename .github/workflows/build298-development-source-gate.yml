name: Build 298 Development Source Gate

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build298-development-source
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Development through Build 298
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Build 298 syntax
        run: |
          python -m py_compile scripts/build297_release_check.py scripts/build298_release_check.py
          bash -n scripts/build297_http_smoke.sh scripts/build298_http_smoke.sh
          node --check assets/admin-customers-v297.js
          node --check assets/admin-quotes-v298.js
      - name: Run retained focused guards through Build 298
        run: |
          for build in $(seq 271 298); do
            echo "== Build ${build} focused guard =="
            python "scripts/build${build}_release_check.py"
          done
      - name: Run retained authorization matrix and forward-restore proof
        run: |
          node scripts/build290_action_permission_test.mjs
          python scripts/build290_rollback_check.py
      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py
      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py
      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check
      - name: Check source hygiene outside later exact extracted runtimes
        run: |
          git diff --check HEAD^ -- . ':!*.md' ':!assets/admin-booking-v299.js'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi
      - name: Development source summary
        run: |
          {
            echo "### Build 298 Development Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Retained focused guards 271–297: PASS"
            echo "- Build 298 exact quote-pipeline extraction guard: PASS"
            echo "- Versioned quote JavaScript syntax: PASS"
            echo "- Authorization, cumulative release, one-H1 and route-copy parity guards: PASS"
            echo "- Later byte-for-byte extracted runtimes are excluded only from generic whitespace inspection"
            echo "- Production remains Build 296 and closed for Build 298"
          } >> "$GITHUB_STEP_SUMMARY"
