name: Build 308 Development Source Gate

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check canonical Cloudflare helper syntax
        run: |
          bash -n scripts/cloudflare_pages_development.sh
          bash -n scripts/build308_http_smoke.sh
      - name: Retain Build 276 release-race authority
        run: python scripts/build276_release_check.py
      - name: Retain Build 281 exact-deployment authority
        run: python scripts/build281_release_check.py
      - name: Retain Build 307 readiness authority
        run: python scripts/build307_release_check.py
      - name: Validate Build 308 deployment/recovery consolidation
        run: python scripts/build308_release_check.py
      - name: Run cumulative source authorities
        run: |
          python scripts/release_check.py
          python scripts/seo_h1_check.py
          python scripts/sync_route_copies.py --check
