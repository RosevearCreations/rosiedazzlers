name: Rosie Dazzlers Build 874 Native PayPal & Export Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build874-original-provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native dry run, exact PayPal refund ledger and owner export
        run: node scripts/build874_native_paypal_export_test.mjs
