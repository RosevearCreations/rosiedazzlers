name: Build 381 — Operations Daily Command Centre

on:
  push:
    branches:
      - dev
      - main
      - 'build381-*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build381-operations-command-centre-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-authority:
    name: Validate Build 381 Operations command-centre authority
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded Operations authority
        run: python3 scripts/operations_daily_command_centre_check.py
      - name: Syntax-check Operations JavaScript
        run: node --check assets/admin-operations.js

  production-exact-sha:
    name: Verify exact Production deployment
    needs: source-authority
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}
      CF_PROJECT_NAME: rosiedazzlers
      CF_PRODUCTION_BRANCH: main
      CF_PRODUCTION_URL: https://rosiedazzlers.ca
    steps:
      - name: Check out exact Production SHA
        uses: actions/checkout@v4
      - name: Prove exact Cloudflare Production deployment and runtime
        run: bash scripts/cloudflare_pages_production_acceptance.sh
