name: Build 288 Source Gate
on:
  push:
    branches: [build288-auth-device-acceptance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-build288-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-gate:
    name: Validate Build 288 source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Check Build 288 syntax
        run: |
          node --check functions/api/client/_lib/customer-safe-shape.js
          node --check functions/api/client/profile_update.js
          node --check functions/api/client/vehicles_save.js
          node --check functions/api/client/vehicles_list.js
          node --check functions/api/client/dashboard.js
          node --check functions/api/client/reviews_save.js
          node --check assets/client-auth.js
          node --check assets/customer-privacy-v288.js
          bash -n scripts/build288_http_smoke.sh
      - name: Run retained Builds 271-287 focused guards
        run: |
          for build in $(seq 271 287); do python "scripts/build${build}_release_check.py"; done
      - name: Run Build 288 focused guard
        run: python scripts/build288_release_check.py
      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py
      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py
      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check
      - name: Check source hygiene
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then exit 2; fi
      - name: Summary
        run: |
          {
            echo "### Build 288 Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Customer/staff private-field boundary: PASS"
            echo "- Profile/vehicle/review customer-safe projections: PASS"
            echo "- My Account staff-private UI suppression: PASS"
            echo "- Retained Builds 271-287 + Build 288 + cumulative guards: PASS"
            echo "- No schema/pricing/booking/deposit/payment change."
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
