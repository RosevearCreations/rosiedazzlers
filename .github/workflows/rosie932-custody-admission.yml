name: Rosie 932 Original Custody Admission and Readback Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-932:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check functions/api/admin/sysop_930.js
          node tests/build932_custody_admission.test.mjs
          node tests/build931_original_enrollment.test.mjs
          node tests/build930_signed_guest_custody.test.mjs
