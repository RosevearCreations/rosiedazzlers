name: Staff Mobile Remediation Verification Authority
on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-staff-mobile-remediation-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: staff-mobile-remediation-verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/staff_mobile_remediation_verification_check.py
          node --check functions/api/_lib/staff-support-mobile-efficiency-learning.js
          node --check functions/api/admin/staff_support_mobile_efficiency_learning.js
          node --check assets/build452-staff-support-mobile-efficiency-learning.js
          node --check scripts/staff_mobile_remediation_verification_test.mjs
      - name: Validate Build 472 source authority
        run: |
          python scripts/staff_mobile_remediation_verification_check.py
          node scripts/staff_mobile_remediation_verification_test.mjs
      - name: Authority summary
        run: |
          echo "### Staff & Mobile Remediation Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: `$GITHUB_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Current pattern evidence: bounded and attributable only to retained sources" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remediation outcome without recorded execution + comparable evidence: UNVERIFIED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Root cause / staff fault / device friction / business impact inference: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic remediation, closure, role widening, mutation or polling: NONE" >> "$GITHUB_STEP_SUMMARY"
