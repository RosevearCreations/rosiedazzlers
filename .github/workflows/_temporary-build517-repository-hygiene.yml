name: Temporary Build 517 Repository Hygiene

on:
  push:
    branches:
      - build517-winter-booking-quote-rule-outcome-continuity
    paths:
      - '.github/workflows/_temporary-build517-repository-hygiene.yml'

permissions:
  contents: read

jobs:
  retained-pointer-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Report retained current-release hardcodes
        shell: bash
        run: |
          set -euo pipefail
          echo "=== BUILD516_ACTIVE_POINTERS ==="
          grep -RIlF '**Build 516 — Seasonal Capability & Public Claim Decision Outcome Continuity** is the active bounded release.' . --exclude-dir=.git || true
          echo "=== BUILD516_README_POINTERS ==="
          grep -RIlF 'Current source direction: **Build 516 — Seasonal Capability & Public Claim Decision Outcome Continuity**.' . --exclude-dir=.git || true
          echo "=== BUILD517_NEXT_POINTERS ==="
          grep -RIlF '**Build 517 — Winter Booking & Quote Rule Controlled-Activation Outcome Continuity** is next' . --exclude-dir=.git || true
          echo "=== BUILD516_CONTRACT_POINTERS_IN_CHECKS ==="
          grep -RIlF 'BUILD516_SEASONAL_CAPABILITY_PUBLIC_CLAIM_DECISION_OUTCOME_CONTINUITY.md' scripts .github/workflows 2>/dev/null || true
