name: Controlled Soft Launch & Real-World Acceptance

on:
  push:
    branches:
      - dev
      - main
      - 'build416-*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-controlled-soft-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: controlled-soft-launch-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate controlled pilot source authority
        run: |
          python scripts/controlled_soft_launch_acceptance_check.py
          node scripts/controlled_soft_launch_acceptance_test.mjs
      - name: Acceptance summary
        run: |
          {
            echo '### Controlled soft launch / real-world acceptance'
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo '- Invite-only / known-customer scope remains explicit: PASS'
            echo '- Aggregate job-handoff evidence only; customer identity excluded: PASS'
            echo '- Missing real-world evidence remains HOLD: PASS'
            echo '- Schema migration: NONE'
            echo '- Automatic booking/outreach/provider/business mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
