name: Build 467 — Recovery Evidence Validation & Drill Decision Readiness Authority
on:
  push:
    branches: [dev, main]
    # Build 778: optional domain authority. Required aggregate source gate is unchanged.
    paths:
      - '**/*recovery*'
      - '**/*backup*'
      - '**/*restore*'
      - '**/*authenticated-device*'
      - '**/*device*'
      - '.github/workflows/recovery-evidence-validation-drill-decision-readiness-authority.yml'
      - 'functions/api/_lib/staff-auth.js'
      - 'functions/_middleware.js'
      - 'scripts/release_check.py'
      - 'scripts/ci-source-cache/**'
      - 'assets/styles.css'

  pull_request:
    branches: [dev, main]
    # Build 778: optional domain authority. Required aggregate source gate is unchanged.
    paths:
      - '**/*recovery*'
      - '**/*backup*'
      - '**/*restore*'
      - '**/*authenticated-device*'
      - '**/*device*'
      - '.github/workflows/recovery-evidence-validation-drill-decision-readiness-authority.yml'
      - 'functions/api/_lib/staff-auth.js'
      - 'functions/_middleware.js'
      - 'scripts/release_check.py'
      - 'scripts/ci-source-cache/**'
      - 'assets/styles.css'

  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-recovery-evidence-validation-drill-decision-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: recovery-evidence-validation-drill-decision-readiness
    runs-on: ubuntu-latest
    # Build 779: exact-commit CI-only success memoization of repeated nested source tests.
    # Distinct tests and all failures still execute; no result is trusted across SHAs.
    env:
      ROSIE_CI_DEDUP_SUBCHECKS: "1"
      PYTHONPATH: ${{ github.workspace }}/scripts/ci-source-cache
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/recovery_evidence_validation_drill_decision_readiness_check.py
          node --check functions/api/_lib/recovery-evidence-validation-drill-decision-readiness.js
          node --check functions/api/admin/recovery_artifact_drill_evidence_review.js
          node --check functions/api/admin/launch_readiness_consolidated.js
          node --check assets/launch-readiness-consolidation.js
          node --check scripts/recovery_evidence_validation_drill_decision_readiness_test.mjs
      - name: Validate recovery evidence & drill decision readiness
        run: |
          python scripts/recovery_evidence_validation_drill_decision_readiness_check.py
          node scripts/recovery_evidence_validation_drill_decision_readiness_test.mjs
