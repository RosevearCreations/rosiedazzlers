name: Build 372 — Fleet Business Rulebook Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-fleet-business-rulebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: Validate fleet business rulebook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate fleet business rulebook authority
        run: |
          python scripts/fleet_business_rulebook_check.py
          node scripts/fleet_business_rulebook_test.mjs

      - name: Build 372 summary
        run: |
          {
            echo "### Build 372 — Fleet Business Rulebook"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Six fleet commercial decision domains explicit: PASS"
            echo "- Live fleet economics unresolved until business approval: PASS"
            echo "- Fleet account/discount/invoice/booking/billing/provider mutation authority: NONE"
            echo "- Existing fleet lead, quote and booking authority preserved: PASS"
            echo "- Build 373 operational boundary preserved: PASS"
            echo "- Schema migration introduced: NO"
          } >> "$GITHUB_STEP_SUMMARY"
