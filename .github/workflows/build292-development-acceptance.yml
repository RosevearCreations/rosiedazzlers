name: Build 292 Development Runtime Acceptance

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build292-development
  cancel-in-progress: true

jobs:
  runtime:
    name: Verify Build 292 fleet workplace runtime
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconfirm Build 292 source authority
        run: |
          python scripts/build292_release_check.py
          python scripts/build291_release_check.py
          python scripts/build290_release_check.py
          node scripts/build290_action_permission_test.mjs
          python scripts/build290_rollback_check.py

      - name: Wait for Development alias and run Build 292 smoke
        run: |
          for attempt in $(seq 1 24); do
            if bash scripts/build292_http_smoke.sh https://dev.rosiedazzlers.pages.dev "Build 292 Development runtime"; then
              exit 0
            fi
            echo "Build 292 Development alias not converged yet (attempt $attempt/24)."
            sleep 10
          done
          exit 1

      - name: Acceptance summary
        run: |
          {
            echo "### Build 292 Development Runtime Acceptance"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Fleet/workplace assessment pages: PASS"
            echo "- Invalid request/contact/timing probes fail before persistence: PASS"
            echo "- No smoke-test lead row created: PASS"
            echo "- Build 291 maintenance and Build 290 authorization/restore authority retained: PASS"
            echo "- No fleet threshold, discount, fixed cadence, contract, appointment or recurring-billing promise is introduced."
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
