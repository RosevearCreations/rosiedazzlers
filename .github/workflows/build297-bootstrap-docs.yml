name: Build 297 Bootstrap Docs

on:
  push:
    branches:
      - build-297-operations-customer-maintainability-extraction
    paths:
      - .github/workflows/build297-bootstrap-docs.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-297-operations-customer-maintainability-extraction
          fetch-depth: 0
      - name: Advance living authorities to Build 297
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          baseline = '337ae533130f4bf1c566d47c2ba1bc712cbf780e'

          handoff = Path('AI_PROJECT_HANDOFF.md')
          h = handoff.read_text(encoding='utf-8')
          h = h.replace('**Build:** 296  ', '**Build:** 297  ', 1)
          old = "Build 296 is the active **My Account maintainability extraction** Development-first slice. It follows the accepted Build 295 Production promotion at SHA `73556e1f41dc204290409294c5e38ad0b2090fb7`.\n\nBuild 295 is the accepted Production baseline while Build 296 is validated. Build 290 remains the retained authorization/direct-URL/API + forward-restore authority, with Build 289 as its verified restore anchor.\n\nBuild 296 follows the normal boundary: exact feature source gate + Cloudflare feature preview first, then a non-force Development fast-forward, then Development source/runtime/Cloudflare acceptance. **Production remains closed** for Build 296 until deliberate promotion from accepted Development evidence."
          new = f"Build 297 is the active **Operations customer support maintainability extraction** Development-first slice. It follows the accepted Build 296 Production promotion at SHA `{baseline}`.\n\nBuild 296 is the accepted Production baseline while Build 297 is validated. Build 290 remains the retained authorization/direct-URL/API + forward-restore authority, with Build 289 as its verified restore anchor.\n\nBuild 297 follows the normal boundary: exact feature source gate + Cloudflare feature preview first, then accepted-tree transfer to Development, then Development source/runtime/Cloudflare acceptance. **Production remains closed** for Build 297 until deliberate promotion from accepted Development evidence."
          if old not in h:
              raise SystemExit('Handoff release-state block not found')
          h = h.replace(old, new, 1)
          h = h.replace('## Completed customer/business work through Build 296', '## Completed customer/business work through Build 297', 1)
          bullet = '- Build 296 extracts the accepted My Account inline module byte-for-byte into `assets/my-account-v296.js`, leaving customer behavior and API authority unchanged while making the account runtime directly syntax-testable.\n'
          if bullet not in h:
              raise SystemExit('Build 296 handoff bullet not found')
          h = h.replace(bullet, bullet + '- Build 297 extracts the accepted Operations customer-support inline runtime byte-for-byte into `assets/admin-customers-v297.js`, retaining customer directory, account assistance, lifecycle and role-gated admin authority unchanged.\n', 1)
          section = "## Build 296 — My Account maintainability extraction\n\nBuild 296 moves the accepted Build 295 inline account module into `assets/my-account-v296.js` without refactoring it. Both route copies remain exact and the external module tag stays in the same execution position after `chrome.js` and `client-auth.js`. The focused guard reconstructs the accepted Build 295 page and proves the only page change is that script extraction. There is no customer behavior, API authority, maintenance-economics or schema change.\n"
          addition = section + "\n## Build 297 — Operations customer support maintainability extraction\n\nBuild 297 moves the accepted Build 296 `admin-customers.html` runtime into `assets/admin-customers-v297.js` without refactoring it. Root and folder routes remain exact, the classic external script stays in the same parser position after the retained admin shell dependencies, and the focused guard reconstructs the accepted Build 296 page to prove that the only page change is the script extraction. There is no admin behavior, API authority, customer-support rule, commercial rule or schema change.\n"
          if section not in h:
              raise SystemExit('Build 296 handoff section not found')
          h = h.replace(section, addition, 1)
          marker = '- Build 296 Development runtime workflow: `.github/workflows/build296-development-acceptance.yml`;\n'
          if marker not in h:
              raise SystemExit('Build 296 validation marker not found')
          h = h.replace(marker, marker + '- Build 297 cumulative Development source workflow: `.github/workflows/build297-development-source-gate.yml`;\n- focused Build 297 guard: `scripts/build297_release_check.py`;\n- Build 297 runtime smoke: `scripts/build297_http_smoke.sh`;\n- Build 297 feature workflow: `.github/workflows/build297-source-gate.yml`;\n- Build 297 Development runtime workflow: `.github/workflows/build297-development-acceptance.yml`;\n', 1)
          h = h.replace('Never call Build 296 Development-green until exact feature SHA + feature preview, exact `dev`, Build 296 cumulative Development source/runtime gates and Cloudflare artifact agree.', 'Never call Build 297 Development-green until exact feature SHA + feature preview, exact `dev`, Build 297 cumulative Development source/runtime gates and Cloudflare artifact agree.', 1)
          h = h.replace('## Next business/product work after Build 296', '## Next business/product work after Build 297', 1)
          handoff.write_text(h, encoding='utf-8')

          roadmap = Path('MASTER_VALUE_ROADMAP.md')
          r = roadmap.read_text(encoding='utf-8')
          r = r.replace('**Build:** 296  ', '**Build:** 297  ', 1)
          r = r.replace('Builds 274–296 added', 'Builds 274–297 added', 1)
          old = 'Build 295 is the accepted Production baseline at `73556e1f41dc204290409294c5e38ad0b2090fb7`. Build 296 is the active Development-first My Account maintainability extraction. **Production remains closed** for Build 296 until deliberate promotion from final exact accepted Development evidence.'
          new = f'Build 296 is the accepted Production baseline at `{baseline}`. Build 297 is the active Development-first Operations customer support maintainability extraction. **Production remains closed** for Build 297 until deliberate promotion from final exact accepted Development evidence.'
          if old not in r:
              raise SystemExit('Roadmap release-state block not found')
          r = r.replace(old, new, 1)
          section = "## Build 296 — My Account maintainability extraction\n\nRules:\n\n- `assets/my-account-v296.js` is byte-for-byte the accepted Build 295 inline module;\n- both My Account route copies are exact and differ from Build 295 only by the external module tag;\n- module execution position and current customer API calls remain unchanged;\n- Builds 288/294/295 remain retained defense in depth;\n- Build 296 adds no customer behavior, API authority, maintenance economics, polling or schema migration.\n"
          addition = section + "\n## Build 297 — Operations customer support maintainability extraction\n\nRules:\n\n- `assets/admin-customers-v297.js` is byte-for-byte the accepted Build 296 inline customer-support runtime;\n- `admin-customers.html` and `admin-customers/index.html` remain exact and differ from Build 296 only by the external classic-script tag;\n- customer directory, account assistance, lifecycle, audit/history and role-gated admin behavior remain unchanged;\n- retained Build 290 authorization/source boundaries remain authoritative;\n- Build 297 adds no admin behavior, API authority, pricing, recurrence, commercial rule, polling or schema migration.\n"
          if section not in r:
              raise SystemExit('Roadmap Build 296 section not found')
          r = r.replace(section, addition, 1)
          r = r.replace('Preferred high-use order: Operations customer/booking/quote support; Finance payments/reconciliation/tax;', 'Preferred high-use order after the Build 297 customer-support extraction: Operations booking/quote support; Finance payments/reconciliation/tax;', 1)
          marker = '- `.github/workflows/build296-development-acceptance.yml` — Build 296 `dev` runtime acceptance;\n'
          if marker not in r:
              raise SystemExit('Roadmap Build 296 validation marker not found')
          r = r.replace(marker, marker + '- `.github/workflows/build297-development-source-gate.yml` — cumulative Development source gate through Build 297;\n- `scripts/build297_release_check.py` — exact Operations customer-support extraction/authority guard;\n- `.github/workflows/build297-source-gate.yml` — Build 297 feature source gate;\n- `scripts/build297_http_smoke.sh` — read-only versioned Operations customer runtime guard;\n- `.github/workflows/build297-development-acceptance.yml` — Build 297 `dev` runtime acceptance;\n', 1)
          roadmap.write_text(r, encoding='utf-8')

          for path in (handoff, roadmap):
              text = path.read_text(encoding='utf-8')
              if '**Build:** 297' not in text or baseline not in text or 'Build 297' not in text:
                  raise SystemExit(f'{path} failed Build 297 authority validation')
          PY
          git diff --check -- AI_PROJECT_HANDOFF.md MASTER_VALUE_ROADMAP.md
      - name: Commit living authority convergence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_PROJECT_HANDOFF.md MASTER_VALUE_ROADMAP.md
          git commit -m 'Build 297 converge living authorities'
          git push origin HEAD:build-297-operations-customer-maintainability-extraction
