name: Reliability Cost Recovery Evidence Continuity Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-reliability-cost-recovery-evidence-continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: reliability-cost-recovery-evidence-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/reliability_cost_recovery_evidence_continuity_check.py
          node --check functions/api/_lib/reliability-cost-recovery-evidence-continuity.js
          node --check functions/api/admin/reliability_security_cost_reassessment.js
          node --check assets/build434-reliability-reassessment.js
          node --check scripts/reliability_cost_recovery_evidence_continuity_test.mjs
      - name: Validate Build 484 source authority
        run: |
          python scripts/reliability_cost_recovery_evidence_continuity_check.py
          node scripts/reliability_cost_recovery_evidence_continuity_test.mjs
      - name: Authority summary
        run: |
          echo "### Reliability, Cost & Recovery Evidence Continuity" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provider cost/quota continuity requires comparable provider-owned evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery continuity requires attributable comparable observations; source/runtime GREEN is not a recovery outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "- Southern Ontario field operability is separate from technical availability and requires explicit service/product/equipment/site evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic scaling, restore, booking/public winter claims, provider/schema/business mutation or polling: NONE" >> "$GITHUB_STEP_SUMMARY"
