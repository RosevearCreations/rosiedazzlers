name: Service Economics Capacity Pricing Review Authority
on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-service-economics-capacity-pricing-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: service-economics-capacity-pricing-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/service_economics_capacity_pricing_review_check.py
          node --check functions/api/_lib/service-economics-commercial-capacity-review.js
          node --check functions/api/admin/service_economics_commercial_capacity_review.js
          node --check assets/build453-service-economics-capacity-pricing-review.js
          node --check scripts/service_economics_capacity_pricing_review_test.mjs
      - name: Validate Build 453 source authority
        run: |
          python scripts/service_economics_capacity_pricing_review_check.py
          node scripts/service_economics_capacity_pricing_review_test.mjs
      - name: Authority summary
        run: |
          echo "### Service Economics, Capacity & Pricing Review" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: `$GITHUB_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Missing cost evidence blocks margin conclusions: YES" >> "$GITHUB_STEP_SUMMARY"
          echo "- Price sensitivity or add-on margin inferred: NO" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic price/discount/booking/accounting/provider action: NONE" >> "$GITHUB_STEP_SUMMARY"
