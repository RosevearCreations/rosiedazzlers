name: Build 295 Bootstrap Authorities

on:
  push:
    branches:
      - build-295-customer-account-source-authority
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rosiedazzlers-build295-bootstrap-authorities
  cancel-in-progress: false

jobs:
  patch:
    name: Integrate Build 295 cumulative authorities
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch cumulative Development gate
        run: python scripts/build295_patch_development_gate.py
      - name: Patch living authorities
        run: python scripts/build295_patch_authorities.py
      - name: Verify authority integration
        run: |
          python scripts/build295_patch_development_gate.py
          python scripts/build295_patch_authorities.py
          git diff --check
          grep -Fq 'Run current Build 295 focused guard' .github/workflows/development-source-gate.yml
          grep -Fq '**Build:** 295' AI_PROJECT_HANDOFF.md
          grep -Fq '**Build:** 295' MASTER_VALUE_ROADMAP.md
          grep -Fq '5d6041501b205a03dd62522a6ffb9a49a822284b' AI_PROJECT_HANDOFF.md
          grep -Fq '5d6041501b205a03dd62522a6ffb9a49a822284b' MASTER_VALUE_ROADMAP.md
      - name: Commit integrated authorities
        run: |
          if git diff --quiet -- .github/workflows/development-source-gate.yml AI_PROJECT_HANDOFF.md MASTER_VALUE_ROADMAP.md; then
            echo "No authority integration commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/development-source-gate.yml AI_PROJECT_HANDOFF.md MASTER_VALUE_ROADMAP.md
          git commit -m "Advance cumulative authorities through Build 295"
          git push origin HEAD:build-295-customer-account-source-authority
