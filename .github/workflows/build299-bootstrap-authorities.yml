name: Build 299 bootstrap release authorities

on:
  push:
    branches:
      - build-299-operations-booking-dashboard-maintainability-extraction

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write Build 299 permanent authorities
        run: |
          python - <<'PY'
          from pathlib import Path

          baseline = '48b2f0f8b8a1f4311b09f79e64e8e8cf64a0f18b'
          production = '337ae533130f4bf1c566d47c2ba1bc712cbf780e'

          release = r'''#!/usr/bin/env python3
          from pathlib import Path
          import subprocess, sys

          ROOT = Path(__file__).resolve().parents[1]
          BASELINE = "48b2f0f8b8a1f4311b09f79e64e8e8cf64a0f18b"
          PRODUCTION = "337ae533130f4bf1c566d47c2ba1bc712cbf780e"
          ASSET = "assets/admin-booking-v299.js"
          PAGES = ["admin-booking.html", "admin-booking/index.html"]
          TAG = '<script type="module" src="/assets/admin-booking-v299.js"></script>'
          errors = []

          def read(rel):
              p = ROOT / rel
              if not p.exists():
                  errors.append(f"missing {rel}")
                  return ""
              return p.read_text(encoding="utf-8", errors="ignore")

          def baseline_page(rel):
              p = subprocess.run(["git", "show", f"{BASELINE}:{rel}"], cwd=ROOT, capture_output=True, text=True)
              if p.returncode:
                  errors.append(f"could not read accepted Build 298 baseline {rel}")
                  return ""
              return p.stdout

          def split_module(text, label):
              marker = '<script type="module">'
              start = text.rfind(marker)
              if start < 0:
                  errors.append(f"{label} missing mature booking module")
                  return None
              body_start = start + len(marker)
              end = text.find('</script>', body_start)
              if end < 0:
                  errors.append(f"{label} missing booking module close")
                  return None
              return start, body_start, end, end + len('</script>')

          for sha, label in [(BASELINE, 'accepted Build 298 Development'), (PRODUCTION, 'accepted Build 296 Production')]:
              if subprocess.run(["git", "merge-base", "--is-ancestor", sha, "HEAD"], cwd=ROOT).returncode:
                  errors.append(f"{label} is not an ancestor of Build 299 candidate")

          roots = [baseline_page(rel) for rel in PAGES]
          if roots[0] and roots[1] and roots[0] != roots[1]:
              errors.append("accepted Build 298 booking route copies differ")
          parts = split_module(roots[0], 'accepted Build 298 admin-booking.html') if roots[0] else None
          if parts:
              start, body_start, end, close_end = parts
              expected_asset = roots[0][body_start:end].lstrip('\n')
              if read(ASSET) != expected_asset:
                  errors.append("versioned booking asset is not byte-for-byte the accepted Build 298 inline runtime")
              expected_page = roots[0][:start] + TAG + roots[0][close_end:]
              for rel in PAGES:
                  body = read(rel)
                  if body != expected_page:
                      errors.append(f"{rel} differs from accepted Build 298 source beyond exact runtime extraction")
                  if TAG not in body:
                      errors.append(f"{rel} missing Build 299 booking runtime tag")

          if read(PAGES[0]) != read(PAGES[1]):
              errors.append("booking route copies are not exact")

          page_tokens = ['data-page="admin-booking"', '/assets/admin-auth.js', '/assets/admin-shell.js', 'id="loadBookingsBtn"', 'id="statusForm"', 'id="assignForm"', 'id="financeForm"', 'Manage bookings and assignments']
          for rel in PAGES:
              body = read(rel)
              for token in page_tokens:
                  if token not in body:
                      errors.append(f"{rel} lost retained booking source token {token}")

          asset = read(ASSET)
          for token in ['/api/admin/bookings', '/api/admin/booking_update', '/api/admin/assign_booking', '/api/admin/staff_assignable_list', '/api/admin/booking_finance', 'credentials: "include"', 'window.AdminShell']:
              if token not in asset:
                  errors.append(f"{ASSET} missing retained runtime token {token}")

          changed = subprocess.run(["git", "diff", "--name-only", f"{BASELINE}...HEAD"], cwd=ROOT, capture_output=True, text=True)
          if changed.returncode:
              errors.append("could not inspect Build 299 changed files")
          else:
              for name in changed.stdout.splitlines():
                  low = name.lower()
                  if 'migration' in low or low.startswith('database') or low.endswith('.sql'):
                      errors.append(f"Build 299 unexpectedly changes schema/migration file {name}")

          required = {
              'BUILD299_SUMMARY.md': ['Build 299', 'Operations Booking Dashboard Support Maintainability Extraction', 'no booking behavior change', 'no database or schema migration'],
              'scripts/build299_http_smoke.sh': ['/assets/admin-booking-v299.js', 'read-only'],
              '.github/workflows/build299-source-gate.yml': ['Build 299 Source Gate', 'scripts/build299_release_check.py'],
              '.github/workflows/build299-development-source-gate.yml': ['Build 299 Development Source Gate', 'scripts/build299_release_check.py'],
              '.github/workflows/build299-development-acceptance.yml': ['Build 299 Development Runtime Acceptance', 'scripts/build299_http_smoke.sh'],
              'AI_PROJECT_HANDOFF.md': ['**Build:** 299', PRODUCTION, 'Operations booking-dashboard support maintainability extraction'],
              'MASTER_VALUE_ROADMAP.md': ['**Build:** 299', PRODUCTION, 'Build 299 — Operations booking-dashboard support maintainability extraction'],
          }
          for rel, tokens in required.items():
              body = read(rel)
              for token in tokens:
                  if token not in body:
                      errors.append(f"{rel} missing {token}")

          for rel in ['.github/workflows/build299-bootstrap-extract-booking-runtime.yml', '.github/workflows/build299-bootstrap-authorities.yml', '.github/workflows/build299-retained-guard-scan.yml']:
              if (ROOT / rel).exists():
                  errors.append(f"temporary Build 299 bootstrap/scan file remains: {rel}")

          syntax = subprocess.run(['node', '--check', str(ROOT / ASSET)], capture_output=True, text=True)
          if syntax.returncode:
              errors.append(f"node --check failed {ASSET}: {syntax.stderr.strip()}")
          smoke = subprocess.run(['bash', '-n', str(ROOT / 'scripts/build299_http_smoke.sh')], capture_output=True, text=True)
          if smoke.returncode:
              errors.append(f"bash -n failed build299_http_smoke.sh: {smoke.stderr.strip()}")

          if errors:
              print('Build 299 Operations booking-dashboard support maintainability extraction check: FAIL')
              for e in errors: print('-', e)
              sys.exit(1)
          print('Build 299 Operations booking-dashboard support maintainability extraction check: PASS')
          print('- accepted Build 298 booking runtime is byte-for-byte preserved in assets/admin-booking-v299.js')
          print('- both booking route copies differ from Build 298 only by the external module tag')
          print('- booking, assignment, intake, vehicle-review and existing finance/document orchestration remain unchanged')
          print('- no booking behavior, API contract, pricing, scheduling rule or schema migration was introduced')
          print('- Production remains accepted Build 296 and stays closed')
          '''
          release = '\n'.join(line[10:] if line.startswith('          ') else line for line in release.splitlines()) + '\n'
          Path('scripts/build299_release_check.py').write_text(release, encoding='utf-8')

          smoke = r'''#!/usr/bin/env bash
          set -euo pipefail
          BASE_URL="${1:-https://dev.rosiedazzlers.pages.dev}"
          echo "Build 299 read-only booking-dashboard smoke against ${BASE_URL}"
          page="$(curl -fsSL --retry 6 --retry-delay 3 "${BASE_URL}/admin-booking.html")"
          asset="$(curl -fsSL --retry 6 --retry-delay 3 "${BASE_URL}/assets/admin-booking-v299.js")"
          grep -Fq '<script type="module" src="/assets/admin-booking-v299.js"></script>' <<<"$page"
          grep -Fq 'Manage bookings and assignments' <<<"$page"
          grep -Fq '/api/admin/bookings' <<<"$asset"
          grep -Fq '/api/admin/booking_update' <<<"$asset"
          grep -Fq '/api/admin/assign_booking' <<<"$asset"
          grep -Fq '/api/admin/booking_finance' <<<"$asset"
          echo "Build 299 read-only booking-dashboard smoke: PASS"
          '''
          smoke = '\n'.join(line[10:] if line.startswith('          ') else line for line in smoke.splitlines()) + '\n'
          Path('scripts/build299_http_smoke.sh').write_text(smoke, encoding='utf-8')

          summary = '''# Build 299 — Operations Booking Dashboard Support Maintainability Extraction\n\nBuild 299 extracts the accepted Build 298 `admin-booking` inline module into `assets/admin-booking-v299.js` without changing its contents or execution authority. Both booking route copies remain exact and differ from Build 298 only by the external module tag.\n\nThis is a maintainability release: there is **no booking behavior change**, no API-contract change, no pricing/package change, no reservation/scheduling-policy change, no recurrence/commercial-rule change, and **no database or schema migration**. Existing booking loading/status updates, staff assignment, intake/media review, vehicle-size verification, customer-document helpers and existing finance-entry orchestration remain unchanged. Server authorization and API validation remain authoritative.\n\nProduction remains accepted Build 296 until deliberate promotion from final exact Development evidence.\n'''
          Path('BUILD299_SUMMARY.md').write_text(summary, encoding='utf-8')

          source = '''name: Build 299 Source Gate\n\non:\n  push:\n    branches:\n      - build-299-operations-booking-dashboard-maintainability-extraction\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: rosiedazzlers-build299-source\n  cancel-in-progress: true\n\njobs:\n  source-gate:\n    name: Validate Build 299 source\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - uses: actions/setup-node@v4\n        with:\n          node-version: "22"\n      - name: Check Build 299 syntax\n        run: |\n          python -m py_compile scripts/build299_release_check.py\n          bash -n scripts/build299_http_smoke.sh\n          node --check assets/admin-booking-v299.js\n      - name: Run retained focused guards through Build 298\n        run: |\n          for build in $(seq 271 298); do python "scripts/build${build}_release_check.py"; done\n      - name: Run Build 299 exact extraction guard\n        run: python scripts/build299_release_check.py\n      - name: Run retained authorization and cumulative guards\n        run: |\n          node scripts/build290_action_permission_test.mjs\n          python scripts/build290_rollback_check.py\n          python scripts/release_check.py\n          python scripts/seo_h1_check.py\n          python scripts/sync_route_copies.py --check\n      - name: Check source hygiene\n        run: git diff --check 48b2f0f8b8a1f4311b09f79e64e8e8cf64a0f18b HEAD -- . ':!*.md'\n'''
          Path('.github/workflows/build299-source-gate.yml').write_text(source, encoding='utf-8')

          devsrc = source.replace('Build 299 Source Gate', 'Build 299 Development Source Gate').replace('      - build-299-operations-booking-dashboard-maintainability-extraction\n', '      - dev\n').replace('rosiedazzlers-build299-source', 'rosiedazzlers-build299-development-source').replace('Validate Build 299 source', 'Validate Development through Build 299')
          Path('.github/workflows/build299-development-source-gate.yml').write_text(devsrc, encoding='utf-8')

          acceptance = '''name: Build 299 Development Runtime Acceptance\n\non:\n  push:\n    branches: [dev]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: rosiedazzlers-build299-development-runtime\n  cancel-in-progress: true\n\njobs:\n  runtime:\n    name: Validate Build 299 Development runtime\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - uses: actions/setup-node@v4\n        with:\n          node-version: "22"\n      - name: Validate exact source first\n        run: python scripts/build299_release_check.py\n      - name: Validate deployed booking-dashboard surface read-only\n        run: bash scripts/build299_http_smoke.sh https://dev.rosiedazzlers.pages.dev\n'''
          Path('.github/workflows/build299-development-acceptance.yml').write_text(acceptance, encoding='utf-8')

          handoff = Path('AI_PROJECT_HANDOFF.md').read_text(encoding='utf-8')
          handoff = handoff.replace('**Build:** 298', '**Build:** 299', 1)
          handoff = handoff.replace('Build 298 is the active **Operations booking/quote support maintainability extraction** Development-first slice. It follows the accepted Build 297 Development checkpoint at SHA `a034182bf8fd5dc8f8025032834ad7be6ec1d762`; accepted Production remains Build 296 at SHA `337ae533130f4bf1c566d47c2ba1bc712cbf780e`.', 'Build 299 is the active **Operations booking-dashboard support maintainability extraction** Development-first slice. It follows the accepted Build 298 Development checkpoint at SHA `48b2f0f8b8a1f4311b09f79e64e8e8cf64a0f18b`; accepted Production remains Build 296 at SHA `337ae533130f4bf1c566d47c2ba1bc712cbf780e`.', 1)
          handoff = handoff.replace('Build 296 is the accepted Production baseline while Build 298 is validated.', 'Build 296 is the accepted Production baseline while Build 299 is validated.', 1)
          handoff = handoff.replace('Production remains closed** for Build 298', 'Production remains closed** for Build 299', 1)
          handoff = handoff.replace('## Completed customer/business work through Build 298', '## Completed customer/business work through Build 299', 1)
          handoff = handoff.replace('- Build 298 extracts the accepted Quote Pipeline inline runtime byte-for-byte into `assets/admin-quotes-v298.js`, retaining quote list/save behavior and the booking bridge unchanged.', '- Build 298 extracts the accepted Quote Pipeline inline runtime byte-for-byte into `assets/admin-quotes-v298.js`, retaining quote list/save behavior and the booking bridge unchanged.\n- Build 299 extracts the accepted Operations booking-dashboard inline runtime byte-for-byte into `assets/admin-booking-v299.js`, retaining booking, assignment, intake/review, customer-document and existing finance orchestration unchanged.', 1)
          Path('AI_PROJECT_HANDOFF.md').write_text(handoff, encoding='utf-8')

          roadmap = Path('MASTER_VALUE_ROADMAP.md').read_text(encoding='utf-8')
          roadmap = roadmap.replace('**Build:** 298', '**Build:** 299', 1)
          roadmap = roadmap.replace('Builds 274–298 added', 'Builds 274–299 added', 1)
          roadmap = roadmap.replace('Build 296 is the accepted Production baseline at `337ae533130f4bf1c566d47c2ba1bc712cbf780e`. Build 297 is the accepted Development checkpoint at `a034182bf8fd5dc8f8025032834ad7be6ec1d762`. Build 298 is the active Development-first Operations booking/quote support maintainability extraction. **Production remains closed** for Build 298 until deliberate promotion from final exact accepted Development evidence.', 'Build 296 is the accepted Production baseline at `337ae533130f4bf1c566d47c2ba1bc712cbf780e`. Build 298 is the accepted Development checkpoint at `48b2f0f8b8a1f4311b09f79e64e8e8cf64a0f18b`. Build 299 is the active Development-first Operations booking-dashboard support maintainability extraction. **Production remains closed** for Build 299 until deliberate promotion from final exact accepted Development evidence.', 1)
          anchor = '## Build 298 — Operations booking/quote support maintainability extraction'
          idx = roadmap.find(anchor)
          if idx < 0: raise SystemExit('Build 298 roadmap anchor missing')
          insert_at = roadmap.find('\n## ', idx + len(anchor))
          if insert_at < 0: insert_at = len(roadmap)
          section = '\n\n## Build 299 — Operations booking-dashboard support maintainability extraction\n\nRules:\n\n- `assets/admin-booking-v299.js` is byte-for-byte the accepted Build 298 inline booking module;\n- `admin-booking.html` and `admin-booking/index.html` remain exact and differ from Build 298 only by the external module tag;\n- booking loading/status, staff assignment, intake/media review, vehicle-size verification, customer-document helpers and existing finance-entry orchestration remain unchanged;\n- server authorization, booking validation, scheduling/conflict and payment/accounting authorities remain unchanged;\n- Build 299 adds no booking behavior, API authority, pricing/package rule, scheduling/recurrence/commercial rule, polling or schema migration.\n'
          roadmap = roadmap[:insert_at] + section + roadmap[insert_at:]
          Path('MASTER_VALUE_ROADMAP.md').write_text(roadmap, encoding='utf-8')
          PY
      - name: Commit permanent Build 299 authorities
        run: |
          git config user.name "John Rosevear"
          git config user.email "jfrosevear@gmail.com"
          git add scripts/build299_release_check.py scripts/build299_http_smoke.sh BUILD299_SUMMARY.md .github/workflows/build299-source-gate.yml .github/workflows/build299-development-source-gate.yml .github/workflows/build299-development-acceptance.yml AI_PROJECT_HANDOFF.md MASTER_VALUE_ROADMAP.md
          if git diff --cached --quiet; then echo "No authority changes."; exit 0; fi
          git commit -m "Build 299 add release authorities"
          git push
