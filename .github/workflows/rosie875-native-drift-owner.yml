name: Rosie Dazzlers 875 Original Provider Signature and Refund Drift Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build875-native-source-drift-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original provider HMAC, refund completeness drift, owner download regression
        run: node scripts/build875_native_drift_export_test.mjs
