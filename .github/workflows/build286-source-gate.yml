name: Build 286 Source Gate

on:
  push:
    branches:
      - build286-customer-review-authority
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build286-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Build 286 source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Build 286 review authority syntax
        run: |
          node --check functions/api/client/reviews_save.js
          node --check assets/customer-review-v286.js
          node --check assets/client-auth.js
          bash -n scripts/build286_http_smoke.sh

      - name: Run retained Builds 271–285 focused guards
        run: |
          for build in $(seq 271 285); do
            python "scripts/build${build}_release_check.py"
          done

      - name: Run Build 286 focused guard
        run: python scripts/build286_release_check.py

      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py

      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py

      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check

      - name: Check source whitespace/conflict markers
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Source gate summary
        run: |
          {
            echo "### Build 286 Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Completed owned booking required for customer review: PASS"
            echo "- Server-side booking ownership/completion verification: PASS"
            echo "- Caller vehicle/source/Google URL authority removed: PASS"
            echo "- Explicit reuse consent remains approval-gated: PASS"
            echo "- Completed-bookings-only account selector: PASS"
            echo "- Retained Builds 271–285 + Build 286 + cumulative release chain: PASS"
            echo "- No schema migration, payment authority or referral economics introduced."
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
