name: Rosie 881 Separate GitHub Ed25519 Rotation Receipt Digest Anchors
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: rosie881-original-rotation-signed-external-anchor
  cancel-in-progress: false
jobs:
  independent-rotation-digest-anchors:
    if: github.repository == 'RosevearCreations/rosiedazzlers'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently sign and read back external receipt digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ROSIE881_ANCHOR_JOB_SECRET: ${{ secrets.ROSIE881_ANCHOR_JOB_SECRET }}
          ROSIE881_EXTERNAL_ANCHOR_PRIVATE_JWK: ${{ secrets.ROSIE881_EXTERNAL_ANCHOR_PRIVATE_JWK }}
        run: node scripts/build881_independent_anchor_runner.mjs
