name: Build 305 Source Gate

on:
  push:
    branches:
      - build305-finance-authorization-sweep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build305-source
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Build 305 source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Build 305 syntax
        run: |
          node --check functions/api/_lib/admin-finance-actions.js
          node --check functions/api/admin/_middleware.js
          node --check scripts/build305_finance_action_test.mjs
          bash -n scripts/build305_http_smoke.sh

      - name: Retain accepted Finance authorities through Build 304
        run: |
          python scripts/build300_release_check.py
          python scripts/build301_release_check.py
          python scripts/build302_release_check.py
          python scripts/build303_release_check.py
          python scripts/build304_release_check.py

      - name: Run Build 305 Finance action matrix
        run: node scripts/build305_finance_action_test.mjs

      - name: Run Build 305 focused guard
        run: python scripts/build305_release_check.py

      - name: Run cumulative authority guards
        run: |
          python scripts/release_check.py
          python scripts/seo_h1_check.py
          python scripts/sync_route_copies.py --check

      - name: Check source hygiene
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Summary
        run: |
          {
            echo "### Build 305 Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Finance route/method scan: PASS"
            echo "- Seven-action role/profile matrix: PASS"
            echo "- Builds 300-304 Finance authority retained: PASS"
            echo "- Schema/database mutation: NONE"
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
