name: Booking & Quote Experiment Readiness Authority
on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-booking-quote-experiment-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: booking-quote-experiment-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/booking_quote_experiment_readiness_check.py
          node --check scripts/booking_quote_experiment_readiness_test.mjs
          node --check functions/api/_lib/booking-funnel-quote-pricing-learning.js
          node --check functions/api/admin/booking_funnel_quote_pricing_learning.js
          node --check assets/build451-booking-funnel-quote-pricing-learning.js
      - name: Validate Build 461 source authority
        run: |
          python scripts/booking_quote_experiment_readiness_check.py
          python scripts/booking_funnel_quote_pricing_learning_check.py
          node scripts/booking_funnel_quote_pricing_learning_test.mjs
          python scripts/booking_quote_retention_production_learning_check.py
          node scripts/booking_quote_retention_production_learning_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 461 — Booking & Quote Experiment Readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: `$GITHUB_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing Build 451 workbench reused: YES" >> "$GITHUB_STEP_SUMMARY"
          echo "- Owner-review hypotheses only: YES" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic experiment/pricing/discount/booking-rule/outreach mutation: NONE" >> "$GITHUB_STEP_SUMMARY"
