          node --check functions/api/_lib/retention-maintenance-fleet-operational-pilot.js
          node --check functions/api/admin/retention_maintenance_fleet_operational_pilot.js
          python -m py_compile scripts/media_photo_studio_proof_operations_check.py
          node --check scripts/media_photo_studio_proof_operations_test.mjs
          node --check functions/api/_lib/media-photo-studio-proof-operations.js
