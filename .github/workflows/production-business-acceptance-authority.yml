          node --check functions/api/admin/service_economics_commercial_capacity_review.js
          node --check assets/build453-service-economics-capacity-pricing-review.js
          node --check functions/api/_lib/recovery-artifact-drill-evidence-review.js
          node --check functions/api/admin/recovery_artifact_drill_evidence_review.js
