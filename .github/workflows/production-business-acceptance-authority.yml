          node --check functions/api/_lib/recovery-export-operational-proof.js
          node --check functions/api/admin/recovery_export_operational_proof.js
          python -m py_compile scripts/production_workflow_evidence_check.py
          node --check scripts/production_workflow_evidence_test.mjs
          node --check functions/api/_lib/production-workflow-evidence.js
          node --check functions/api/admin/production_workflow_evidence.js
          python -m py_compile scripts/local_acquisition_evidence_closure_check.py
