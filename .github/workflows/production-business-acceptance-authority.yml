name: Production Business Acceptance & Exact-SHA Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-production-business-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-path-authority:
    name: Validate Production business acceptance source contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Production authority syntax
        run: |
          python -m py_compile scripts/production_business_acceptance_check.py
          python -m py_compile scripts/build408_media_r2_operational_acceptance_check.py
          python -m py_compile scripts/build409_inventory_job_cost_operational_evidence_check.py
          python -m py_compile scripts/build410_maintenance_fleet_commercial_acceptance_check.py
          python -m py_compile scripts/customer_communication_consent_delivery_check.py
          python -m py_compile scripts/production_support_diagnostics_check.py
          python -m py_compile scripts/workflow_efficiency_accessibility_check.py
          python -m py_compile scripts/local_search_measurement_authority_check.py
          python -m py_compile scripts/launch_readiness_consolidation_check.py
          python -m py_compile scripts/controlled_soft_launch_acceptance_check.py
          node --check scripts/controlled_soft_launch_acceptance_test.mjs
          python -m py_compile scripts/provider_evidence_closure_check.py
          node --check scripts/provider_evidence_closure_test.mjs
          node --check functions/api/_lib/provider-evidence-closure.js
          node --check functions/api/admin/provider_evidence_closure.js
          python -m py_compile scripts/provider_outcome_delivery_evidence_closure_check.py
          python -m py_compile scripts/provider_evidence_reconciliation_refresh_check.py
          node --check scripts/provider_evidence_reconciliation_refresh_test.mjs
          node --check functions/api/_lib/provider-evidence-reconciliation-refresh.js
          python -m py_compile scripts/provider_evidence_closure_availability_review_check.py
          node --check scripts/provider_evidence_closure_availability_review_test.mjs
          node --check functions/api/_lib/provider-evidence-closure-availability-review.js
          node --check functions/api/admin/provider_evidence_reconciliation_refresh.js
          node --check scripts/provider_outcome_delivery_evidence_closure_test.mjs
          node --check functions/api/_lib/provider-outcome-delivery-evidence.js
          node --check functions/api/admin/provider_outcome_delivery_evidence.js
          python -m py_compile scripts/recovery_artifact_drill_evidence_review_check.py
          node --check scripts/recovery_artifact_drill_evidence_review_test.mjs
          python -m py_compile scripts/recovery_evidence_closure_drill_readiness_check.py
          node --check scripts/recovery_evidence_closure_drill_readiness_test.mjs
          node --check functions/api/_lib/recovery-evidence-closure-drill-readiness.js
          python -m py_compile scripts/authenticated_device_acceptance_closure_check.py
          node --check scripts/authenticated_device_acceptance_closure_test.mjs
          python -m py_compile scripts/authenticated_cross_device_acceptance_refresh_check.py
          node --check scripts/authenticated_cross_device_acceptance_refresh_test.mjs
          python -m py_compile scripts/fleet_maintenance_commercial_decision_closure_check.py
          node --check scripts/fleet_maintenance_commercial_decision_closure_test.mjs
          python -m py_compile scripts/fleet_maintenance_commercial_activation_readiness_check.py
          node --check scripts/fleet_maintenance_commercial_activation_readiness_test.mjs
          python -m py_compile scripts/local_search_measurement_conversion_attribution_check.py
          node --check scripts/local_search_measurement_conversion_attribution_test.mjs
          node --check functions/api/_lib/local-search-measurement-conversion-attribution.js
