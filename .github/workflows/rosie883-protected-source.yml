name: Rosie 883 Original Signed Execution Ledger, Owner Renewal and Anchor Recovery Source Gate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build883-signed-custody-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original signed receipts, owner renewal, anchor exception classification and retained 882
        run: |
          node scripts/build883_execution_receipt_renewal_recovery_test.mjs
          node scripts/build882_enrollment_anchor_ack_test.mjs
          node scripts/build881_scheduled_anchor_grace_test.mjs
