name: Build 384 — Finance Cockpit & Month-End UX

on:
  push:
    branches:
      - dev
      - main
      - 'build384-*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build384-finance-cockpit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-authority:
    name: Validate Build 384 Finance cockpit and month-end UX
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded Finance cockpit authority
        run: python3 scripts/finance_cockpit_month_end_ux_check.py
      - name: Syntax-check Finance cockpit JavaScript
        run: |
          node --check apps/finance/finance-cockpit.js
          node --check functions/api/admin/accounting_month_end_closure.js
          node --check functions/api/_lib/accounting-month-end-closure.js

  production-exact-sha:
    name: Verify exact Production deployment
    needs: source-authority
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}
      CF_PROJECT_NAME: rosiedazzlers
      CF_PRODUCTION_BRANCH: main
      CF_PRODUCTION_URL: https://rosiedazzlers.ca
    steps:
      - name: Check out exact Production SHA
        uses: actions/checkout@v4
      - name: Prove exact Cloudflare Production deployment and runtime
        run: bash scripts/cloudflare_pages_production_acceptance.sh
