name: Build 289 Source Gate
on:
  push:
    branches: [build289-accessibility-network-resilience]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-build289-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-gate:
    name: Validate Build 289 source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Check Build 289 syntax
        run: |
          node --check assets/account-resilience-v289.js
          node --check assets/client-auth.js
          bash -n scripts/build289_http_smoke.sh
      - name: Run retained Builds 271-288 focused guards
        run: |
          for build in $(seq 271 288); do python "scripts/build${build}_release_check.py"; done
      - name: Run Build 289 focused guard
        run: python scripts/build289_release_check.py
      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py
      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py
      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check
      - name: Check source hygiene
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then exit 2; fi
      - name: Summary
        run: |
          {
            echo "### Build 289 Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Accessible account live-status/focus layer: PASS"
            echo "- Direct signed-out account recovery: PASS"
            echo "- User-initiated weak-network retry only: PASS"
            echo "- Retained Builds 271-288 + Build 289 + cumulative guards: PASS"
            echo "- No schema/pricing/booking/deposit/payment change."
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
