name: Build 407 — Payment Provider Live-Outcome & Reconciliation Acceptance

on:
  push:
    branches:
      - build407-payment-provider-live-outcome-reconciliation
      - dev
      - main
    paths:
      - "BUILD407_PAYMENT_PROVIDER_LIVE_OUTCOME_RECONCILIATION_ACCEPTANCE.md"
      - "BUILD406_GO_LIVE_EVIDENCE_PROVIDER_READINESS_CONVERGENCE.md"
      - "FORWARD_BUILD_ROADMAP_405_415.md"
      - "AUTONOMOUS_RELEASE_QUEUE.md"
      - "AI_PROJECT_HANDOFF.md"
      - "README.md"
      - "STARTUP_GO_LIVE_BLOCKERS.md"
      - "admin/it.html"
      - "functions/api/admin/go_live_readiness.js"
      - "functions/api/stripe/webhook.js"
      - "functions/api/paypal/webhook.js"
      - "functions/api/_lib/quote-payment-events.js"
      - "scripts/build407_payment_provider_live_outcome_reconciliation_check.py"
      - ".github/workflows/payment-provider-live-outcome-reconciliation-authority.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build407-authority:
    name: build407 authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build 407 readiness endpoint syntax
        run: node --check functions/api/admin/go_live_readiness.js
      - name: Build 407 payment-provider live-outcome/reconciliation authority
        run: python scripts/build407_payment_provider_live_outcome_reconciliation_check.py
      - name: Retained Build 406 readiness authority
        run: python scripts/build406_go_live_evidence_provider_readiness_convergence_check.py
      - name: Release authority convergence
        run: python scripts/release_authority_documentation_convergence_check.py

  verify-production:
    name: Verify exact Production deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build407-authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ROSIEDAZZLERS_TOKEN }}
      CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.sha }}
      CF_PROJECT_NAME: rosiedazzlers
      CF_PRODUCTION_BRANCH: main
      CF_PRODUCTION_URL: https://rosiedazzlers.ca
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Cloudflare Production deployment and runtime
        shell: bash
        run: bash scripts/cloudflare_pages_production_acceptance.sh
