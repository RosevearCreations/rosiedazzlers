name: Controlled-Environment Routing & Capacity Evidence Integrity Review Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-controlled-environment-routing-capacity-integrity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: controlled-environment-routing-capacity-evidence-integrity-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Controlled-Environment Routing & Capacity Evidence Integrity Review
        run: |
          python scripts/controlled_environment_routing_capacity_evidence_integrity_review_check.py
          node scripts/controlled_environment_routing_capacity_evidence_integrity_review_test.mjs
      - name: Build 538 summary
        run: |
          {
            echo '### Controlled-Environment Routing & Capacity Evidence Integrity Review'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Retained Build 528 routing/capacity freshness authority: REVALIDATED'
            echo '- Service/site/workflow identity: EXPLICIT OR REVIEW'
            echo '- Route/site-confirmation/safe-reschedule identity: EXPLICIT OR REVIEW'
            echo '- Bounded observed-capacity context: EXACT SNAPSHOT OR REVIEW'
            echo '- Universal indoor capability / another-service operability / future capacity inference: NONE'
            echo '- Supabase/schema/storage/persistent telemetry growth: NONE'
            echo '- Automatic routing/reschedule/capacity reservation/HOLD mutation: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
