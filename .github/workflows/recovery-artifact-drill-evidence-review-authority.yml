name: Build 447 — Recovery Artifact & Drill Evidence Review Authority
on:
  push:
    branches: [dev, main]
    # Build 778: optional domain authority. Required aggregate source gate is unchanged.
    paths:
      - '**/*recovery*'
      - '**/*backup*'
      - '**/*restore*'
      - '**/*authenticated-device*'
      - '**/*device*'
      - '.github/workflows/recovery-artifact-drill-evidence-review-authority.yml'
      - 'functions/api/_lib/staff-auth.js'
      - 'functions/_middleware.js'
      - 'scripts/release_check.py'
      - 'scripts/ci-source-cache/**'
      - 'assets/styles.css'

  pull_request:
    branches: [dev, main]
    # Build 778: optional domain authority. Required aggregate source gate is unchanged.
    paths:
      - '**/*recovery*'
      - '**/*backup*'
      - '**/*restore*'
      - '**/*authenticated-device*'
      - '**/*device*'
      - '.github/workflows/recovery-artifact-drill-evidence-review-authority.yml'
      - 'functions/api/_lib/staff-auth.js'
      - 'functions/_middleware.js'
      - 'scripts/release_check.py'
      - 'scripts/ci-source-cache/**'
      - 'assets/styles.css'

  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-build447-recovery-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: recovery-artifact-drill-evidence-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate source
        run: |
          python -m py_compile scripts/recovery_artifact_drill_evidence_review_check.py
          node --check functions/api/_lib/recovery-artifact-drill-evidence-review.js
          node --check functions/api/admin/recovery_artifact_drill_evidence_review.js
          node --check scripts/recovery_artifact_drill_evidence_review_test.mjs
          python scripts/recovery_artifact_drill_evidence_review_check.py
