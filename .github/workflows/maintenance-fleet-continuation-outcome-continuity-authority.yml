name: Build 521 — Maintenance & Fleet Continuation Outcome Continuity Authority

on:
  push:
    branches:
      - dev
      - main
      - 'build*'
      - 'release*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-maintenance-fleet-continuation-outcome-continuity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: maintenance-fleet-continuation-outcome-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          python -m py_compile scripts/maintenance_fleet_continuation_outcome_continuity_check.py
          node --check scripts/maintenance_fleet_continuation_outcome_continuity_test.mjs
          node --check functions/api/_lib/maintenance-fleet-continuation-outcome-continuity.js
          node --check functions/api/admin/maintenance_fleet_pilot_continuation_decision.js
          node --check assets/build439-maintenance-fleet-owner-approval.js
      - name: Validate Build 521 source authority
        run: |
          python scripts/maintenance_fleet_continuation_outcome_continuity_check.py
          node scripts/maintenance_fleet_continuation_outcome_continuity_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 521 — Maintenance & Fleet Continuation Outcome Continuity" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retained Build 511 explicit owner decision plus Build 501/491 current evidence are authoritative" >> "$GITHUB_STEP_SUMMARY"
          echo "- Continue outcomes require exact decision-trace match, explicit authorization and later observation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered stop conditions require review" >> "$GITHUB_STEP_SUMMARY"
          echo "- Enrollment, recurring billing, booking mutation, capacity reservation and canonical HOLD mutation: NONE" >> "$GITHUB_STEP_SUMMARY"
