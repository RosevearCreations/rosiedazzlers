name: Build 285 Source Gate

on:
  push:
    branches:
      - build285-customer-rebook-handoff
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosiedazzlers-build285-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    name: Validate Build 285 source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Build 285 customer rebook syntax
        run: |
          node --check assets/customer-rebook-v285.js
          node --check assets/client-auth.js
          node --check assets/pricing-catalog-client.js
          bash -n scripts/build285_http_smoke.sh
          bash -n scripts/development_http_smoke.sh

      # The loop below explicitly includes the retained Build 283 guard:
      # python scripts/build283_release_check.py
      - name: Run retained Builds 271–284 focused guards
        run: |
          for build in $(seq 271 284); do
            python "scripts/build${build}_release_check.py"
          done

      - name: Run Build 285 focused guard
        run: python scripts/build285_release_check.py

      - name: Run cumulative Rosie release guard
        run: python scripts/release_check.py

      - name: Check one-H1 source rule
        run: python scripts/seo_h1_check.py

      - name: Check route-copy parity
        run: python scripts/sync_route_copies.py --check

      - name: Check source whitespace/conflict markers
        run: |
          git diff --check HEAD^ -- . ':!*.md'
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ':!*.md'; then
            echo "::error::Merge-conflict markers remain in source."
            exit 2
          fi

      - name: Source gate summary
        run: |
          {
            echo "### Build 285 Source Gate"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Authenticated customer-history rebook CTA: PASS"
            echo "- Package/date-only handoff + authenticated history verification: PASS"
            echo "- Current package catalogue / Garage controls remain authoritative: PASS"
            echo "- Retired/unavailable service fails closed without substitution: PASS"
            echo "- Current size, availability, add-ons, price, deposit and payment rules remain current: PASS"
            echo "- Retained Builds 271–284 + Build 285 + cumulative release chain: PASS"
            echo "- No schema migration or payment authority introduced."
            echo "- Production remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
