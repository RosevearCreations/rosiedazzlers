name: Build 492 — Booking & Quote Controlled Experiment Execution Evidence Authority
on:
  push:
    branches: [dev, main, 'build*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosiedazzlers-booking-quote-controlled-experiment-execution-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    name: booking-quote-controlled-experiment-execution-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate syntax
        run: |
          python -m py_compile scripts/booking_quote_controlled_experiment_execution_evidence_check.py
          node --check functions/api/_lib/booking-quote-controlled-experiment-execution-evidence.js
          node --check functions/api/_lib/booking-funnel-quote-pricing-learning.js
          node --check functions/api/admin/booking_funnel_quote_pricing_learning.js
          node --check scripts/booking_quote_controlled_experiment_execution_evidence_test.mjs
      - name: Validate Build 492 source authority
        run: |
          python scripts/booking_quote_controlled_experiment_execution_evidence_check.py
          node scripts/booking_quote_controlled_experiment_execution_evidence_test.mjs
      - name: Authority summary
        run: |
          echo "### Build 492 — Booking & Quote Controlled Experiment Execution Evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Measurement lock is governance, not execution authorization" >> "$GITHUB_STEP_SUMMARY"
          echo "- Allocation/duration, weather eligibility, stop conditions and outcome capture require observed evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Weather-ineligible sessions stay outside the conversion denominator" >> "$GITHUB_STEP_SUMMARY"
          echo "- Winner selection, success claims and pricing/booking/availability/outreach/provider/schema mutation: NONE" >> "$GITHUB_STEP_SUMMARY"
