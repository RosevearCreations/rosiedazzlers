name: Build 303 Bootstrap Documentation Sync

on:
  push:
    branches:
      - feature/build-303-tax-support-extraction
    paths:
      - .github/workflows/build303-bootstrap-doc-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build303-doc-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize living Build 303 authority
        run: python scripts/build303_doc_sync.py
      - name: Validate retained and current release guards
        run: |
          python scripts/build301_release_check.py
          python scripts/build302_release_check.py
          python scripts/build303_release_check.py
      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_PROJECT_HANDOFF.md MASTER_VALUE_ROADMAP.md AUTONOMOUS_RELEASE_QUEUE.md
          git diff --cached --check
          git commit -m "Build 303: synchronize living release authority"
          git push origin HEAD:${{ github.ref_name }}
