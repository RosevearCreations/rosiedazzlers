name: Trusted WORM Evidence Operations

on:
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:
    inputs:
      write_snapshot:
        description: 'Write an immutable S3 Object Lock snapshot (owner only)'
        required: true
        default: false
        type: boolean
      owner_approved:
        description: 'Confirm separate documented owner approval for permanent retention'
        required: true
        default: false
        type: boolean
      owner_approval_ref:
        description: 'Exact approval evidence reference, e.g. issue:123'
        required: false
        type: string

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: rosiedazzlers-worm-evidence-operations
  cancel-in-progress: false

jobs:
  retention-operations:
    name: Owner-scoped WORM evidence collection
    if: github.ref == 'refs/heads/main' && vars.RD_WORM_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify retention contract tests and AWS CLI
        run: |
          node scripts/release_incident_s3_worm_adapter_test.mjs
          node scripts/release_incident_worm_operations_test.mjs
          aws --version
      - name: Obtain short-lived independent archive credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.RD_WORM_ROLE_ARN }}
          aws-region: ${{ vars.RD_WORM_REGION }}
      - name: Inspect receipts, verify lock and conditionally retain snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RD_WORM_OWNER: RosevearCreations
          RD_WORM_ENABLED: ${{ vars.RD_WORM_ENABLED }}
          RD_WORM_BUCKET: ${{ vars.RD_WORM_BUCKET }}
          RD_WORM_REGION: ${{ vars.RD_WORM_REGION }}
          RD_WORM_ACCOUNT_ID: ${{ vars.RD_WORM_ACCOUNT_ID }}
          RD_WORM_RETENTION_DAYS: ${{ vars.RD_WORM_RETENTION_DAYS }}
          RD_WORM_ISSUE_NUMBER: ${{ vars.RD_WORM_ISSUE_NUMBER }}
          RD_WORM_WRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.write_snapshot && 'true' || 'false' }}
          RD_WORM_OWNER_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_approved && 'true' || 'false' }}
          RD_WORM_APPROVAL_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_approval_ref || '' }}
        run: node scripts/release_incident_worm_operations.mjs
