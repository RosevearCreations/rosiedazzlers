name: Build 295 Bootstrap Account Source

on:
  push:
    branches:
      - build-295-customer-account-source-authority
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rosiedazzlers-build295-bootstrap-account-source
  cancel-in-progress: false

jobs:
  patch:
    name: Patch legacy My Account source
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded Build 295 account patch
        run: |
          python scripts/build295_patch_my_account.py
          cp my-account.html my-account/index.html
      - name: Patch cumulative gate and living authorities
        run: python scripts/build295_patch_authorities.py
      - name: Verify patched source
        run: |
          python scripts/build295_patch_my_account.py
          python scripts/build295_patch_authorities.py
          cmp -s my-account.html my-account/index.html
          git diff --check
          for page in my-account.html my-account/index.html; do
            grep -Fq 'data-build295-account-source-authority' "$page"
            if grep -Eq 'acctAdminNotes|vehAdminNotes|vehNextDue|vehNextServiceMileage|vehIntervalDays|vehAutoSchedule|unlock maintenance pricing|reduced maintenance pricing|reduced repeat-clean pricing|Maintenance eligible' "$page"; then
              echo "::error::Unsafe legacy account authority remains in $page."
              exit 2
            fi
          done
          grep -Fq 'Run current Build 295 focused guard' .github/workflows/development-source-gate.yml
          grep -Fq '**Build:** 295' AI_PROJECT_HANDOFF.md
          grep -Fq '**Build:** 295' MASTER_VALUE_ROADMAP.md
      - name: Commit patched authorities
        run: |
          if git diff --quiet -- my-account.html my-account/index.html .github/workflows/development-source-gate.yml AI_PROJECT_HANDOFF.md MASTER_VALUE_ROADMAP.md; then
            echo "No authority patch commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-account.html my-account/index.html .github/workflows/development-source-gate.yml AI_PROJECT_HANDOFF.md MASTER_VALUE_ROADMAP.md
          git commit -m "Advance cumulative authorities through Build 295"
          git push origin HEAD:build-295-customer-account-source-authority
