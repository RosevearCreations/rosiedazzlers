<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Secure Final Balance Payment | Rosie Dazzlers</title>
  <meta name="description" content="Secure final-balance payment status and checkout for a Rosie Dazzlers service." />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <link rel="stylesheet" href="/assets/site.css" />
  <style>
    .payment-shell{max-width:760px;margin:0 auto}.payment-card{padding:clamp(20px,4vw,38px)}.payment-amount{font-size:clamp(2rem,7vw,3.2rem);font-weight:800;letter-spacing:-.04em;margin:.35rem 0 1rem}.payment-state{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.payment-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.payment-meta{display:grid;gap:8px;margin-top:18px}.payment-meta div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
  </style>
</head>
<body data-page="final-balance-payment">
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/"><img data-logo alt="Rosie Dazzlers logo" /><strong>Rosie Dazzlers</strong></a>
      <a class="btn ghost small" href="/contact.html">Contact us</a>
    </div>
  </header>
  <main class="container">
    <section class="section payment-shell">
      <article class="panel payment-card">
        <div class="badge">Secure payment</div>
        <h1 style="margin:10px 0 6px">Final balance payment</h1>
        <p class="kicker" id="paymentIntro">Checking your secure payment request…</p>
        <div id="paymentContent" aria-live="polite"><div class="notice">Loading payment status…</div></div>
        <div class="panel" data-needs-visual data-visual-placeholder="secure_payment" aria-hidden="true" style="margin-top:18px;padding:0;overflow:hidden"></div>
      </article>
    </section>
  </main>
  <footer class="footer container" data-footer></footer>
  <script src="/assets/chrome.js"></script>
  <script>
    (function(){
      const content=document.getElementById('paymentContent');
      const intro=document.getElementById('paymentIntro');
      const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      const money=(c,currency)=>new Intl.NumberFormat('en-CA',{style:'currency',currency:currency||'CAD'}).format(Number(c||0)/100);
      const when=value=>{try{return new Intl.DateTimeFormat('en-CA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value));}catch{return ''}};
      const query=new URLSearchParams(location.search);
      const requestId=(query.get('request_id')||'').trim(); const token=(query.get('token')||'').trim(); const returned=query.get('payment');
      function problem(message){intro.textContent='Payment assistance';content.innerHTML=`<div class="notice bad"><strong>We could not open this payment request.</strong><p>${esc(message)}</p><div class="payment-actions"><a class="btn primary" href="/contact.html">Contact Rosie Dazzlers</a></div></div>`;}
      function render(payment){
        const state=String(payment.state||payment.status||'open').toLowerCase();
        const amount=money(payment.amount_cents,payment.currency);
        if(state==='paid'){
          intro.textContent='Payment received'; content.innerHTML=`<div class="payment-state"><span class="badge">Payment received</span></div><div class="payment-amount">${esc(amount)}</div><div class="notice ok">Thank you. Rosie Dazzlers has recorded this final-balance payment${payment.paid_at?` on ${esc(when(payment.paid_at))}`:''}.</div>`; return;
        }
        if(state==='cancelled'||state==='expired'){
          intro.textContent=state==='expired'?'This link has expired':'This request is closed'; content.innerHTML=`<div class="payment-state"><span class="badge">${state==='expired'?'Link expired':'Payment request closed'}</span></div><div class="payment-amount">${esc(amount)}</div><div class="notice warn">Please contact Rosie Dazzlers for an updated payment request.</div><div class="payment-actions"><a class="btn primary" href="/contact.html">Contact Rosie Dazzlers</a></div>`; return;
        }
        intro.textContent=returned==='cancelled'?'Your payment was not completed. The request remains open.':'Review your secure final-balance payment request.';
        content.innerHTML=`<div class="payment-state"><span class="badge">Secure checkout</span>${payment.expires_at?`<span class="badge">Expires ${esc(when(payment.expires_at))}</span>`:''}</div><div class="payment-amount">${esc(amount)}</div><div class="payment-actions">${payment.checkout_url?`<a class="btn primary" target="_blank" rel="noopener" href="${esc(payment.checkout_url)}">Continue to secure checkout</a>`:'<a class="btn primary" href="/contact.html">Contact us to pay</a>'}<a class="btn ghost" href="/contact.html">Need help?</a></div><div class="payment-meta"><div><strong>Your card details are handled by the payment provider.</strong><br><span class="muted">Rosie Dazzlers does not ask for card numbers by email or text.</span></div></div>`;
      }
      async function load(){
        if(!requestId||!token){problem('This secure link is incomplete. Please use the full link supplied by Rosie Dazzlers.');return;}
        try{const res=await fetch(`/api/final_balance_payment_view?request_id=${encodeURIComponent(requestId)}&token=${encodeURIComponent(token)}`,{cache:'no-store',headers:{Accept:'application/json'}});const data=await res.json().catch(()=>({})); if(!res.ok && !data.payment)throw new Error(data.error||'This payment request is unavailable.'); if(data.payment){render(data.payment);if(data.error&&data.payment.state!=='open')intro.textContent=data.error;} else throw new Error(data.error||'This payment request is unavailable.');}catch(err){problem(err.message||'This payment request is unavailable.');}
      }
      load();
    })();
  </script>
</body>
</html>
